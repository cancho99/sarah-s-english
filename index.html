// ---------- 자료실: 학생별 학습 자료 업로드/다운로드 ----------
// One doc per file in MATERIALS_COLLECTION (see fetchMaterials/addMaterial/deleteMaterial above),
// not embedded in the meta doc or the student's own doc, since files here are inline base64 and
// would blow the 1MB doc cap. Each doc carries a studentId and every fetch is scoped to just one
// student — teacher uploads from inside that student's panel, student/parent only ever see their
// own student's materials, never another student's.
function fmtFileSize(kb) {
  if (kb >= 1024) return (kb / 1024).toFixed(1) + "MB";
  return Math.round(kb) + "KB";
}
const MATERIAL_MAX_FILE_BYTES = 700 * 1024; // raw size cap — base64 (~+37%) plus metadata stays safely under Firestore's 1MB per-doc limit

function MaterialsLibrarySection({ student, readOnly, shared }) {
  const [items, setItems] = useState(null); // null = loading
  const [err, setErr] = useState("");
  const [title, setTitle] = useState("");
  const [subject, setSubject] = useState("");
  const [level, setLevel] = useState("");
  const [note, setNote] = useState("");
  const [uploading, setUploading] = useState(false);
  const [uploadMsg, setUploadMsg] = useState("");

  async function load() {
    try {
      setItems(shared ? await fetchSharedMaterials() : await fetchMaterials(student.id));
    } catch (e) {
      setErr("자료 목록을 불러오지 못했어요: " + String(e.message || e));
    }
  }
  useEffect(() => { load(); }, [shared, student?.id]);

  async function handleFile(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    if (!title.trim()) { setUploadMsg("먼저 제목을 입력해 주세요."); return; }
    if (file.size > MATERIAL_MAX_FILE_BYTES) {
      setUploadMsg(`파일이 너무 커요 (${Math.round(file.size / 1024)}KB). ${Math.round(MATERIAL_MAX_FILE_BYTES / 1024)}KB 이하로 올려 주세요.`);
      return;
    }
    setUploading(true);
    setUploadMsg("업로드 중...");
    try {
      const dataUrl = await fileToDataURL(file);
      const entry = {
        title: title.trim(), subject: subject.trim(), level: level.trim(), note: note.trim(),
        fileName: file.name, fileType: file.type || "", fileSizeKB: Math.round(file.size / 1024), dataUrl,
      };
      if (shared) await addSharedMaterial(entry);
      else await addMaterial({ ...entry, studentId: student.id });
      setTitle(""); setSubject(""); setLevel(""); setNote("");
      setUploadMsg("업로드했어요.");
      await load();
    } catch (e) {
      setUploadMsg("업로드에 실패했어요: " + String(e.message || e).slice(0, 200));
    } finally {
      setUploading(false);
    }
  }

  async function handleDelete(id, itemTitle) {
    if (!confirm(`"${itemTitle}" 자료를 삭제할까요?`)) return;
    try {
      if (shared) await deleteSharedMaterial(id);
      else await deleteMaterial(id);
      setItems((list) => (list || []).filter((m) => m.id !== id));
    } catch (e) {
      alert("삭제에 실패했어요: " + String(e.message || e));
    }
  }

  if (err) return html`<div style=${{ color: C.danger, fontSize: 13 }}>${err}</div>`;
  if (items === null) return html`<${Empty} text="불러오는 중..." />`;

  return html`
    <div>
      <div style=${{ fontSize: 12, color: C.slate, marginBottom: 12 }}>${shared ? "전체 학생에게 공개되는 공유 자료예요." : readOnly ? "선생님이 올려주신 나만의 학습 자료예요." : `${student.name} 학생에게만 보이는 자료예요.`}</div>

      ${!readOnly && html`
        <${Card} style=${{ marginBottom: 16 }}>
          <div style=${{ fontWeight: 700, color: C.navy, marginBottom: 10, fontSize: 13.5 }}>새 자료 올리기</div>
          <input style=${{ ...inputStyle, marginBottom: 8 }} placeholder="제목 (필수)" value=${title} onChange=${(e) => setTitle(e.target.value)} />
          <div style=${{ display: "flex", gap: 8, marginBottom: 8 }}>
            <input style=${inputStyle} placeholder="과목 (선택, 예: 문법)" value=${subject} onChange=${(e) => setSubject(e.target.value)} />
            <input style=${inputStyle} placeholder="레벨 (선택, 예: 중2)" value=${level} onChange=${(e) => setLevel(e.target.value)} />
          </div>
          <textarea style=${{ ...inputStyle, marginBottom: 8, minHeight: 50 }} placeholder="설명 (선택)" value=${note} onChange=${(e) => setNote(e.target.value)} />
          <input type="file" onChange=${handleFile} disabled=${uploading || !title.trim()} style=${{ fontSize: 12.5 }} />
          <div style=${{ fontSize: 11, color: C.slate, marginTop: 6 }}>파일당 ${Math.round(MATERIAL_MAX_FILE_BYTES / 1024)}KB까지 올릴 수 있어요.</div>
          ${uploadMsg && html`<div style=${{ fontSize: 12, color: C.navy, marginTop: 6 }}>${uploadMsg}</div>`}
        <//>
      `}

      ${items.length === 0
        ? html`<${Empty} text="아직 등록된 자료가 없어요." />`
        : items.map((m) => html`
          <${Card} key=${m.id} style=${{ marginBottom: 10 }}>
            <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 }}>
              <div style=${{ minWidth: 0, flex: 1 }}>
                <div style=${{ fontWeight: 700, color: C.navy, fontSize: 13.5 }}>${m.title}</div>
                <div style=${{ fontSize: 11, color: C.slate, marginTop: 3 }}>${[m.subject, m.level].filter(Boolean).join(" · ")}${(m.subject || m.level) ? " · " : ""}${fmtFileSize(m.fileSizeKB || 0)}</div>
                ${m.note && html`<div style=${{ fontSize: 12, color: C.ink, marginTop: 4 }}>${m.note}</div>`}
              </div>
              <div style=${{ display: "flex", flexDirection: "column", gap: 6, alignItems: "flex-end", flexShrink: 0 }}>
                <a href=${m.dataUrl} download=${m.fileName} style=${{ fontSize: 12, fontWeight: 700, color: C.gold, textDecoration: "none", border: `1px solid ${C.gold}`, borderRadius: 3, padding: "5px 10px" }}>다운로드</a>
                ${!readOnly && html`<button onClick=${() => handleDelete(m.id, m.title)} style=${{ background: "none", border: "none", color: C.danger, fontSize: 11.5, cursor: "pointer", padding: 0 }}>삭제</button>`}
              </div>
            </div>
          <//>
        `)}
    </div>
  `;
}

function BookingsCalendar({ items, selected, onSelect }) {
  const [viewDate, setViewDate] = useState(() => (selected ? new Date(selected + "T00:00:00") : new Date()));
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const startWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const weekdays = ["일", "월", "화", "수", "목", "금", "토"];
  const countByDate = {};
  (items || []).forEach((b) => { countByDate[b.date] = (countByDate[b.date] || 0) + 1; });
  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  function fmt(d) { return `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`; }
  return html`
    <div style=${{ border: `1px solid ${C.line}`, borderRadius: 4, padding: 14, background: C.white }}>
      <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
        <button type="button" onClick=${() => setViewDate(new Date(year, month - 1, 1))} style=${{ background: "none", border: "none", color: C.navy, cursor: "pointer", fontSize: 16, padding: "2px 8px" }}>‹</button>
        <div style=${{ ...serif, fontSize: 15, color: C.navy, fontWeight: 700 }}>${year}년 ${month + 1}월</div>
        <button type="button" onClick=${() => setViewDate(new Date(year, month + 1, 1))} style=${{ background: "none", border: "none", color: C.navy, cursor: "pointer", fontSize: 16, padding: "2px 8px" }}>›</button>
      </div>
      <div style=${{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 3, marginBottom: 2 }}>
        ${weekdays.map((w, i) => html`<div key=${i} style=${{ textAlign: "center", fontSize: 11, color: C.slate, fontWeight: 700, padding: "5px 0" }}>${w}</div>`)}
      </div>
      <div style=${{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 3 }}>
        ${cells.map((d, i) => {
          if (d === null) return html`<div key=${i}></div>`;
          const dateStr = fmt(d);
          const isSelected = dateStr === selected;
          const count = countByDate[dateStr] || 0;
          return html`
            <div key=${i} onClick=${() => onSelect(dateStr)} style=${{
              textAlign: "center", padding: "8px 0 6px", fontSize: 13, borderRadius: 3, cursor: "pointer", position: "relative",
              color: isSelected ? C.white : C.ink,

function LevelTestBookingsOverview({ bookings, saveBookingsList, roster, ensureData, dataCache, updateData, onBack, onLogout }) {
  const [loaded, setLoaded] = useState(false);
  const [viewMode, setViewMode] = useState("calendar"); // "calendar" | "list"
  const [resultDrafts, setResultDrafts] = useState({});

  useEffect(() => {
    let cancelled = false;
    (async () => {
      for (const s of roster || []) { await ensureData(s.id); if (cancelled) return; }
      if (!cancelled) setLoaded(true);
    })();
    return () => { cancelled = true; };
  }, []);

  const bookingItems = (bookings || []).map((b) => ({
    _source: "booking", id: b.id, date: b.date, time: b.time, name: b.name, grade: b.grade, kind: b.kind || "레벨테스트",
    phone: b.phone, school: b.school, level: b.level, note: b.note, status: b.status || "대기", result: b.result, venue: b.venue,
  }));
  const consultItems = [];
  (roster || []).forEach((s) => {
    const d = dataCache[s.id] || emptyData();
    (d.consultRequests || []).forEach((r) => {
      const first = (r.choices || [])[0] || {};
      consultItems.push({
        _source: "consult", _studentId: s.id, id: r.id, date: first.date || "", time: first.time || "",
        name: s.name, grade: "", kind: "학부모상담", method: r.method, note: r.note, status: r.status || "대기", result: r.result,
      });
    });
  });
  const allItems = [...bookingItems, ...consultItems].filter((it) => it.date);
  const dates = [...new Set(allItems.map((it) => it.date))].sort();
  const [selectedDate, setSelectedDate] = useState(() => dates[0] || today());

  async function setStatus(item, status) {
    if (item._source === "booking") {
      await saveBookingsList((bookings || []).map((b) => (b.id === item.id ? { ...b, status } : b)));
    } else {
      await updateData(item._studentId, (d) => ({ ...d, consultRequests: (d.consultRequests || []).map((r) => (r.id === item.id ? { ...r, status } : r)) }));
    }
  }
  async function remove(item) {
    if (item._source === "booking") {
      await saveBookingsList((bookings || []).filter((b) => b.id !== item.id));
    } else {
      await updateData(item._studentId, (d) => ({ ...d, consultRequests: (d.consultRequests || []).filter((r) => r.id !== item.id) }));
    }
  }
  async function saveResult(item) {
    const text = resultDrafts[item.id] != null ? resultDrafts[item.id] : "";
    if (item._source === "booking") {
      await saveBookingsList((bookings || []).map((b) => (b.id === item.id ? { ...b, result: text } : b)));
    } else {
      await updateData(item._studentId, (d) => ({ ...d, consultRequests: (d.consultRequests || []).map((r) => (r.id === item.id ? { ...r, result: text } : r)) }));
    }
  }

  const dayList = allItems.filter((it) => it.date === selectedDate);
  const sortedAll = [...allItems].sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));

  return html`
    <div>
      <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
        <${BackBtn} onClick=${onBack} />
        <button onClick=${onLogout} style=${{ background: "none", border: "none", color: C.slate, fontSize: 12.5, cursor: "pointer" }}>로그아웃</button>
      </div>
      <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
        <div style=${{ ...serif, fontSize: 19, color: C.navy }}>레벨테스트 · 상담 예약 현황</div>
        <div style=${{ display: "flex", gap: 6 }}>
          <${Button} variant=${viewMode === "calendar" ? "gold" : "ghost"} style=${{ padding: "6px 14px", fontSize: 12 }} onClick=${() => setViewMode("calendar")}>달력<//>
          <${Button} variant=${viewMode === "list" ? "gold" : "ghost"} style=${{ padding: "6px 14px", fontSize: 12 }} onClick=${() => setViewMode("list")}>전체 목록<//>
        </div>
      </div>
      <div style=${{ fontSize: 12, color: C.slate, marginBottom: 14 }}>레벨테스트·상담 예약뿐 아니라, 학부모님이 각 학생 화면에서 신청한 상담 요청도 함께 모아 보여드려요.</div>
      ${allItems.length === 0 && !loaded ? html`<${Empty} text="불러오는 중..." />` : allItems.length === 0 ? html`<${Empty} text="아직 접수된 예약이나 상담 요청이 없어요." />` : viewMode === "list" ? html`
        ${sortedAll.map((item) => html`
          <${BookingEntryCard} key=${item._source + item.id} item=${item}
            onSetStatus=${(it, st) => setStatus(it, st)} onRemove=${remove} onSaveResult=${saveResult}
            resultDraft=${resultDrafts[item.id]} onDraftChange=${(v) => setResultDrafts((prev) => ({ ...prev, [item.id]: v }))} />
        `)}
      ` : html`
        <div className="ap-split">
          <div className="ap-split-left">
            <${BookingsCalendar} items=${allItems} selected=${selectedDate} onSelect=${setSelectedDate} />
          </div>
          <div className="ap-split-right">
            <div style=${{ fontSize: 12.5, color: C.slate, marginBottom: 12 }}>${fmtDateDay(selectedDate)} · ${dayList.length}건</div>
            ${dayList.length === 0 && html`<${Empty} text="이 날짜엔 예약이 없어요. 달력에서 점(●)이 있는 날짜를 눌러 보세요." />`}
            ${dayList.map((item) => html`
              <${BookingEntryCard} key=${item._source + item.id} item=${item}
                onSetStatus=${(it, st) => setStatus(it, st)} onRemove=${remove} onSaveResult=${saveResult}
                resultDraft=${resultDrafts[item.id]} onDraftChange=${(v) => setResultDrafts((prev) => ({ ...prev, [item.id]: v }))} />
            `)}
          </div>
        </div>
      `}
    </div>
  `;
}

function HomeworkStatusOverview({ roster, ensureData, dataCache, updateData, onBack, onLogout }) {
  const [loaded, setLoaded] = useState(false);
  const [studentFilter, setStudentFilter] = useState("");
  const [selected, setSelected] = useState({}); // "studentId|homeworkId" -> true
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      for (const s of roster) { await ensureData(s.id); if (cancelled) return; }
      if (!cancelled) setLoaded(true);
    })();
    return () => { cancelled = true; };
  }, []);

  const todayStr = today();
  const byDate = {};
  roster.forEach((s) => {
    if (studentFilter && s.id !== studentFilter) return;
    const d = dataCache[s.id] || emptyData();
    (d.homework || []).forEach((h) => {
      if (h.done || h.expired) return; // only show incomplete, non-expired homework
      const date = h.dueDate || h.assignedDate;
      if (!date) return;
      (byDate[date] || (byDate[date] = [])).push({ student: s, hw: h });
    });
  });
  const dates = Object.keys(byDate).sort((a, b) => b.localeCompare(a));

  function rowKey(studentId, hwId) { return studentId + "|" + hwId; }
  function toggleRow(studentId, hwId) {
    const k = rowKey(studentId, hwId);
    setSelected((s) => { const n = { ...s }; if (n[k]) delete n[k]; else n[k] = true; return n; });
  }
  const selectedCount = Object.keys(selected).length;

  // Bulk "완료 처리" — lets the teacher clear homework off this overview after checking it in
  // person, without opening each student's own panel. Grouped by student since each write goes
  // through that student's own document.
  async function completeSelected() {
    if (selectedCount === 0) return;
    setBusy(true);
    try {
      const byStudent = {};
      Object.keys(selected).forEach((k) => {
        const [studentId, hwId] = k.split("|");
        (byStudent[studentId] || (byStudent[studentId] = [])).push(hwId);
      });
      for (const [studentId, hwIds] of Object.entries(byStudent)) {
        await updateData(studentId, (d) => ({
          ...d,
          homework: (d.homework || []).map((h) => (hwIds.includes(h.id) ? { ...h, done: true } : h)),
        }));
      }
      setSelected({});
    } finally {
      setBusy(false);
    }
  }

  // Bulk "기간만료 처리" — closes out stale homework (done:false stays, so 숙제 진행율 still
  // counts it against the student) without falsely marking it complete, and gets it off every
  // active nagging list (this one included, since the filter above skips expired items).
  async function expireSelected() {
    if (selectedCount === 0) return;
    setBusy(true);
    try {
      const byStudent = {};
      Object.keys(selected).forEach((k) => {
        const [studentId, hwId] = k.split("|");
        (byStudent[studentId] || (byStudent[studentId] = [])).push(hwId);
      });
      for (const [studentId, hwIds] of Object.entries(byStudent)) {
        await updateData(studentId, (d) => ({
          ...d,
          homework: (d.homework || []).map((h) => (hwIds.includes(h.id) ? { ...h, expired: true } : h)),
        }));
      }
      setSelected({});
    } finally {
      setBusy(false);
    }
  }

  return html`
    <div>
      <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
        <${BackBtn} onClick=${onBack} />
        <button onClick=${onLogout} style=${{ background: "none", border: "none", color: C.slate, fontSize: 12.5, cursor: "pointer" }}>로그아웃</button>
      </div>
      <div style=${{ ...serif, fontSize: 19, color: C.navy, marginBottom: 10 }}>숙제 현황 <span style=${{ fontSize: 12, color: C.slate, fontWeight: 400 }}>(미완료만 표시)</span></div>

      <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", gap: 10, marginBottom: 4, flexWrap: "wrap" }}>
        <${Field} label="학생 필터">
          <select style=${{ ...inputStyle, minWidth: 180 }} value=${studentFilter} onChange=${(e) => setStudentFilter(e.target.value)}>
            <option value="">전체 학생</option>
            ${roster.map((s) => html`<option key=${s.id} value=${s.id}>${s.name}</option>`)}
          </select>
        <//>
        <div style=${{ display: "flex", gap: 8, marginBottom: 12 }}>
          <${Button} variant="gold" disabled=${selectedCount === 0 || busy} onClick=${completeSelected} style=${{ padding: "9px 16px", fontSize: 12.5 }}>
            ${busy ? "처리 중..." : selectedCount > 0 ? `선택한 ${selectedCount}건 완료 처리` : "완료 처리할 항목 선택"}
          <//>
          <${Button} variant="danger" disabled=${selectedCount === 0 || busy} onClick=${expireSelected} style=${{ padding: "9px 16px", fontSize: 12.5 }}>
            기간만료 처리
          <//>
        </div>
      </div>

      ${!loaded ? html`<${Empty} text="불러오는 중..." />` : dates.length === 0 ? html`<${Empty} text="미완료 숙제가 없어요." />` : dates.map((date) => {
        const rows = byDate[date];
        const isOverdue = date < todayStr;
        const isToday = date === todayStr;
        return html`
          <div key=${date} style=${{ marginTop: 20 }}>
            <div style=${{ fontSize: 12, fontWeight: 700, color: isOverdue ? C.danger : C.gold, letterSpacing: 1, marginBottom: 8, borderBottom: `1px solid ${C.line}`, paddingBottom: 6 }}>
              ${fmtDate(date)}${isOverdue ? " · 마감 지남" : isToday ? " · 오늘 마감" : ""}
            </div>
            <div style=${{ overflowX: "auto", border: `1px solid ${C.line}`, borderRadius: 4 }}>
              <table style=${{ width: "100%", borderCollapse: "collapse", fontSize: 12.5, minWidth: 480 }}>
                <thead>
                  <tr style=${{ background: C.ivory }}>
                    <th style=${{ padding: "8px 10px", width: 32 }}></th>
                    <th style=${{ padding: "8px 10px", textAlign: "left", color: C.navy, fontSize: 11 }}>학생</th>
                    <th style=${{ padding: "8px 10px", textAlign: "left", color: C.navy, fontSize: 11 }}>숙제 내용</th>
                    <th style=${{ padding: "8px 10px", textAlign: "left", color: C.navy, fontSize: 11, width: 96 }}>상태</th>
                  </tr>
                </thead>
                <tbody>
                  ${rows.map((r) => {
                    const k = rowKey(r.student.id, r.hw.id);
                    return html`
                      <tr key=${k} style=${{ borderTop: `1px solid ${C.line}`, background: selected[k] ? "#FBF6EA" : undefined }}>
                        <td style=${{ padding: "8px 10px" }}><input type="checkbox" checked=${!!selected[k]} onChange=${() => toggleRow(r.student.id, r.hw.id)} /></td>
                        <td style=${{ padding: "8px 10px", fontWeight: 700, color: C.navy, whiteSpace: "nowrap" }}>${r.student.name}</td>
                        <td style=${{ padding: "8px 10px", whiteSpace: "pre-wrap" }}>${r.hw.content}</td>
                        <td style=${{ padding: "8px 10px" }}>
                          <span style=${{ fontSize: 11, fontWeight: 700, padding: "2px 8px", borderRadius: 20, background: isOverdue ? "#F7E9E6" : "#FBF4EA", color: isOverdue ? C.danger : C.gold, whiteSpace: "nowrap" }}>${isOverdue ? "✗ 마감지남" : "미완료"}</span>
                        </td>
                      </tr>
                    `;
                  })}
                </tbody>
              </table>
            </div>
          </div>
        `;
      })}
    </div>
  `;
}

const MASTER_SCHEDULE_DAY_NAMES = ["일", "월", "화", "수", "목", "금", "토"];
function scheduleTimeToMin(t) { const [h, m] = t.split(":").map(Number); return h * 60 + m; }
function scheduleMinToTime(min) { const h = Math.floor(min / 60) % 24; const m = min % 60; return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`; }
// Wall-clock label for a row, given as a raw (possibly >1440) minute value — minutes past midnight
// are marked "다음날" so a class running e.g. 23:00~01:00 has somewhere distinct to render its
// last hour, instead of colliding with the very-early-morning rows at the top of the same column.
function scheduleSlotLabel(min) { return scheduleMinToTime(min) + (min >= 1440 ? " (다음날)" : ""); }
// Row axis covers 00:00 through 01:00 "the next day" (raw minutes 0~1500) — not just a plain
// 00:00~23:30 day — so classes that run past midnight (e.g. 23:00~01:00) have rows to span into
// instead of quietly having their last hour clipped off the grid.
// 10-min resolution (not 30) so a class starting on a non-half-hour minute (e.g. 19:40) still lands
// on an exact grid row — previously off-grid start times saved fine but silently failed to render
// (no matching row → the block was dropped), which looked like "추가가 안 된다" to the teacher.
const MASTER_SCHEDULE_TIME_SLOTS = (() => {
  const slots = [];
  for (let m = 0; m <= 25 * 60; m += 10) slots.push(m);
  return slots;
})();

// Aggregates every student's weekly recurring pattern (student.schedule) into one grid so the
// teacher can see the whole week at a glance instead of opening each student one at a time.
// Editing here writes straight back into that student's schedule array via saveRosterList — same
// underlying data ScheduleGoalEditor edits per-student, just a different view onto it.
// "학기 중" reuses the existing student.schedule field (unchanged — still what drives
// MonthlyScheduleGrid/tuition/next-class everywhere else in the app). "방학" is a separate,
// parallel field (student.vacationSchedule) that only exists as a second pattern to plan and view
// here — it's intentionally NOT wired into the calendar/tuition calculation automatically. When a
// vacation period actually starts, the teacher still applies it the existing way (adjust the
// "학기 중" pattern itself, or use monthlyInstances for that month) — this tab is a planning
// surface, not a live scheduler that swaps itself in on certain dates.
const SCHEDULE_TABS = [
  { key: "schedule", label: "학기 중 스케줄" },
  { key: "vacationSchedule", label: "방학 스케줄" },
];

// Baseline visible range per tab when "빈 시간대도 보기" is off — always shown in full regardless
// of actual bookings (widened, never narrowed, by MasterScheduleView when an entry falls outside it).
const MASTER_SCHEDULE_BASE_RANGE = {
  schedule: [13 * 60, 24 * 60], // 학기 중: 13:00 ~ 자정
  vacationSchedule: [10 * 60, 24 * 60], // 방학: 10:00 ~ 자정
};

function MasterScheduleView({ roster, saveRosterList }) {
  const [scheduleField, setScheduleField] = useState("schedule");
  const [editing, setEditing] = useState(null); // { studentId, idx, day, time, endTime }
  const [showEmpty, setShowEmpty] = useState(false);
  const [dragOverKey, setDragOverKey] = useState(null); // "day|time" of the cell currently under the drag
  const [draggingKey, setDraggingKey] = useState(null); // "studentId|idx" of the chip being dragged
  const [adding, setAdding] = useState(null); // { studentId, day, time, endTime } while the add-slot form is open

  // Resolve every schedule entry to a concrete start/end in minutes. Entries saved before endTime
  // existed default to a 1-hour block for display purposes only — the stored data isn't touched
  // until the teacher actually edits that slot. endTime is just a plain HH:MM (an <input
  // type="time"> can't express "next day"), so if it comes out <= startMin we treat that as
  // crossing midnight (+1440) rather than a negative-length class.
  const allEntries = [];
  roster.forEach((r) => {
    (r[scheduleField] || []).forEach((s, idx) => {
      const startMin = scheduleTimeToMin(s.time);
      let endMinRaw = s.endTime ? scheduleTimeToMin(s.endTime) : startMin + 60;
      if (endMinRaw <= startMin) endMinRaw += 1440;
      const endMin = Math.max(startMin + 30, endMinRaw);
      allEntries.push({ student: r, idx, day: s.day, time: s.time, endTime: s.endTime, startMin, endMin });
    });
  });

  // Default view always shows a fixed baseline range per tab (학기 중: 13:00~자정, 방학:
  // 10:00~자정) regardless of whether every slot in it has a class — every 30-min row in that
  // range is rendered even if nothing is scheduled there, so gaps between classes show up as
  // visibly blank rows instead of disappearing. That baseline is widened (never narrowed) to also
  // cover any actual entry that falls outside it (e.g. an early-morning or past-midnight class).
  // "빈 시간대도 보기" below switches to the full 00:00~"01:00 다음날" day instead.
  // Rows are raw minute integers (0~1500) so a class crossing midnight has real, distinct rows to
  // span into instead of colliding with the very-early-morning rows at the top of the same day's column.
  const visibleSlots = (() => {
    if (showEmpty) return MASTER_SCHEDULE_TIME_SLOTS;
    const [baseStart, baseEnd] = MASTER_SCHEDULE_BASE_RANGE[scheduleField];
    let rangeStart = baseStart, rangeEnd = baseEnd;
    if (allEntries.length > 0) {
      rangeStart = Math.min(rangeStart, ...allEntries.map((e) => e.startMin));
      rangeEnd = Math.max(rangeEnd, ...allEntries.map((e) => e.endMin));
    }
    return MASTER_SCHEDULE_TIME_SLOTS.filter((t) => t >= rangeStart && t < rangeEnd);
  })();
  const rowsToRender = visibleSlots.length > 0 ? visibleSlots : MASTER_SCHEDULE_TIME_SLOTS.slice(18, 30);
  const rowIndexOf = {};
  rowsToRender.forEach((t, i) => { rowIndexOf[t] = i; });
  const dayColIndex = {};
  MASTER_SCHEDULE_DAY_NAMES.forEach((d, i) => { dayColIndex[d] = i; });

  // Group by (day, start time) so multiple students starting at the same slot stack inside one
  // spanning block instead of each needing their own row-span calculation.
  const groups = {};
  allEntries.forEach((e) => {
    const key = e.day + "|" + e.time;
    (groups[key] || (groups[key] = [])).push(e);
  });

  // Desktop-only drag-to-reschedule: dragstart stows the moved entry's identity + duration in
  // dataTransfer, drop reads it back and writes the new day/time (keeping the same duration) via
  // the usual saveRosterList path. Native HTML5 drag-and-drop has effectively no touch support, so
  // this is intentionally in addition to (not instead of) the click-to-edit modal, not a mobile feature.
  function onChipDragStart(entry) {
    return (evt) => {
      setDraggingKey(entry.student.id + "|" + entry.idx);
      evt.dataTransfer.effectAllowed = "move";
      evt.dataTransfer.setData("application/json", JSON.stringify({ studentId: entry.student.id, idx: entry.idx, durationMin: entry.endMin - entry.startMin }));
    };
  }
  function onChipDragEnd() { setDraggingKey(null); setDragOverKey(null); }
  function onCellDragOver(day, time) {
    return (evt) => { evt.preventDefault(); evt.dataTransfer.dropEffect = "move"; setDragOverKey(day + "|" + time); };
  }
  function onCellDrop(day, time) {
    return async (evt) => {
      evt.preventDefault();
      setDragOverKey(null); setDraggingKey(null);
      let payload;
      try { payload = JSON.parse(evt.dataTransfer.getData("application/json")); } catch { return; }
      if (!payload) return;
      const { studentId, idx, durationMin } = payload;
      const newEndTime = scheduleMinToTime(scheduleTimeToMin(time) + durationMin);
      await saveRosterList(roster.map((r) => (r.id === studentId ? { ...r, [scheduleField]: r[scheduleField].map((s, i) => (i === idx ? { day, time, endTime: newEndTime } : s)) } : r)));
    };
  }

  const bgCells = [];
  bgCells.push(html`<div key="corner" style=${{ gridColumn: 1, gridRow: 1, position: "sticky", left: 0, top: 0, background: C.ivory, zIndex: 3 }}></div>`);
  MASTER_SCHEDULE_DAY_NAMES.forEach((d, ci) => bgCells.push(html`
    <div key=${"h-" + d} style=${{ gridColumn: ci + 2, gridRow: 1, textAlign: "center", fontSize: 12, fontWeight: 700, color: C.navy, padding: "8px 2px", borderBottom: `2px solid ${C.line}`, position: "sticky", top: 0, background: C.ivory, zIndex: 2 }}>${d}</div>
  `));
  rowsToRender.forEach((rawMin, ri) => {
    const timeStr = scheduleMinToTime(rawMin);
    const onHalfHour = rawMin % 30 === 0;
    bgCells.push(html`<div key=${"t-" + rawMin} style=${{ gridColumn: 1, gridRow: ri + 2, fontSize: 10.5, color: C.slate, padding: "3px 6px", borderTop: `1px solid ${C.line}`, whiteSpace: "nowrap", position: "sticky", left: 0, background: C.ivory, zIndex: 2 }}>${onHalfHour ? scheduleSlotLabel(rawMin) : ""}</div>`);
    MASTER_SCHEDULE_DAY_NAMES.forEach((day, ci) => {
      const key = day + "|" + timeStr;
      bgCells.push(html`<div key=${"bg-" + key + "-" + rawMin} onDragOver=${onCellDragOver(day, timeStr)} onDrop=${onCellDrop(day, timeStr)}
        style=${{ gridColumn: ci + 2, gridRow: ri + 2, borderTop: `1px solid ${C.line}`, borderLeft: `1px solid ${C.line}`, minHeight: 14, background: dragOverKey === key ? "#FBF6EA" : undefined }}></div>`);
    });
  });

  // Blocks are keyed by each entry's exact stored time, which for legacy data (saved before this
  // 10-min grid, or anything hand-edited) might not land on a grid row at all. Snap to the nearest
  // rendered row at or before the start instead of dropping the block — a block MUST always render
  // somewhere once its data exists, since a silently-missing block reads to the teacher as "the add
  // didn't work" when it actually did save.
  const blocks = Object.entries(groups).map(([key, list]) => {
    const [day, time] = key.split("|");
    const startMin = scheduleTimeToMin(time);
    let startRow = rowIndexOf[startMin];
    if (startRow === undefined) {
      const priorRows = rowsToRender.filter((t) => t <= startMin);
      if (priorRows.length === 0) return null;
      startRow = rowIndexOf[Math.max(...priorRows)];
    }
    const maxEndMin = Math.max(...list.map((e) => e.endMin));
    const spanRows = Math.max(1, Math.round((maxEndMin - startMin) / 10));
    return html`
      <div key=${"blk-" + key} onDragOver=${onCellDragOver(day, time)} onDrop=${onCellDrop(day, time)}
        style=${{ gridColumn: dayColIndex[day] + 2, gridRow: `${startRow + 2} / span ${spanRows}`, padding: 3, display: "flex", flexDirection: "column", gap: 2, overflow: "hidden", background: dragOverKey === key ? "#FBF6EA" : undefined }}>
        ${list.map((e) => html`
          <div key=${e.student.id + "-" + e.idx} draggable="true" onDragStart=${onChipDragStart(e)} onDragEnd=${onChipDragEnd}
            onClick=${() => setEditing({ studentId: e.student.id, idx: e.idx, day: e.day, time: e.time, endTime: e.endTime || "" })}
            style=${{
              fontSize: 10.5, fontWeight: 700, color: C.navy, background: "#FBF4EA", border: `1px solid ${C.gold}`, borderRadius: 3,
              padding: "3px 5px", cursor: "grab", lineHeight: 1.4, opacity: draggingKey === (e.student.id + "|" + e.idx) ? 0.4 : 1,
              // Within a shared block (several students starting at the same time), each chip's
              // own height is proportional to ITS OWN duration, not squashed to a uniform size —
              // a 30-min entry and a 2-hour entry sharing a start time look visibly different sizes.
              flexGrow: Math.max(1, e.endMin - e.startMin), flexBasis: 0, display: "flex", flexDirection: "column", justifyContent: "center",
            }}>
            ${e.student.name}${e.endTime ? html`<div style=${{ fontWeight: 400, color: C.slate, fontSize: 9.5 }}>${e.time}~${e.endTime}</div>` : html`<div style=${{ fontWeight: 400, color: C.danger, fontSize: 9.5 }}>종료시간 미설정</div>`}
          </div>
        `)}
      </div>
    `;
  }).filter(Boolean);

  async function saveEdit() {
    const { studentId, idx, day, time, endTime } = editing;
    if (!time || !endTime) return;
    await saveRosterList(roster.map((r) => (r.id === studentId ? { ...r, [scheduleField]: r[scheduleField].map((s, i) => (i === idx ? { day, time, endTime } : s)) } : r)));
    setEditing(null);
  }
  async function deleteEdit() {
    const { studentId, idx } = editing;
    await saveRosterList(roster.map((r) => (r.id === studentId ? { ...r, [scheduleField]: r[scheduleField].filter((_, i) => i !== idx) } : r)));
    setEditing(null);
  }
  async function saveAdd() {
    const { studentId, day, time, endTime } = adding;
    if (!studentId || !day || !time || !endTime) return;
    await saveRosterList(roster.map((r) => (r.id === studentId ? { ...r, [scheduleField]: [...(r[scheduleField] || []), { day, time, endTime }] } : r)));
    setAdding(null);
  }

  const addStudent = adding && roster.find((r) => r.id === adding.studentId);

  return html`
    <div>
      <div style=${{ ...serif, fontSize: 19, color: C.navy, marginBottom: 4 }}>내 수업 스케줄</div>
      <div style=${{ fontSize: 12, color: C.slate, marginBottom: 10 }}>모든 학생의 매주 반복 수업을 시작~종료 시간 블록으로 한눈에 봐요. 블록을 누르면 시간을 바로 수정하거나 삭제할 수 있고, PC에서는 블록을 다른 칸으로 끌어다 놓아도 시간이 바뀌어요 (수업 길이는 그대로 유지돼요. 터치 기기에서는 드래그 대신 눌러서 수정해 주세요).</div>

      <div style=${{ display: "flex", gap: 6, marginBottom: 12 }}>
        ${SCHEDULE_TABS.map((t) => html`
          <button key=${t.key} onClick=${() => setScheduleField(t.key)} style=${{
            padding: "8px 16px", borderRadius: 20, border: `1px solid ${scheduleField === t.key ? C.navy : C.line}`,
            background: scheduleField === t.key ? C.navy : "#fff", color: scheduleField === t.key ? "#fff" : C.ink,
            fontWeight: 700, fontSize: 12.5, cursor: "pointer",
          }}>${t.label}</button>
        `)}
      </div>
      ${scheduleField === "vacationSchedule" && html`
        <div style=${{ fontSize: 11.5, color: C.slate, background: C.ivory, border: `1px solid ${C.line}`, borderRadius: 4, padding: "8px 12px", marginBottom: 12 }}>
          방학 스케줄은 별도로 보관하는 계획표예요 — 여기서 편집해도 실제 달력·수업료 계산에는 자동 반영되지 않아요. 방학이 시작되면 "학기 중 스케줄" 탭이나 각 학생의 월별 확정 일정에 실제로 옮겨 적용해 주세요.
        </div>
      `}

      <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12, flexWrap: "wrap", gap: 8 }}>
        <label style=${{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: C.slate, cursor: "pointer" }}>
          <input type="checkbox" checked=${showEmpty} onChange=${(e) => setShowEmpty(e.target.checked)} />
          빈 시간대도 보기 (00:00 ~ 다음날 01:00 전체)
        </label>
        <${Button} variant="ghost" style=${{ padding: "6px 12px", fontSize: 11.5 }} onClick=${() => setAdding({ studentId: roster[0]?.id || "", day: "월", time: "18:00", endTime: "19:00" })}>+ 새 수업 추가<//>
      </div>

      <div style=${{ overflow: "auto", maxHeight: "70vh", border: `1px solid ${C.line}`, borderRadius: 4 }}>
        <div style=${{ display: "grid", gridTemplateColumns: `58px repeat(7, minmax(96px, 1fr))`, minWidth: 740, position: "relative" }}>
          ${bgCells}
          ${blocks}
        </div>
      </div>

      ${adding && html`
        <${Modal} onClose=${() => setAdding(null)}>
          <div style=${{ ...serif, fontSize: 17, color: C.navy, marginBottom: 14 }}>${SCHEDULE_TABS.find((t) => t.key === scheduleField).label}에 새 수업 추가</div>
          <${Field} label="학생">
            <select style=${inputStyle} value=${adding.studentId} onChange=${(e) => setAdding({ ...adding, studentId: e.target.value })}>
              ${roster.map((r) => html`<option key=${r.id} value=${r.id}>${r.name}</option>`)}
            </select>
          <//>
          <${Field} label="요일">
            <select style=${inputStyle} value=${adding.day} onChange=${(e) => setAdding({ ...adding, day: e.target.value })}>
              ${MASTER_SCHEDULE_DAY_NAMES.map((n) => html`<option key=${n} value=${n}>${n}요일</option>`)}
            </select>
          <//>
          <${Field} label="시작 시간">
            <${TimeField} value=${adding.time} onChange=${(v) => setAdding({ ...adding, time: v })} />
          <//>
          <${Field} label="종료 시간">
            <${TimeField} value=${adding.endTime} onChange=${(v) => setAdding({ ...adding, endTime: v })} />
          <//>
          <div style=${{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap" }}>
            <${Button} variant="gold" disabled=${!addStudent || !adding.day || !adding.time || !adding.endTime} onClick=${saveAdd}>추가<//>
            <${Button} variant="ghost" onClick=${() => setAdding(null)}>취소<//>
          </div>
        <//>
      `}

      ${editing && html`
        <${Modal} onClose=${() => setEditing(null)}>
          <div style=${{ ...serif, fontSize: 17, color: C.navy, marginBottom: 14 }}>${(roster.find((r) => r.id === editing.studentId) || {}).name} 학생 수업 시간 수정</div>
          <${Field} label="요일">
            <select style=${inputStyle} value=${editing.day} onChange=${(e) => setEditing({ ...editing, day: e.target.value })}>
              ${MASTER_SCHEDULE_DAY_NAMES.map((n) => html`<option key=${n} value=${n}>${n}요일</option>`)}
            </select>
          <//>
          <${Field} label="시작 시간">
            <${TimeField} value=${editing.time} onChange=${(v) => setEditing({ ...editing, time: v })} />
          <//>
          <${Field} label="종료 시간">
            <${TimeField} value=${editing.endTime} onChange=${(v) => setEditing({ ...editing, endTime: v })} />
          <//>
          <div style=${{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap" }}>
            <${Button} variant="gold" disabled=${!editing.time || !editing.endTime} onClick=${saveEdit}>저장<//>
            <${Button} variant="danger" onClick=${deleteEdit}>이 시간 삭제<//>
            <${Button} variant="ghost" onClick=${() => setEditing(null)}>취소<//>
          </div>
        <//>
      `}
    </div>
  `;
}

// Whether a student has a class on this exact date — weekly pattern (minus a tutoringExceptions
// hit) OR a monthlyInstances one-off landing on that date. Mirrors the logic MonthlyScheduleGrid
// uses per-day, collapsed to a single date for the attendance roster.
function hasClassOn(student, dateStr) {
  const dayName = MASTER_SCHEDULE_DAY_NAMES[new Date(dateStr + "T00:00:00").getDay()];
  const exceptions = student.tutoringExceptions || [];
  const patternMatch = (student.schedule || []).some((s) => s.day === dayName) && !exceptions.includes(dateStr);
  const monthlyMatch = ((student.monthlyInstances || {})[dateStr.slice(0, 7)] || []).some((m) => m.date === dateStr);
  return patternMatch || monthlyMatch;
}

// One page, one date, every student who's scheduled that day — 출석/결석 toggle per student.
// Deliberately separate from tuition (which is schedule-based, not attendance-based — see
// countPlannedSessions) so marking someone absent here never touches billing.
function AttendanceOverview({ roster, ensureData, dataCache, updateData }) {
  const [date, setDate] = useState(today());
  const [loaded, setLoaded] = useState(false);
  const [extraIds, setExtraIds] = useState([]);
  const [addPick, setAddPick] = useState("");

  useEffect(() => {
    let cancelled = false;
    (async () => {
      for (const s of roster) { await ensureData(s.id); if (cancelled) return; }
      if (!cancelled) setLoaded(true);
    })();
    return () => { cancelled = true; };
  }, []);
  useEffect(() => { setExtraIds([]); setAddPick(""); }, [date]);

  const scheduled = roster.filter((s) => hasClassOn(s, date));
  const scheduledIds = new Set(scheduled.map((s) => s.id));
  const extras = roster.filter((s) => extraIds.includes(s.id) && !scheduledIds.has(s.id));
  const list = [...scheduled, ...extras];
  const remaining = roster.filter((s) => !scheduledIds.has(s.id) && !extraIds.includes(s.id));

  // attendance[date] is { status: "present"|"absent", makeupDone } rather than a bare string, so a
  // 결석 can separately track whether the makeup class actually happened yet.
  async function setAttendance(studentId, status) {
    await updateData(studentId, (d) => {
      const attendance = { ...(d.attendance || {}) };
      const cur = attendance[date];
      if (cur && cur.status === status) delete attendance[date];
      else attendance[date] = { status, makeupDone: cur?.makeupDone || false };
      return { ...d, attendance };
    });
  }
  async function toggleMakeup(studentId, targetDate) {
    const dt = targetDate || date;
    await updateData(studentId, (d) => {
      const attendance = { ...(d.attendance || {}) };
      const cur = attendance[dt] || { status: "absent" };
      attendance[dt] = { ...cur, makeupDone: !cur.makeupDone };
      return { ...d, attendance };
    });
  }

  // Every past-or-present absence across every loaded student that still has no makeup recorded —
  // a running "아직 처리 안 된 결석" list, not just the one date currently selected above.
  const outstandingMakeups = [];
  if (loaded) {
    roster.forEach((s) => {
      const d = dataCache[s.id] || emptyData();
      Object.entries(d.attendance || {}).forEach(([dt, rec]) => {
        if (rec && rec.status === "absent" && !rec.makeupDone && dt <= date) outstandingMakeups.push({ student: s, date: dt });
      });
    });
    outstandingMakeups.sort((a, b) => (a.date < b.date ? -1 : 1));
  }

  return html`
    <div>
      <div style=${{ ...serif, fontSize: 19, color: C.navy, marginBottom: 4 }}>출결 관리</div>
      <div style=${{ fontSize: 12, color: C.slate, marginBottom: 14 }}>선택한 날짜에 수업이 예정된 학생이 자동으로 나열돼요. 출석·결석 버튼을 누르면 표시되고, 다시 누르면 취소돼요. 결석으로 표시하면 보강 여부도 따로 체크할 수 있어요. (수업료는 이 기록과 무관하게 예정된 수업 횟수로 계산돼요.)</div>
      <div style=${{ display: "flex", gap: 8, alignItems: "center", marginBottom: 16, flexWrap: "wrap" }}>
        <div style=${{ width: 190 }}><${DateField} value=${date} onChange=${setDate} /></div>
        <button onClick=${() => setDate(today())} style=${{ background: "none", border: `1px solid ${C.line}`, borderRadius: 3, padding: "9px 14px", fontSize: 12.5, color: C.navy, cursor: "pointer" }}>오늘</button>
      </div>

      ${!loaded ? html`<${Empty} text="불러오는 중..." />` : list.length === 0 ? html`<${Empty} text="이 날짜에 예정된 수업이 없어요." />` : html`
        <div style=${{ overflowX: "auto", border: `1px solid ${C.line}`, borderRadius: 4 }}>
          <table style=${{ width: "100%", borderCollapse: "collapse", fontSize: 13, minWidth: 460 }}>
            <thead>
              <tr style=${{ background: C.ivory }}>
                <th style=${{ padding: "8px 10px", textAlign: "left", color: C.navy, fontSize: 11 }}>학생</th>
                <th style=${{ padding: "8px 10px", textAlign: "left", color: C.navy, fontSize: 11 }}>출결</th>
                <th style=${{ padding: "8px 10px", textAlign: "left", color: C.navy, fontSize: 11 }}>보강</th>
              </tr>
            </thead>
            <tbody>
              ${list.map((s) => {
                const d = dataCache[s.id] || emptyData();
                const rec = (d.attendance || {})[date];
                const status = rec?.status;
                return html`
                  <tr key=${s.id} style=${{ borderTop: `1px solid ${C.line}` }}>
                    <td style=${{ padding: "8px 10px", fontWeight: 700, color: C.navy, whiteSpace: "nowrap" }}>${s.name}</td>
                    <td style=${{ padding: "8px 10px" }}>
                      <div style=${{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                        <button onClick=${() => setAttendance(s.id, "present")} style=${{ padding: "6px 14px", borderRadius: 3, border: `1px solid ${status === "present" ? C.gold : C.line}`, background: status === "present" ? C.gold : "#fff", color: status === "present" ? "#fff" : C.ink, fontWeight: 700, fontSize: 12, cursor: "pointer" }}>출석</button>
                        <button onClick=${() => setAttendance(s.id, "absent")} style=${{ padding: "6px 14px", borderRadius: 3, border: `1px solid ${status === "absent" ? C.danger : C.line}`, background: status === "absent" ? C.danger : "#fff", color: status === "absent" ? "#fff" : C.ink, fontWeight: 700, fontSize: 12, cursor: "pointer" }}>결석</button>
                      </div>
                    </td>
                    <td style=${{ padding: "8px 10px" }}>
                      ${status === "absent"
                        ? html`<button onClick=${() => toggleMakeup(s.id)} style=${{ padding: "6px 14px", borderRadius: 3, border: `1px solid ${rec.makeupDone ? "#3D6B4F" : C.gold}`, background: rec.makeupDone ? "#3D6B4F" : "#fff", color: rec.makeupDone ? "#fff" : C.gold, fontWeight: 700, fontSize: 12, cursor: "pointer" }}>${rec.makeupDone ? "✓ 보강완료" : "보강 필요"}</button>`
                        : html`<span style=${{ color: C.slate, fontSize: 12 }}>—</span>`}
                    </td>
                  </tr>
                `;
              })}
            </tbody>
          </table>
        </div>
      `}

      ${loaded && remaining.length > 0 && html`
        <div style=${{ marginTop: 16, paddingTop: 14, borderTop: `1px dashed ${C.line}` }}>
          <div style=${{ fontSize: 11.5, color: C.slate, marginBottom: 6 }}>예정에 없는 학생 추가 (보강 등으로 이 날 온 학생)</div>
          <div style=${{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <select style=${{ ...inputStyle, marginBottom: 0, width: 180 }} value=${addPick} onChange=${(e) => setAddPick(e.target.value)}>
              <option value="">학생 선택</option>
              ${remaining.map((s) => html`<option key=${s.id} value=${s.id}>${s.name}</option>`)}
            </select>
            <${Button} variant="ghost" onClick=${() => { if (addPick) { setExtraIds([...extraIds, addPick]); setAddPick(""); } }}>추가<//>
          </div>
        </div>
      `}

      ${loaded && outstandingMakeups.length > 0 && html`
        <div style=${{ marginTop: 20, paddingTop: 16, borderTop: `2px solid ${C.line}` }}>
          <div style=${{ fontSize: 13, fontWeight: 700, color: C.danger, marginBottom: 8 }}>⚠ 아직 보강 안 한 결석 (${outstandingMakeups.length}건)</div>
          <div style=${{ overflowX: "auto", border: `1px solid #E9C7C0`, borderRadius: 4 }}>
            <table style=${{ width: "100%", borderCollapse: "collapse", fontSize: 12.5, minWidth: 380 }}>
              <thead>
                <tr style=${{ background: "#F7E9E6" }}>
                  <th style=${{ padding: "7px 10px", textAlign: "left", color: C.danger, fontSize: 11 }}>학생</th>
                  <th style=${{ padding: "7px 10px", textAlign: "left", color: C.danger, fontSize: 11 }}>결석일</th>
                  <th style=${{ padding: "7px 10px", width: 140 }}></th>
                </tr>
              </thead>
              <tbody>
                ${outstandingMakeups.map((o, i) => html`
                  <tr key=${i} style=${{ borderTop: `1px solid ${C.line}` }}>
                    <td style=${{ padding: "7px 10px", fontWeight: 700, color: C.navy, whiteSpace: "nowrap" }}>${o.student.name}</td>
                    <td style=${{ padding: "7px 10px", whiteSpace: "nowrap" }}>${fmtDate(o.date)}</td>
                    <td style=${{ padding: "7px 10px" }}><button onClick=${() => toggleMakeup(o.student.id, o.date)} style=${{ background: "none", border: `1px solid ${C.gold}`, color: C.gold, borderRadius: 3, padding: "5px 10px", fontSize: 11.5, cursor: "pointer" }}>보강 완료로 표시</button></td>
                  </tr>
                `)}
              </tbody>

}

// Teacher's own prep notes for this student — "다음 수업 전에 Unit 6 프린트 준비해오기" style
// reminders with a target date. Purely teacher-facing: not shown to the student/parent dashboards,
// no notifications tied to it.
function TodoEditor({ data, updateData }) {
  const [date, setDate] = useState(today());
  const [content, setContent] = useState("");
  const [hideDone, setHideDone] = useState(true);

  async function add() {
    if (!content.trim()) return;
    await updateData((d) => ({ ...d, todos: [{ id: uid(), date, content: content.trim(), done: false }, ...(d.todos || [])] }));
    setContent("");
  }
  async function toggleDone(id) {
    await updateData((d) => ({ ...d, todos: (d.todos || []).map((t) => (t.id === id ? { ...t, done: !t.done } : t)) }));
  }
  async function remove(id) {
    await updateData((d) => ({ ...d, todos: (d.todos || []).filter((t) => t.id !== id) }));
  }

  const todos = [...(data.todos || [])].sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  const visible = hideDone ? todos.filter((t) => !t.done) : todos;

  return html`
    <div>
      <${Card}>
        <div style=${{ fontSize: 12, fontWeight: 700, color: C.navy, marginBottom: 10 }}>✅ 다음에 준비할 것 추가</div>
        <div style=${{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <div style=${{ width: 160 }}><${DateField} value=${date} onChange=${setDate} /></div>
          <input style=${{ ...inputStyle, flex: 1, minWidth: 160, marginBottom: 0 }} value=${content} onChange=${(e) => setContent(e.target.value)}
            onKeyDown=${(e) => e.key === "Enter" && add()} placeholder="예: Unit 6 프린트 준비, 단어 시험 채점" />
          <${Button} variant="gold" style=${{ padding: "9px 16px", fontSize: 12.5 }} onClick=${add}>추가<//>
        </div>
      <//>
      <label style=${{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: C.slate, marginBottom: 10, cursor: "pointer" }}>
        <input type="checkbox" checked=${hideDone} onChange=${(e) => setHideDone(e.target.checked)} />
        완료된 항목 숨기기
      </label>
      ${visible.length === 0 ? html`<${Empty} text="할 일이 없어요." />` : visible.map((t) => html`
        <${Card} key=${t.id} style=${{ padding: 12 }}>
          <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}>
            <div style=${{ flex: 1 }}>
              <div style=${{ fontSize: 11, color: C.gold, fontWeight: 700 }}>${fmtDate(t.date)}</div>
              <div style=${{ fontSize: 13.5, marginTop: 2, textDecoration: t.done ? "line-through" : "none", color: t.done ? C.slate : C.ink, whiteSpace: "pre-wrap" }}>${t.content}</div>
            </div>
            <div style=${{ display: "flex", gap: 8, alignItems: "center", flexShrink: 0 }}>
              <button onClick=${() => toggleDone(t.id)} style=${{ background: "none", border: `1px solid ${t.done ? C.line : C.gold}`, color: t.done ? C.slate : C.gold, borderRadius: 3, padding: "6px 12px", fontSize: 12, cursor: "pointer" }}>${t.done ? "완료 취소" : "완료"}</button>
              <button onClick=${() => remove(t.id)} style=${{ background: "none", border: "none", color: C.danger, cursor: "pointer", fontSize: 16 }}>×</button>
            </div>
          </div>
        <//>
      `)}
    </div>
  `;
}

function StorageCleanupPanel({ data, updateData }) {
  const [msg, setMsg] = useState("");
  const sizeBytes = new Blob([JSON.stringify(data)]).size;
  const sizeKB = Math.round(sizeBytes / 1024);
  const LIMIT_KB = 1000; // Firestore's hard cap is 1MB per document
  const pct = Math.min(100, Math.round((sizeBytes / (LIMIT_KB * 1024)) * 100));
  const photoCount = (data.homework || []).reduce((sum, h) => sum + (h.photos || (h.photo ? [h.photo] : [])).length, 0);
  const vocabResultCount = (data.vocabResults || []).length;
  const examResultCount = (data.examResults || []).length;
  const logCount = (data.logs || []).length;

  async function clearAllPhotos() {
    if (!confirm("이 학생의 모든 숙제 사진을 삭제할까요? 숙제 내용과 완료 표시는 그대로 남아요.")) return;
    await updateData((d) => ({ ...d, homework: (d.homework || []).map((h) => ({ ...withoutLegacyPhoto(h), photos: [] })) }));
    setMsg("사진을 모두 삭제했어요.");
  }
  async function clearVocabResults() {
    if (!confirm("단어 시험(퀴즈) 응시 기록을 전부 삭제할까요? 퀴즈 자체(문제)는 남고, 학생이 응시했던 결과 기록만 지워져요.")) return;
    await updateData((d) => ({ ...d, vocabResults: [] }));
    setMsg("단어 시험 응시 기록을 정리했어요.");
  }
  async function clearExamResults() {
    if (!confirm("추가 시험 응시 기록을 전부 삭제할까요? 시험 자체(문제)는 남고, 응시 결과 기록만 지워져요.")) return;
    await updateData((d) => ({ ...d, examResults: [] }));
    setMsg("추가 시험 응시 기록을 정리했어요.");
  }
  async function resetEverything() {
    if (!confirm("이 학생의 모든 기록(학습기록·숙제·시험·사진 등)을 전부 초기화할까요? 학생 이름/코드는 그대로 남고 되돌릴 수 없어요.")) return;
    await updateData(() => emptyData());
    setMsg("전체 데이터를 초기화했어요.");
  }

  return html`
    <div>
      <${Card}>
        <div style=${{ fontSize: 12.5, color: C.slate, marginBottom: 8 }}>Firebase는 학생 한 명의 기록을 문서 하나(최대 1MB)에 저장해요. 여기서 현재 용량을 확인하고, 꽉 찼을 때 정리할 수 있어요.</div>
        <div style=${{ fontSize: 20, fontWeight: 700, color: pct > 80 ? C.danger : C.navy }}>${sizeKB}KB <span style=${{ fontSize: 12, color: C.slate, fontWeight: 400 }}>/ 약 ${LIMIT_KB}KB 중</span></div>
        <div style=${{ height: 8, background: C.line, borderRadius: 4, marginTop: 8, overflow: "hidden" }}>
          <div style=${{ height: "100%", width: pct + "%", background: pct > 80 ? C.danger : C.gold }} />
        </div>
        ${pct > 70 && html`<div style=${{ fontSize: 12, color: C.danger, marginTop: 8 }}>공간이 얼마 안 남았어요. 아래에서 정리해 주세요.</div>`}
      <//>

      <${Card}>
        <div style=${{ fontSize: 12.5, marginBottom: 10 }}>사진 ${photoCount}장 · 단어시험 응시기록 ${vocabResultCount}건 · 추가시험 응시기록 ${examResultCount}건 · 학습기록 ${logCount}건</div>
        <div style=${{ display: "flex", flexDirection: "column", gap: 8 }}>
          <${Button} variant="ghost" onClick=${clearAllPhotos}>숙제 사진 전체 삭제 (내용은 유지)<//>
          <${Button} variant="ghost" onClick=${clearVocabResults}>단어 시험 응시 기록 정리<//>
          <${Button} variant="ghost" onClick=${clearExamResults}>추가 시험 응시 기록 정리<//>
          <${Button} variant="danger" onClick=${resetEverything}>이 학생 전체 데이터 초기화<//>
        </div>
        ${msg && html`<div style=${{ fontSize: 12.5, color: C.navy, marginTop: 10 }}>${msg}</div>`}
      <//>
    </div>
  `;
}

// ---------- 단어시험 기록 (수기 입력, 자동 합격판정) ----------
function VocabLogEditor({ data, updateData }) {
  const [date, setDate] = useState(today());
  const [book, setBook] = useState(BOOK_LIST[0]);
  const [customBook, setCustomBook] = useState("");
  const [range, setRange] = useState("");
  const [correct, setCorrect] = useState("");
  const [total, setTotal] = useState("");
  const [retest, setRetest] = useState("");

  const isCumulative = range.includes("누적");
  const threshold = isCumulative ? 90 : 80;
  const pct = total ? Math.round((Number(correct) / Number(total)) * 100) : null;
  const allowedWrong = total ? Math.round(Number(total) * (isCumulative ? 0.10 : 0.20)) : null;
  const wrongCount = total && correct !== "" ? Number(total) - Number(correct) : null;
  const willPass = wrongCount !== null ? wrongCount <= allowedWrong : null;
  const effectiveBook = book === "__other__" ? customBook.trim() : book;

  async function add() {
    if (!date || !total || !range || !effectiveBook) return;
    const scorePct = Math.round((Number(correct) / Number(total)) * 100);
    const allowed = Math.round(Number(total) * (range.includes("누적") ? 0.10 : 0.20));
    const passed = (Number(total) - Number(correct)) <= allowed;
    await updateData((d) => ({
      ...d,
      vocabLog: [{ id: uid(), date, book: effectiveBook, range, correct: Number(correct), total: Number(total), score: scorePct, passed, retest }, ...(d.vocabLog || [])],
    }));
    setRange(""); setCorrect(""); setTotal(""); setRetest("");
  }
  async function remove(id) { await updateData((d) => ({ ...d, vocabLog: (d.vocabLog || []).filter((v) => v.id !== id) })); }

  const list = data.vocabLog || [];
  return html`
    <div>
      <div style=${{ fontSize: 12, color: C.slate, marginBottom: 10 }}>단어 시험을 직접 보고 채점한 결과를 기록하세요. 범위에 "누적"이 들어가면 90%(오답 10% 이내), 아니면 80%(오답 20% 이내) 기준으로 자동 합격 판정돼요. 문항 수에 맞춰 반올림한 허용 오답 개수를 기준으로 판정합니다.</div>
      <${Card}>
        <div className="ap-split">
          <div className="ap-split-left">
            <div style=${{ fontSize: 12, color: C.slate, marginBottom: 8, fontWeight: 600 }}>날짜</div>
            <${MiniCalendar} selected=${date} onSelect=${setDate} />
          </div>
          <div className="ap-split-right">
            <${Field} label="교재">
              <select style=${inputStyle} value=${book} onChange=${(e) => setBook(e.target.value)}>
                ${BOOK_LIST.map((b) => html`<option key=${b} value=${b}>${b}</option>`)}
                <option value="__other__">기타 (직접 입력)</option>
              </select>
            <//>
            ${book === "__other__" && html`<${Field} label="교재명 직접 입력"><input style=${inputStyle} value=${customBook} onChange=${(e) => setCustomBook(e.target.value)} placeholder="교재 이름 입력" /><//>`}
            <${Field} label="시험범위"><input style=${inputStyle} value=${range} onChange=${(e) => setRange(e.target.value)} placeholder="예: Day 1-9 누적" /><//>
            <div style=${{ display: "flex", gap: 8 }}>
              <div style=${{ flex: 1 }}><${Field} label="맞은 개수"><input style=${inputStyle} type="number" value=${correct} onChange=${(e) => setCorrect(e.target.value)} /><//></div>
              <div style=${{ flex: 1 }}><${Field} label="총 문항"><input style=${inputStyle} type="number" value=${total} onChange=${(e) => setTotal(e.target.value)} /><//></div>
            </div>
            ${pct !== null && html`<div style=${{ fontSize: 12.5, marginBottom: 10, color: willPass ? C.navy : C.danger, fontWeight: 700 }}>${pct}% (오답 ${wrongCount}개) · ${total}문항 중 오답 ${allowedWrong}개까지 허용 → ${willPass ? "합격" : "불합격"}</div>`}
            <${Field} label="재시험 메모 (선택)"><input style=${inputStyle} value=${retest} onChange=${(e) => setRetest(e.target.value)} placeholder="예: 7/20 10시" /><//>
            <${Button} variant="gold" onClick=${add}>기록 추가<//>
          </div>
        </div>
      <//>
      ${list.length === 0 && html`<${Empty} text="아직 기록이 없어요." />`}
      ${list.map((v) => html`
        <${Card} key=${v.id}>
          <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
            <div>
              <div style=${{ fontSize: 11.5, color: C.gold, fontWeight: 700 }}>${fmtDate(v.date)} · ${v.book}</div>
              <div style=${{ fontSize: 13, marginTop: 4 }}>${v.range} — ${v.correct}/${v.total} (${v.score}%)</div>
              ${v.retest && html`<div style=${{ fontSize: 12, color: C.slate, marginTop: 2 }}>재시험: ${v.retest}</div>`}
            </div>
            <div style=${{ display: "flex", alignItems: "center", gap: 10 }}>
              <span style=${{ fontSize: 11.5, fontWeight: 700, padding: "3px 10px", borderRadius: 20, background: v.passed ? "#E9F1EA" : "#F7E9E6", color: v.passed ? "#3D6B4F" : C.danger }}>${v.passed ? "합격" : "불합격"}</span>
              <button onClick=${() => remove(v.id)} style=${{ background: "none", border: "none", color: C.slate, cursor: "pointer" }}>✕</button>
            </div>
          </div>
        <//>
      `)}
    </div>
  `;
}

// ---------- 정기시험 (내신 · 모의고사 점수) ----------
function buildScoreChartSVG(rows) {
  const pts = (rows || []).filter((r) => r.scoreNum != null && r.scoreNum !== "").map((r) => ({ date: r.date, examName: r.examName, score: Number(r.scoreNum) })).sort((a, b) => (a.date < b.date ? -1 : 1));
  if (pts.length < 2) {
    return '<div style="font-size:12.5px;color:#8A8370;padding:10px 0;">숫자 점수가 2개 이상 기록되면 그래프가 나타나요.</div>';
  }
  const W = 640, H = 220, padL = 36, padR = 20, padT = 20, padB = 34;
  const scores = pts.map((p) => p.score);
  let maxS = Math.max(...scores), minS = Math.min(...scores);
  if (maxS === minS) { maxS += 5; minS -= 5; }
  const rangePad = (maxS - minS) * 0.15;
  maxS += rangePad; minS = Math.max(0, minS - rangePad);
  const xStep = (W - padL - padR) / (pts.length - 1);
  const yOf = (s) => padT + (H - padT - padB) * (1 - (s - minS) / (maxS - minS));
  const xOf = (i) => padL + i * xStep;
  const linePath = pts.map((p, i) => `${i === 0 ? "M" : "L"}${xOf(i).toFixed(1)},${yOf(p.score).toFixed(1)}`).join(" ");
  const gridLines = [0, 0.5, 1].map((f) => {
    const y = padT + (H - padT - padB) * f;
    const val = Math.round(maxS - (maxS - minS) * f);
    return `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#EDE9DD" stroke-width="1"/><text x="${padL - 6}" y="${y + 4}" font-size="10" fill="#8A8370" text-anchor="end">${val}</text>`;
  }).join("");
  const points = pts.map((p, i) => `
    <circle cx="${xOf(i).toFixed(1)}" cy="${yOf(p.score).toFixed(1)}" r="3.5" fill="#B8935A"/>
    <text x="${xOf(i).toFixed(1)}" y="${(yOf(p.score) - 10).toFixed(1)}" font-size="11" fill="#1C2B4A" text-anchor="middle" font-weight="700">${p.score}</text>
    <text x="${xOf(i).toFixed(1)}" y="${H - 10}" font-size="9.5" fill="#8A8370" text-anchor="middle">${(p.date || "").slice(5)}</text>
  `).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:640px;height:auto;font-family:'Noto Sans KR',sans-serif;">
    ${gridLines}
    <path d="${linePath}" fill="none" stroke="#1C2B4A" stroke-width="2"/>
    ${points}
  </svg>`;
}

function parsePercentNum(str) {
  if (!str) return null;
  const m = String(str).match(/(\d+(?:\.\d+)?)/);
  return m ? Number(m[1]) : null;
}
function compareNeltCategory(curr, other) {
  if (!curr || !other) return null;
  const p1 = parsePercentNum(curr.percentile), p0 = parsePercentNum(other.percentile);
  const diff = (p1 != null && p0 != null) ? p0 - p1 : null; // 양수면 향상 (상위 %가 낮아짐)
  return { diff, levelOld: other.level_desc || "", levelNew: curr.level_desc || "" };
}
function neltDiffText(diff) {
  if (diff == null) return "";
  if (diff > 0) return `▲ 상위 ${diff}%p 향상`;
  if (diff < 0) return `▼ 상위 ${Math.abs(diff)}%p 하락`;
  return "변동 없음";
}
function buildNeltTrendChartSVG(results) {
  const pts = (results || [])
    .map((r) => ({ date: r.test_date, grade: r.overall_level_desc || r.overall_level || "", pct: parsePercentNum(r.overall_percentile) }))
    .filter((p) => p.date && p.pct != null)
    .sort((a, b) => (a.date < b.date ? -1 : 1));
  if (pts.length < 2) return '<div style="font-size:12.5px;color:#8A8370;padding:10px 0;">NELT 결과가 2개 이상 쌓이면 추이 그래프가 나타나요.</div>';
  const W = 640, H = 170, padL = 20, padR = 20, padT = 26, padB = 30;
  const xStep = pts.length > 1 ? (W - padL - padR) / (pts.length - 1) : 0;
  const xOf = (i) => padL + i * xStep;
  // percentile은 낮을수록 좋은 성적이라, 위로 갈수록(=y가 작을수록) 좋은 성적이 되도록 그대로 비율 사용
  const yOf = (pct) => padT + (H - padT - padB) * (Math.min(pct, 100) / 100);
  const linePath = pts.map((p, i) => `${i === 0 ? "M" : "L"}${xOf(i).toFixed(1)},${yOf(p.pct).toFixed(1)}`).join(" ");
  const points = pts.map((p, i) => `
    <circle cx="${xOf(i).toFixed(1)}" cy="${yOf(p.pct).toFixed(1)}" r="3.5" fill="#B8935A"/>
    <text x="${xOf(i).toFixed(1)}" y="${(yOf(p.pct) - 12).toFixed(1)}" font-size="11" fill="#1C2B4A" text-anchor="middle" font-weight="700">${p.grade}</text>
    <text x="${xOf(i).toFixed(1)}" y="${(yOf(p.pct) + 17).toFixed(1)}" font-size="10" fill="#B8935A" text-anchor="middle">상위 ${p.pct}%</text>
    <text x="${xOf(i).toFixed(1)}" y="${H - 8}" font-size="9.5" fill="#8A8370" text-anchor="middle">${(p.date || "").slice(5)}</text>
  `).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:640px;height:auto;font-family:'Noto Sans KR',sans-serif;">
    <line x1="${padL}" y1="${padT}" x2="${W - padR}" y2="${padT}" stroke="#EDE9DD" stroke-width="1"/>
    <path d="${linePath}" fill="none" stroke="#1C2B4A" stroke-width="2"/>
    ${points}
  </svg>`;
}

function NeltUploadSection({ data, updateData }) {
  const [uploading, setUploading] = useState(false);
  const [draft, setDraft] = useState(null);
  const [err, setErr] = useState("");
  const results = data.neltResults || [];
  const CATS = [["vocab", "어휘"], ["grammar", "문법"], ["listening", "듣기"], ["reading", "독해"]];

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(",")[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    setUploading(true); setErr(""); setDraft(null);
    try {
      const pdfBase64 = await fileToBase64(file);
      const res = await fetch(NELT_WORKER_URL, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ mode: "nelt", pdfBase64 }),
      });
      const json = await res.json();
      if (!res.ok || json.error) {
        setErr((json.error || "분석에 실패했습니다.") + (json.detail ? " / " + String(json.detail).slice(0, 200) : ""));
      } else {
        setDraft({
          test_name: json.test_name || "", student_name: json.student_name || "", grade: json.grade || "",
          test_date: json.test_date || today(),
          overall_level: json.overall_level || "", overall_level_desc: json.overall_level_desc || "", overall_percentile: json.overall_percentile || "",
          categories: {
            vocab: json.categories?.vocab || {}, grammar: json.categories?.grammar || {},
            listening: json.categories?.listening || {}, reading: json.categories?.reading || {},
          },
        });
      }
    } catch (ex) {
      setErr("서버에 연결하지 못했습니다: " + String(ex).slice(0, 150));
    } finally {
      setUploading(false);
      e.target.value = "";
    }
  }

  function updateDraftField(field, val) { setDraft((d) => ({ ...d, [field]: val })); }
  function updateDraftCat(cat, field, val) { setDraft((d) => ({ ...d, categories: { ...d.categories, [cat]: { ...d.categories[cat], [field]: val } } })); }

  async function saveDraft() {
    await updateData((d) => ({ ...d, neltResults: [{ id: uid(), ...draft }, ...(d.neltResults || [])] }));
    setDraft(null);
  }
  async function removeResult(id) { await updateData((d) => ({ ...d, neltResults: (d.neltResults || []).filter((r) => r.id !== id) })); }

  const sortedResults = [...results].sort((a, b) => (a.test_date < b.test_date ? -1 : 1));
  function getComparisons(r) {
    const idx = sortedResults.findIndex((x) => x.id === r.id);
    const prev = idx > 0 ? sortedResults[idx - 1] : null;
    const first = sortedResults.length > 1 && idx > 0 ? sortedResults[0] : null;
    return { prev, first };
  }

  return html`
    <div>
      <div style=${{ fontSize: 12, fontWeight: 700, color: C.navy, marginBottom: 8 }}>📄 NELT 성적표 업로드</div>
      <${Card} style=${{ marginBottom: 20 }}>
        <div style=${{ fontSize: 11.5, color: C.slate, marginBottom: 10 }}>NELT 성적표 PDF를 올리면 어휘·문법·듣기·독해별 수준과 석차를 자동으로 뽑아드려요 (1회 분석당 약 수십 원, 완료 전에 확인 후 저장할 수 있어요).</div>
        <input type="file" accept="application/pdf" onChange=${handleFile} disabled=${uploading} style=${{ fontSize: 12.5 }} />
        ${uploading && html`<div style=${{ fontSize: 12.5, color: C.gold, marginTop: 8 }}>분석 중... (10~20초 정도 걸려요)</div>`}
        ${err && html`<div style=${{ fontSize: 12, color: C.danger, marginTop: 8 }}>${err}</div>`}
      <//>

      ${draft && html`
        <${Card} style=${{ marginBottom: 20, borderLeft: `3px solid ${C.gold}` }}>
          <div style=${{ fontSize: 12, fontWeight: 700, color: C.navy, marginBottom: 10 }}>추출된 내용 확인 (필요하면 수정 후 저장하세요)</div>
          <div style=${{ display: "flex", gap: 8 }}>
            <div style=${{ flex: 1 }}><${Field} label="테스트명"><input style=${inputStyle} value=${draft.test_name} onChange=${(e) => updateDraftField("test_name", e.target.value)} /><//></div>
            <div style=${{ flex: 1 }}><${Field} label="응시일"><${DateField} value=${draft.test_date} onChange=${(v) => updateDraftField("test_date", v)} /><//></div>
          </div>
          <div style=${{ display: "flex", gap: 8 }}>
            <div style=${{ flex: 1 }}><${Field} label="종합 레벨"><input style=${inputStyle} value=${draft.overall_level} onChange=${(e) => updateDraftField("overall_level", e.target.value)} /><//></div>
            <div style=${{ flex: 1 }}><${Field} label="종합 수준"><input style=${inputStyle} value=${draft.overall_level_desc} onChange=${(e) => updateDraftField("overall_level_desc", e.target.value)} /><//></div>
            <div style=${{ flex: 1 }}><${Field} label="종합 석차"><input style=${inputStyle} value=${draft.overall_percentile} onChange=${(e) => updateDraftField("overall_percentile", e.target.value)} /><//></div>
          </div>
          ${CATS.map(([key, label]) => html`
            <div key=${key} style=${{ borderTop: `1px dashed ${C.line}`, paddingTop: 10, marginTop: 6 }}>
              <div style=${{ fontSize: 12, fontWeight: 700, color: C.gold, marginBottom: 6 }}>${label}</div>
              <div style=${{ display: "flex", gap: 8 }}>
                <div style=${{ flex: 1 }}><${Field} label="수준"><input style=${inputStyle} value=${draft.categories[key].level_desc || ""} onChange=${(e) => updateDraftCat(key, "level_desc", e.target.value)} /><//></div>
                <div style=${{ flex: 1 }}><${Field} label="석차"><input style=${inputStyle} value=${draft.categories[key].percentile || ""} onChange=${(e) => updateDraftCat(key, "percentile", e.target.value)} /><//></div>
              </div>
              <${Field} label="추가 정보"><input style=${inputStyle} value=${draft.categories[key].extra || ""} onChange=${(e) => updateDraftCat(key, "extra", e.target.value)} /><//>
            </div>
          `)}
          <div style=${{ display: "flex", gap: 8, marginTop: 6 }}>
            <${Button} variant="gold" onClick=${saveDraft}>저장<//>
            <${Button} variant="ghost" onClick=${() => setDraft(null)}>취소<//>
          </div>
        <//>
      `}

      ${sortedResults.length >= 2 && html`
        <div style=${{ fontSize: 12, fontWeight: 700, color: C.navy, marginBottom: 8 }}>📈 NELT 성적 추이 (학년 · 백분율)</div>
        <${Card} style=${{ marginBottom: 20 }}>
          <div dangerouslySetInnerHTML=${{ __html: buildNeltTrendChartSVG(results) }} />
        <//>
      `}

      ${[...results].reverse().map((r) => {
        const { prev, first } = getComparisons(r);
        return html`
        <${Card} key=${r.id} style=${{ marginBottom: 12 }}>
          <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
            <div>
              <div style=${{ fontSize: 11.5, color: C.gold, fontWeight: 700 }}>${fmtDate(r.test_date)} · ${r.test_name}</div>
              <div style=${{ fontSize: 13, marginTop: 4 }}><b>${r.overall_level}</b> ${r.overall_level_desc} · ${r.overall_percentile}</div>
            </div>
            <button onClick=${() => removeResult(r.id)} style=${{ background: "none", border: "none", color: C.slate, cursor: "pointer" }}>✕</button>
          </div>
          <div style=${{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(160px, 1fr))", gap: 8, marginTop: 10 }}>
            ${CATS.map(([key, label]) => {
              const cmpPrev = prev ? compareNeltCategory(r.categories[key], prev.categories[key]) : null;
              const cmpFirst = first ? compareNeltCategory(r.categories[key], first.categories[key]) : null;
              return html`
              <div key=${key} style=${{ border: `1px solid ${C.line}`, borderRadius: 3, padding: 8 }}>
                <div style=${{ fontSize: 11, fontWeight: 700, color: C.navy }}>${label}</div>
                <div style=${{ fontSize: 12, marginTop: 2 }}>${(r.categories && r.categories[key] && r.categories[key].level_desc) || "-"}</div>
                <div style=${{ fontSize: 12, color: C.gold, fontWeight: 700 }}>${(r.categories && r.categories[key] && r.categories[key].percentile) || ""}</div>
                <div style=${{ fontSize: 10.5, color: C.slate, marginTop: 2 }}>${(r.categories && r.categories[key] && r.categories[key].extra) || ""}</div>
                ${cmpPrev && html`<div style=${{ fontSize: 10.5, color: cmpPrev.diff > 0 ? C.navy : (cmpPrev.diff < 0 ? C.danger : C.slate), marginTop: 4, borderTop: `1px dotted ${C.line}`, paddingTop: 4 }}>직전 대비: ${neltDiffText(cmpPrev.diff)}</div>`}
                ${cmpFirst && html`<div style=${{ fontSize: 10.5, color: cmpFirst.diff > 0 ? C.navy : (cmpFirst.diff < 0 ? C.danger : C.slate), marginTop: 2 }}>첫 시험 대비: ${neltDiffText(cmpFirst.diff)}</div>`}
              </div>
            `;
            })}
          </div>
        <//>
      `;
      })}
    </div>
  `;
}

function buildDailyReportText(student, data, date, hwFrom) {
  const dt = new Date(date + "T00:00:00");
  const days = ["일", "월", "화", "수", "목", "금", "토"];
  const md = `${dt.getMonth() + 1}/${dt.getDate()}(${days[dt.getDay()]})`;

  const logsToday = (data.logs || []).filter((l) => l.date === date);
  const learnedBlock = logsToday.length > 0 ? logsToday.map((l) => l.content).join("\n") : "문법:\n독해:";

  const vocabToday = (data.vocabLog || []).filter((v) => v.date === date);
  const vocabBlock = vocabToday.length > 0
    ? vocabToday.map((v) => `${v.book} ${v.range}: ${v.correct}/${v.total} (${v.score}%) - ${v.passed ? "합격" : "불합격"}`).join("\n")
    : "기록 없음";

  const yesterday = new Date(dt); yesterday.setDate(yesterday.getDate() - 1);
  const y = yesterday.getFullYear(), m2 = String(yesterday.getMonth() + 1).padStart(2, "0"), d2 = String(yesterday.getDate()).padStart(2, "0");
  const yesterdayStr = `${y}-${m2}-${d2}`;
  const fromD = hwFrom && hwFrom <= yesterdayStr ? hwFrom : yesterdayStr;
  const inRange = (d) => d && d >= fromD && d <= yesterdayStr;
  const hwRange = (data.homework || []).filter((h) => !h.expired && inRange(h.dueDate));
  const hwDone = hwRange.filter((h) => h.done);
  const hwUndone = hwRange.filter((h) => !h.done);
  const hwBlock = hwRange.length === 0 ? "기록 없음" : [
    hwDone.length > 0 ? `✅ 완료\n${hwDone.map((h) => `- ${h.content}`).join("\n")}` : "",
    hwUndone.length > 0 ? `❌ 미완료\n${hwUndone.map((h) => `- ${h.content}`).join("\n")}` : "",
  ].filter(Boolean).join("\n");

  return `[${student.name}] ${md} 수업 안내\n📖 오늘 배운 내용\n${learnedBlock}\n✏️ 단어시험 결과\n${vocabBlock}\n📝 숙제 확인\n${hwBlock}`;
}

function DailyReportGenerator({ student, data, updateData }) {
  const [date, setDate] = useState(today());
  const [hwFrom, setHwFrom] = useState(today());
  const [copied, setCopied] = useState(false);
  const [saved, setSaved] = useState(false);
  const [text, setText] = useState("");
  const [published, setPublished] = useState(false);

  useEffect(() => {
    const existing = (data.dailyReports || {})[date];
    if (existing) {
      setText(existing.text || "");
      setPublished(existing.published || false);
    } else {
      setText(buildDailyReportText(student, data, date, hwFrom));
      setPublished(false);
    }
    setCopied(false); setSaved(false);
  }, [date, hwFrom, student.id]);

  function regenerate() {
    setText(buildDailyReportText(student, data, date, hwFrom));
  }

  async function copy() {
    try {
      await navigator.clipboard.writeText(text);
      setCopied(true);
      setTimeout(() => setCopied(false), 2500);
    } catch (e) {
      setCopied(false);
    }
  }

  async function saveDraft(publishOverride) {
    const nextPublished = publishOverride != null ? publishOverride : published;
    await updateData((d) => ({
      ...d,
      dailyReports: { ...(d.dailyReports || {}), [date]: { text, published: nextPublished, updatedAt: Date.now() } },
    }));
    setPublished(nextPublished);
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  }
  async function publish() { await saveDraft(true); }
  async function unpublish() { await saveDraft(false); }

  return html`
    <div>
      <${Card}>
        <div style=${{ display: "flex", gap: 12, marginBottom: 14 }}>
          <div style=${{ flex: 1 }}>
            <div style=${{ fontSize: 11.5, color: C.slate, marginBottom: 6, fontWeight: 600 }}>수업 날짜</div>
            <${MiniCalendar} selected=${date} onSelect=${setDate} />
          </div>
          <div style=${{ flex: 1 }}>
            <div style=${{ fontSize: 11.5, color: C.slate, marginBottom: 6, fontWeight: 600 }}>숙제 확인 시작일</div>
            <${MiniCalendar} selected=${hwFrom} onSelect=${setHwFrom} />
