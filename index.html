// ---------- Firestore storage ----------
// roster/teacherAuth live in one small "meta" doc.
// Each student's own data (logs/homework/feedback/tests/etc, including photos & audio)
// lives in its own doc, so one student's data never affects another's, and we
// stay well clear of Firestore's 1MB-per-document limit as the roster grows.
const META_COLLECTION = "sarahsEnglishMeta";
const META_DOC_ID = "main";
const STUDENTS_COLLECTION = "sarahsEnglishStudents";

let store = null; // in-memory cache: { roster, teacherAuth, studentData }

async function loadStore(attempts = 3) {
  for (let i = 0; i < attempts; i++) {
    try {
      const ref = window.__doc(window.__db, META_COLLECTION, META_DOC_ID);
      const snap = await window.__getDoc(ref);
      const rec = snap.exists() ? snap.data() : {};
      store = {
        roster: Array.isArray(rec.roster) ? rec.roster : [],
        teacherAuth: rec.teacherAuth || null,
        levelTestBookings: Array.isArray(rec.levelTestBookings) ? rec.levelTestBookings : [],
        announcement: rec.announcement || null,
        examKeyLibrary: Array.isArray(rec.examKeyLibrary) ? rec.examKeyLibrary : [],
        studentData: {}, // fetched per-student on demand via ensureData()
      };
      return store;
    } catch (e) {
      console.error("loadStore error", e);
      if (i === attempts - 1) throw e;
      await new Promise((r) => setTimeout(r, 500 * (i + 1)));
    }
  }
}

async function saveMeta() {
  try {
    const ref = window.__doc(window.__db, META_COLLECTION, META_DOC_ID);
    await window.__setDoc(ref, { roster: store.roster, teacherAuth: store.teacherAuth, levelTestBookings: store.levelTestBookings || [], announcement: store.announcement || null, examKeyLibrary: store.examKeyLibrary || [] });
    return true;
  } catch (e) {
    console.error("saveMeta error", e);
    return false;
  }
}

async function loadStudentDoc(id) {
  try {
    const ref = window.__doc(window.__db, STUDENTS_COLLECTION, id);
    const snap = await window.__getDoc(ref);
    return snap.exists() ? snap.data() : null;
  } catch (e) {
    console.error("loadStudentDoc error", e);
    return null;
  }
}

async function saveStudentDoc(id, data) {
  try {
    const ref = window.__doc(window.__db, STUDENTS_COLLECTION, id);
    await window.__setDoc(ref, data);
    return true;
  } catch (e) {
    console.error("saveStudentDoc error", e);
    return false;
  }
}

// ---------- Answer-key PDF import (e.g. 마더텅/수능기출 정답표) ----------
async function extractPdfTextForKeys(file) {
  if (window.pdfjsLib && window.pdfjsLib.GlobalWorkerOptions && !window.pdfjsLib.GlobalWorkerOptions.workerSrc) {
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  }
  const buf = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
  let allLines = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    const viewport = page.getViewport({ scale: 1 });

    // Group items into rows by Y first (rounded), keeping each item's X position.
    const rowMap = {};
    content.items.forEach((it) => {
      const y = Math.round(it.transform[5]);
      const x = it.transform[4];
      if (!rowMap[y]) rowMap[y] = [];
      rowMap[y].push({ x, str: it.str });
    });
    const ys = Object.keys(rowMap).map(Number);

    // Detect column boundaries from the overall spread of X start-positions on this page —
    // a page laid out in 2-3 columns (like these 정답표 PDFs) has big horizontal gaps between
    // columns; a single-column page has none, and this correctly falls back to one column.
    const allX = [];
    ys.forEach((y) => rowMap[y].forEach((it) => allX.push(it.x)));
    allX.sort((a, b) => a - b);
    const gapThreshold = viewport.width * 0.06;
    const boundaries = [];
    for (let i = 1; i < allX.length; i++) {
      if (allX[i] - allX[i - 1] > gapThreshold) boundaries.push((allX[i] + allX[i - 1]) / 2);
    }
    function colIndexOf(x) {
      let idx = 0;
      for (const b of boundaries) { if (x > b) idx++; }
      return idx;
    }
    const numCols = boundaries.length + 1;

    // Split each Y-row's items by column, then rebuild lines within each column separately.
    const colLines = Array.from({ length: numCols }, () => []);
    ys.forEach((y) => {
      const byCol = Array.from({ length: numCols }, () => []);
      rowMap[y].forEach((it) => byCol[colIndexOf(it.x)].push(it));
      byCol.forEach((items, c) => {
        if (items.length === 0) return;
        items.sort((a, b) => a.x - b.x);
        colLines[c].push({ y, text: items.map((i) => i.str).join(" ") });
      });
    });

    // Emit column by column, left to right; each column read top-to-bottom.
    colLines.forEach((linesInCol) => {
      linesInCol.sort((a, b) => b.y - a.y);
      linesInCol.forEach((l) => allLines.push(l.text));
    });
  }
  return allLines.join("\n");
}
const CIRCLED_DIGIT = { "①": 1, "②": 2, "③": 3, "④": 4, "⑤": 5 };
function parseExamKeyPdfText(text) {
  const ANSWER_RE = /(\d{1,3})\s*([①②③④⑤])/g;
  function hasAnswerPairs(line) { return [...line.matchAll(ANSWER_RE)].length > 0; }
  const ROMAN = "ⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ";
  const topPattern = new RegExp(`^(\\d+[.\\s]|\\d+회|[${ROMAN}]+[.\\s])`);

  const lines = text.split("\n").map((l) => l.trim()).filter(Boolean);
  const sets = [];
  let topLevelName = null;
  let cur = null;

  function flush() {
    if (cur && cur.answers.length > 0) sets.push(cur);
    cur = null;
  }

  lines.forEach((line) => {
    const clean = line.split(/문제편|해설편/)[0].trim();
    if (hasAnswerPairs(line)) {
      if (!cur) return;
      const pairs = [...line.matchAll(ANSWER_RE)];
      pairs.forEach(([, , sym]) => cur.answers.push(CIRCLED_DIGIT[sym]));
      return;
    }
    if (topPattern.test(line)) {
      // top-level header — "N회 시험이름", "NN. 유형이름", or "Ⅰ. 유형이름" (Roman-numeral books).
      // Checked before treating anything as a bare sub-header, since a round's own title can itself
      // contain words like "학년도" (e.g. "02회 2026학년도 6월 모의평가") and must not be split off.
      flush();
      topLevelName = clean;
      cur = { id: uid(), name: topLevelName, answers: [] }; // tentative — replaced if a sub-header follows
    } else {
      // any other non-answer line is treated as a sub-header nested under the current top-level
      // (e.g. "2026학년도", "경찰대/사관학교 입학시험") — pure divider labels with no answers of their
      // own (like "어법편"/"어휘편") are silently dropped by flush()'s answers.length check.
      flush();
      cur = { id: uid(), name: topLevelName ? `${topLevelName} - ${clean}` : clean, answers: [] };
    }
  });
  flush();
  return sets;
}

function groupByDate(items, dateField) {

function splitFirst(line, delim) {
  const idx = line.indexOf(delim);
  if (idx === -1) return null;
  return [line.slice(0, idx).trim(), line.slice(idx + delim.length).trim()];
}
function parseVocabPaste(text) {
  const lines = text.split("\n").map((l) => l.trim()).filter(Boolean);
  const rows = [];
  for (const line of lines) {
    let pair = splitFirst(line, " - ") || splitFirst(line, "\t") || splitFirst(line, ":") || splitFirst(line, ",");
    if (!pair) {
      const m = line.split(/\s{2,}/);
      if (m.length >= 2) pair = [m[0].trim(), m.slice(1).join(" ").trim()];
    }
    if (pair) {
      const [word, meaning] = pair;
      if (word && meaning) rows.push({ word, meaning });
    }
  }
  return rows;
}
function parseExamPaste(text) {
  const blocks = text.split(/\n\s*\n/).map((b) => b.trim()).filter(Boolean);
  const out = [];
  for (const block of blocks) {
    const lines = block.split("\n").map((l) => l.trim()).filter(Boolean);
    if (lines.length < 3) continue;
    const isMarker = (l) => /^(?:[①②③④⑤]|[1-9][.\)]|[A-Da-d][.\)])\s*/.test(l);
    const isAnswer = (l) => /^정답\s*[:：]?/.test(l);
    const qLines = [];
    let i = 0;
    while (i < lines.length && !isMarker(lines[i]) && !isAnswer(lines[i])) { qLines.push(lines[i]); i++; }
    if (qLines.length === 0) continue;
    qLines[0] = qLines[0].replace(/^\d+[.\)]\s*/, "");
    const qText = qLines.join("\n");
    const choices = [];
    let answerIdx = 0;
    for (; i < lines.length; i++) {
      const line = lines[i];
      const ansMatch = line.match(/^정답\s*[:：]?\s*([1-9A-Da-d])/);
      if (ansMatch) {
        const a = ansMatch[1];
        answerIdx = /[1-9]/.test(a) ? parseInt(a, 10) - 1 : a.toUpperCase().charCodeAt(0) - 65;
        continue;
      }
      const marker = line.match(/^(?:[①②③④⑤]|[1-9][.\)]|[A-Da-d][.\)])\s*/);
      if (marker) choices.push(line.slice(marker[0].length).trim());
      else if (choices.length > 0) choices[choices.length - 1] += " " + line;
    }
    if (qText && choices.length >= 2) out.push({ q: qText, choices, answer: Math.min(Math.max(answerIdx, 0), choices.length - 1) });
  }
  return out;
}
function normText(s) { return (s || "").replace(/\s+/g, "").toLowerCase(); }
function checkVocabAnswer(userAnswer, correctMeaning, synonyms) {
  const norm = normText(userAnswer);
  if (!norm) return false;
  const segments = correctMeaning.split(/[,;/·]|\(|\)|\[|\]/).map((s) => normText(s)).filter(Boolean);
  const extra = (synonyms || []).map((s) => normText(s)).filter(Boolean);
  return [...segments, ...extra].some((seg) => seg === norm || (seg.length >= 2 && norm.length >= 2 && (seg.includes(norm) || norm.includes(seg))));
}
async function compressImage(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
          else { width = Math.round(width * (maxDim / height)); height = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => resolve(e.target.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

    const ref = window.__doc(window.__db, STUDENTS_COLLECTION, id);

      next = stripUndefinedDeep(updater(cur));

function MiniCalendar({ selected, onSelect, disablePast }) {
  const [viewDate, setViewDate] = useState(() => (selected ? new Date(selected + "T00:00:00") : new Date()));
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const startWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayStr = today();
  const weekdays = ["일", "월", "화", "수", "목", "금", "토"];
  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  function fmt(d) { return `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`; }
  return html`
    <div style=${{ border: `1px solid ${C.line}`, borderRadius: 4, padding: 9, background: C.white }}>
      <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 5 }}>
        <button type="button" onClick=${() => setViewDate(new Date(year, month - 1, 1))} style=${{ background: "none", border: "none", color: C.navy, cursor: "pointer", fontSize: 14, padding: "2px 6px" }}>‹</button>
        <div style=${{ ...serif, fontSize: 12.5, color: C.navy, fontWeight: 700 }}>${year}년 ${month + 1}월</div>
        <button type="button" onClick=${() => setViewDate(new Date(year, month + 1, 1))} style=${{ background: "none", border: "none", color: C.navy, cursor: "pointer", fontSize: 14, padding: "2px 6px" }}>›</button>
      </div>
      <div style=${{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 1, marginBottom: 1 }}>
        ${weekdays.map((w, i) => html`<div key=${i} style=${{ textAlign: "center", fontSize: 9.5, color: C.slate, fontWeight: 700, padding: "2px 0" }}>${w}</div>`)}
      </div>
      <div style=${{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 1 }}>
        ${cells.map((d, i) => {
          if (d === null) return html`<div key=${i}></div>`;
          const dateStr = fmt(d);
          const isPast = disablePast && dateStr < todayStr;
          const isSelected = dateStr === selected;
          return html`
            <div key=${i} onClick=${() => !isPast && onSelect(dateStr)} style=${{
              textAlign: "center", padding: "4px 0", fontSize: 11.5, borderRadius: 3,
              cursor: isPast ? "default" : "pointer",
              color: isPast ? "#C7C2B4" : (isSelected ? C.white : C.ink),
              background: isSelected ? C.gold : "transparent",
              fontWeight: isSelected ? 700 : 400,
            }}>${d}</div>
          `;
        })}
      </div>
    </div>
  `;
}

function DateField({ value, onChange, placeholder, disablePast }) {
  const [open, setOpen] = useState(false);
  return html`
    <div style=${{ position: "relative" }}>
      <div onClick=${() => setOpen((o) => !o)} style=${{ ...inputStyle, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "space-between", color: value ? C.ink : "#9a9488" }}>
        <span>${value ? fmtDateDay(value) : (placeholder || "날짜 선택")}</span>
        <span style=${{ color: C.gold }}>📅</span>
      </div>
      ${open && html`
        <div style=${{ position: "absolute", top: "calc(100% + 4px)", left: 0, zIndex: 40, boxShadow: "0 6px 16px rgba(20,22,26,0.15)" }}>
          <${MiniCalendar} selected=${value} onSelect=${(d) => { onChange(d); setOpen(false); }} disablePast=${disablePast} />
        </div>
      `}
    </div>
  `;
}

function MonthField({ value, onChange }) {
  const [y, m] = (value || today().slice(0, 7)).split("-").map(Number);
  function shift(delta) {
    const d = new Date(y, m - 1 + delta, 1);
    onChange(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`);
  }
  return html`
    <div style=${{ display: "flex", alignItems: "center", gap: 10, border: `1px solid ${C.line}`, borderRadius: 3, padding: "10px 14px", background: C.white }}>
      <button type="button" onClick=${() => shift(-1)} style=${{ background: "none", border: "none", color: C.navy, cursor: "pointer", fontSize: 15 }}>‹</button>
      <div style=${{ flex: 1, textAlign: "center", ...serif, fontSize: 14, color: C.navy, fontWeight: 700 }}>${y}년 ${m}월</div>
      <button type="button" onClick=${() => shift(1)} style=${{ background: "none", border: "none", color: C.navy, cursor: "pointer", fontSize: 15 }}>›</button>
    </div>
  `;
}

// ---------- Teacher dashboard ----------
function TeacherOverview({ roster, ensureData, dataCache, updateData, levelTestBookings, announcement, saveAnnouncement, onGoBookings, onGoHwStatus, onSelectStudent, showAdd, setShowAdd, name, setName, sc, setSc, pc, setPc, addErr, addStudent }) {
  const [loaded, setLoaded] = useState(false);
  const [annText, setAnnText] = useState(announcement ? announcement.text : "");
  const [annSaved, setAnnSaved] = useState(false);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      for (const s of roster) { await ensureData(s.id); if (cancelled) return; }
      if (!cancelled) setLoaded(true);
    })();
    return () => { cancelled = true; };
  }, []);
  useEffect(() => { setAnnText(announcement ? announcement.text : ""); }, [announcement]);

  async function submitAnnouncement() {
    await saveAnnouncement(annText.trim());
    setAnnSaved(true);
    setTimeout(() => setAnnSaved(false), 2500);
  }

  const pendingBookings = (levelTestBookings || []).filter((b) => b.status !== "완료");
  const todayStr = today();
  const todayHomework = [];
  roster.forEach((s) => {
    const d = dataCache[s.id] || emptyData();
    (d.homework || []).forEach((h) => {
      if (h.dueDate && h.dueDate <= todayStr && !h.done) todayHomework.push({ student: s, hw: h });
    });
  });
  todayHomework.sort((a, b) => a.hw.dueDate.localeCompare(b.hw.dueDate));

  const LIMIT_KB = 1000;
  const sizeInfo = roster.map((s) => {
    const d = dataCache[s.id] || emptyData();
    const kb = Math.round(new Blob([JSON.stringify(d)]).size / 1024);
    return { student: s, kb, pct: Math.min(100, Math.round((kb / LIMIT_KB) * 100)) };
  }).filter((x) => x.pct >= 60).sort((a, b) => b.pct - a.pct);

  async function bulkClearOldPhotos() {
    if (!confirm("용량이 많이 찬 학생들의 예전 방식(용량이 큰) 사진을 한꺼번에 정리할까요? 숙제 내용과 완료 표시는 그대로 남고, 최근에 올라간 사진(용량이 작은 방식)은 그대로 유지돼요.")) return;
    for (const { student } of sizeInfo) {
      const d = dataCache[student.id] || emptyData();
      const next = {
        ...d,
        homework: (d.homework || []).map((h) => {
          const photos = (h.photos || (h.photo ? [h.photo] : [])).filter((p) => p && p.length < 120000); // keep small (newly compressed) photos, drop old large ones
          return { ...withoutLegacyPhoto(h), photos };
        }),
      };
      await updateData(student.id, () => next);
    }
  }
  const allConsults = [];
  roster.forEach((s) => {
    const d = dataCache[s.id] || emptyData();
    (d.consultRequests || []).forEach((r) => allConsults.push({ student: s, r }));
  });
  const pendingConsults = allConsults.filter((c) => c.r.status !== "완료");

  return html`
    <div>
      <div style=${{ fontSize: 13, color: C.slate, marginBottom: 16 }}>왼쪽 목록에서 학생을 바로 선택하시거나, 아래에서 전체 현황을 확인하세요.</div>

      <div className="main-quad-grid" style=${{ display: "grid", gridTemplateColumns: "1fr 1fr", gridTemplateRows: "1fr 1fr", gap: 20, height: "calc(100vh - 190px)", minHeight: 480 }}>
        <div style=${{ display: "flex", flexDirection: "column", minHeight: 0 }}>
          <div style=${{ fontSize: 12, fontWeight: 700, color: C.navy, marginBottom: 8, flexShrink: 0 }}>📢 공지사항</div>
          <${Card} style=${{ padding: 22, marginBottom: 0, flex: 1, minHeight: 0, display: "flex", flexDirection: "column" }}>
            <div style=${{ fontSize: 11.5, color: C.slate, marginBottom: 10, flexShrink: 0 }}>여기에 적으신 내용은 추후 학생·학부모 화면에도 표시할 수 있어요.</div>
            <textarea style=${{ ...inputStyle, flex: 1, minHeight: 0, fontSize: 14.5, resize: "none" }} value=${annText} onChange=${(e) => setAnnText(e.target.value)} placeholder="예: 8/1~8/3 방학 특강 일정 안내" />
            <div style=${{ display: "flex", alignItems: "center", gap: 10, marginTop: 10, flexShrink: 0 }}>
              <${Button} variant="gold" style=${{ padding: "8px 20px", fontSize: 13 }} onClick=${submitAnnouncement}>저장<//>
              ${annSaved && html`<span style=${{ fontSize: 12, color: C.navy }}>저장됐어요.</span>`}
            </div>
          <//>
        </div>
        <div style=${{ display: "flex", flexDirection: "column", minHeight: 0 }}>
          <div style=${{ fontSize: 12, fontWeight: 700, color: C.navy, marginBottom: 8, flexShrink: 0 }}>🗓 레벨테스트·상담 문의 ${pendingBookings.length > 0 ? `(${pendingBookings.length}건)` : ""}</div>
          <${Card} onClick=${onGoBookings} style=${{ marginBottom: 0, flex: 1, minHeight: 0, overflowY: "auto" }}>
            ${pendingBookings.length === 0 ? html`<div style=${{ fontSize: 12.5, color: C.slate }}>대기 중인 문의가 없어요.</div>` : pendingBookings.slice(0, 6).map((b) => html`
              <div key=${b.id} style=${{ fontSize: 12.5, padding: "4px 0" }}>${b.name} ${b.grade ? `(${b.grade})` : ""} — ${b.date}${b.time ? " · " + b.time : ""}</div>
            `)}
            <div style=${{ fontSize: 11.5, color: C.gold, marginTop: 6 }}>전체 보기 →</div>
          <//>
        </div>
        <div style=${{ display: "flex", flexDirection: "column", minHeight: 0 }}>
          <div style=${{ fontSize: 12, fontWeight: 700, color: C.navy, marginBottom: 8, flexShrink: 0 }}>📝 오늘(${fmtDate(todayStr)}) 확인해야 할 숙제 ${todayHomework.length > 0 ? `(${todayHomework.length}건)` : ""}</div>
          <${Card} style=${{ marginBottom: 0, flex: 1, minHeight: 0, overflowY: "auto" }}>
            <div style=${{ fontSize: 11, color: C.slate, marginBottom: 8 }}>기한이 오늘이거나 지났는데 아직 완료 표시 안 된 숙제를 학생 전체 기준으로 모았어요.</div>
            ${!loaded ? html`<div style=${{ fontSize: 12.5, color: C.slate }}>불러오는 중...</div>` : todayHomework.length === 0 ? html`<div style=${{ fontSize: 12.5, color: C.slate }}>확인이 필요한 숙제가 없어요.</div>` : todayHomework.map(({ student, hw }, i) => html`
              <div key=${i} onClick=${() => onSelectStudent(student.id)} style=${{ fontSize: 12.5, padding: "6px 0", borderBottom: `1px dotted ${C.line}`, cursor: "pointer" }}>
                <div style=${{ fontSize: 10.5, color: C.slate }}>기한 ${fmtDate(hw.dueDate)}</div>
                <div style=${{ display: "flex", justifyContent: "space-between" }}>
                  <span><b>${student.name}</b> — ${hw.content}</span>
                  <span style=${{ color: C.danger, fontWeight: 700, whiteSpace: "nowrap", marginLeft: 8 }}>✗ 미완료</span>
                </div>
              </div>
            `)}
            <div onClick=${onGoHwStatus} style=${{ fontSize: 11.5, color: C.gold, marginTop: 8, cursor: "pointer" }}>전체 숙제 현황 보기 →</div>
          <//>
        </div>
        <div style=${{ display: "flex", flexDirection: "column", minHeight: 0 }}>
          <div style=${{ fontSize: 12, fontWeight: 700, color: C.navy, marginBottom: 8, flexShrink: 0 }}>💬 학부모 상담 요청 ${pendingConsults.length > 0 ? `(${pendingConsults.length}건)` : ""}</div>
          <${Card} style=${{ marginBottom: 0, flex: 1, minHeight: 0, overflowY: "auto" }}>
            ${!loaded ? html`<div style=${{ fontSize: 12.5, color: C.slate }}>불러오는 중...</div>` : pendingConsults.length === 0 ? html`<div style=${{ fontSize: 12.5, color: C.slate }}>대기 중인 상담 요청이 없어요.</div>` : pendingConsults.slice(0, 6).map((c) => html`
              <div key=${c.r.id} onClick=${() => onSelectStudent(c.student.id)} style=${{ fontSize: 12.5, padding: "6px 0", borderBottom: `1px dotted ${C.line}`, cursor: "pointer" }}>
                <b>${c.student.name}</b> · ${c.r.method} — 1지망 ${c.r.choices[0].date} ${c.r.choices[0].time}
              </div>
            `)}
            <div onClick=${onGoBookings} style=${{ fontSize: 11.5, color: C.gold, marginTop: 6, cursor: "pointer" }}>레벨테스트·상담 문의에서 함께 보기 →</div>
          <//>
        </div>
      </div>

      ${sizeInfo.length > 0 && html`
        <div style=${{ fontSize: 12, fontWeight: 700, color: C.danger, marginTop: 20, marginBottom: 8 }}>⚠️ 저장 공간이 많이 찬 학생 (${sizeInfo.length}명)</div>
        <${Card} style=${{ borderLeft: `3px solid ${C.danger}` }}>
          ${sizeInfo.map((x) => html`
            <div key=${x.student.id} onClick=${() => onSelectStudent(x.student.id)} style=${{ fontSize: 12.5, padding: "4px 0", cursor: "pointer", display: "flex", justifyContent: "space-between" }}>
              <span>${x.student.name}</span><span style=${{ color: x.pct >= 90 ? C.danger : C.gold, fontWeight: 700 }}>${x.kb}KB (${x.pct}%)</span>
            </div>
          `)}
          <${Button} variant="danger" style=${{ marginTop: 10, padding: "7px 14px", fontSize: 12 }} onClick=${bulkClearOldPhotos}>예전 방식 사진 한꺼번에 정리<//>
          <div style=${{ fontSize: 11, color: C.slate, marginTop: 6 }}>학생 이름을 누르면 그 학생의 "저장 공간 관리" 탭에서 세부적으로 정리할 수도 있어요.</div>
        <//>
      `}
    </div>
  `;
}

function TeacherDash({ roster, saveRosterList, selectedStudentId, setSelectedStudentId, ensureData, updateData, dataCache, onLogout, levelTestBookings, saveBookingsList, announcement, saveAnnouncement, examKeyLibrary, saveExamKeyLibrary }) {
  const [section, setSection] = useState("mainpage");
  const [showAdd, setShowAdd] = useState(false);
  const [name, setName] = useState(""); const [sc, setSc] = useState(""); const [pc, setPc] = useState("");
  const [addErr, setAddErr] = useState("");
  const selected = roster.find((r) => r.id === selectedStudentId);
  const pendingCount = (levelTestBookings || []).filter((b) => b.status !== "완료").length;

  useEffect(() => { if (selectedStudentId) ensureData(selectedStudentId); }, [selectedStudentId]);

  async function addStudent() {
    if (!name || !sc || !pc) return;
    const dupe = roster.some((r) => r.studentCode === sc || r.parentCode === sc || r.studentCode === pc || r.parentCode === pc);
    if (dupe) { setAddErr("이미 사용 중인 코드예요. 다른 코드를 입력해 주세요."); return; }
    const s = { id: uid(), name, studentCode: sc, parentCode: pc };
    await saveRosterList([...roster, s]);
    setName(""); setSc(""); setPc(""); setAddErr(""); setShowAdd(false);
  }
  async function removeStudent(id) {
    await saveRosterList(roster.filter((r) => r.id !== id));
    if (selectedStudentId === id) setSelectedStudentId(null);
  }

  const navItems = [
    { key: "mainpage", label: "Main Page", icon: "🏠" },
    { key: "students", label: "학생 관리", icon: "🗂" },
    { key: "bookings", label: `레벨테스트·상담 문의${pendingCount > 0 ? ` (${pendingCount})` : ""}`, icon: "🗓" },
    { key: "passage", label: "지문 변형·문제 생성", icon: "📄" },
    { key: "archive", label: "보관함", icon: "🗃" },
    { key: "wordbank", label: "단어 시험지 생성", icon: "🔤" },
    { key: "examkeys", label: "정답표 라이브러리", icon: "📑" },
    { key: "reports", label: "리포트 작성", icon: "📊" },
  ];

  const activeKey = section;

  function handleNavChange(key) {
    setSection(key);
    setSelectedStudentId(null);
  }

  let body;
  if (section === "wordbank") {
    body = html`<${WordbankSection} />`;
  } else if (section === "passage") {
    body = html`<${PassageToolSection} />`;
  } else if (section === "archive") {
    body = html`<${ArchiveSection} />`;
  } else if (section === "examkeys") {
    body = html`<${ExamKeyLibrarySection} library=${examKeyLibrary} saveLibrary=${saveExamKeyLibrary} />`;
  } else if (section === "reports") {
    body = html`<${ReportsSection} roster=${roster} ensureData=${ensureData} dataCache=${dataCache} updateData=${updateData} />`;
  } else if (section === "students") {
    body = html`<${StudentsSection} roster=${roster} saveRosterList=${saveRosterList} selectedStudentId=${selectedStudentId} setSelectedStudentId=${setSelectedStudentId}
      ensureData=${ensureData} updateData=${updateData} dataCache=${dataCache} onLogout=${onLogout} examKeyLibrary=${examKeyLibrary}
      showAdd=${showAdd} setShowAdd=${setShowAdd} name=${name} setName=${setName} sc=${sc} setSc=${setSc} pc=${pc} setPc=${setPc}
      addErr=${addErr} addStudent=${addStudent} removeStudent=${removeStudent} />`;
  } else if (section === "hwstatus") {
    body = html`<${HomeworkStatusOverview} roster=${roster} ensureData=${ensureData} dataCache=${dataCache} onBack=${() => setSection("mainpage")} onLogout=${onLogout} />`;
  } else if (section === "bookings") {
    body = html`<${LevelTestBookingsOverview} bookings=${levelTestBookings} saveBookingsList=${saveBookingsList}
      roster=${roster} ensureData=${ensureData} dataCache=${dataCache} updateData=${updateData}
      onBack=${() => setSection("mainpage")} onLogout=${onLogout} />`;
  } else {
    // section === "mainpage"
    body = html`<${TeacherOverview} roster=${roster} ensureData=${ensureData} dataCache=${dataCache} updateData=${updateData}
      levelTestBookings=${levelTestBookings} announcement=${announcement} saveAnnouncement=${saveAnnouncement}
      onGoBookings=${() => setSection("bookings")} onGoHwStatus=${() => setSection("hwstatus")}
      onSelectStudent=${(id) => { setSection("students"); setSelectedStudentId(id); }} />`;
  }

  return html`
    <div style=${{ minHeight: "100vh", background: C.ivory }}>
      <${Shell}
        side=${html`<${SideNav} items=${navItems} active=${activeKey} onChange=${handleNavChange} onLogout=${onLogout} />`}
        header=${html`<div style=${{ ...serif, fontSize: 18, color: C.navy, fontWeight: 700 }}>Sarah's English</div><div style=${{ fontSize: 12, color: C.slate }}>${(navItems.find((n) => n.key === activeKey) || {}).label || ""}</div>`}
      >${body}<//>
    </div>
  `;
}

// ---------- 학생 관리: 왼쪽 학생 목록 / 오른쪽 선택한 학생 정보 (2단 레이아웃) ----------
function MonthlyGoalsEditor({ student, data, updateData }) {
  const [newGoal, setNewGoal] = useState("");
  const month = today().slice(0, 7);
  const goals = (data.monthlyGoals || []).filter((g) => g.month === month);

  async function addGoal() {
    if (!newGoal.trim()) return;
    await updateData(student.id, (d) => ({ ...d, monthlyGoals: [...(d.monthlyGoals || []), { id: uid(), month, text: newGoal.trim(), done: false }] }));
    setNewGoal("");
  }
  async function toggleGoal(id) {
    await updateData(student.id, (d) => ({ ...d, monthlyGoals: (d.monthlyGoals || []).map((g) => (g.id === id ? { ...g, done: !g.done } : g)) }));
  }
  async function removeGoal(id) {
    await updateData(student.id, (d) => ({ ...d, monthlyGoals: (d.monthlyGoals || []).filter((g) => g.id !== id) }));
  }

  return html`
    <${Card} style=${{ marginBottom: 16 }}>
      <div style=${{ fontSize: 12, fontWeight: 700, color: C.navy, marginBottom: 10 }}>✅ 이번 달 성취 목표 (${month.replace("-", "년 ")}월)</div>
      ${goals.length === 0 && html`<div style=${{ fontSize: 12.5, color: C.slate, marginBottom: 8 }}>등록된 목표가 없어요.</div>`}
      ${goals.map((g) => html`
        <div key=${g.id} style=${{ display: "flex", alignItems: "center", gap: 8, padding: "5px 0" }}>
          <input type="checkbox" checked=${g.done} onChange=${() => toggleGoal(g.id)} style=${{ width: 16, height: 16, cursor: "pointer" }} />
          <span style=${{ fontSize: 13, flex: 1, textDecoration: g.done ? "line-through" : "none", color: g.done ? C.slate : C.ink }}>${g.text}</span>
          <button onClick=${() => removeGoal(g.id)} style=${{ background: "none", border: "none", color: C.danger, cursor: "pointer", fontSize: 14 }}>×</button>
        </div>
      `)}
      <div style=${{ display: "flex", gap: 8, marginTop: 10 }}>
        <input style=${{ ...inputStyle, marginBottom: 0 }} placeholder="예: 어법 오답노트 3회 복습" value=${newGoal} onChange=${(e) => setNewGoal(e.target.value)} onKeyDown=${(e) => { if (e.key === "Enter") addGoal(); }} />
        <${Button} variant="gold" style=${{ padding: "8px 14px", fontSize: 12.5 }} onClick=${addGoal}>추가<//>
      </div>
    <//>
  `;
}

function ScheduleGoalEditor({ student, saveRosterList, roster }) {
  const [open, setOpen] = useState(false);
  const [days, setDays] = useState(student.schedule || []);
  const [goal, setGoal] = useState(student.goal || "");
  const [month, setMonth] = useState(today().slice(0, 7));
  const [monthly, setMonthly] = useState((student.monthlyInstances || {})[today().slice(0, 7)] || []);
  useEffect(() => {
    setDays(student.schedule || []); setGoal(student.goal || ""); setOpen(false);
    setMonth(today().slice(0, 7));
    setMonthly((student.monthlyInstances || {})[today().slice(0, 7)] || []);
  }, [student.id]);
  useEffect(() => {
    setMonthly((student.monthlyInstances || {})[month] || []);
  }, [month]);

  const DAY_NAMES = ["일", "월", "화", "수", "목", "금", "토"];

  function addSlot() { setDays([...days, { day: "월", time: "18:00" }]); }
  function updateSlot(i, field, val) { setDays(days.map((d, idx) => (idx === i ? { ...d, [field]: val } : d))); }
  function removeSlot(i) { setDays(days.filter((_, idx) => idx !== i)); }

  function generateMonth() {
    const [y, m] = month.split("-").map(Number);
    const daysInMonth = new Date(y, m, 0).getDate();
    const generated = [];
    for (let d = 1; d <= daysInMonth; d++) {
      const dt = new Date(y, m - 1, d);
      const dayName = DAY_NAMES[dt.getDay()];
      const match = days.find((s) => s.day === dayName);
      if (match) generated.push({ date: `${month}-${String(d).padStart(2, "0")}`, time: match.time });
    }
    setMonthly(generated);
  }
  function updateInstance(i, field, val) { setMonthly(monthly.map((d, idx) => (idx === i ? { ...d, [field]: val } : d))); }
  function removeInstance(i) { setMonthly(monthly.filter((_, idx) => idx !== i)); }
  function addInstance() { setMonthly([...monthly, { date: month + "-01", time: "18:00" }].sort((a, b) => (a.date < b.date ? -1 : 1))); }

  async function save() {
    await saveRosterList(roster.map((r) => (r.id === student.id
      ? { ...r, schedule: days, goal, monthlyInstances: { ...(r.monthlyInstances || {}), [month]: monthly } }
      : r)));
    setOpen(false);
  }

  const sorted = [...(student.schedule || [])].sort((a, b) => DAY_NAMES.indexOf(a.day) - DAY_NAMES.indexOf(b.day));
  const currentMonthly = (student.monthlyInstances || {})[today().slice(0, 7)] || [];

  return html`
    <${Card} style=${{ marginBottom: 16 }}>
      <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <div style=${{ fontSize: 12, fontWeight: 700, color: C.navy }}>🗓 수업 스케줄 · 학습 목표</div>
        <button onClick=${() => setOpen((o) => !o)} style=${{ background: "none", border: "none", color: C.gold, fontSize: 11.5, cursor: "pointer" }}>${open ? "닫기" : "수정"}</button>
      </div>
      ${!open ? html`
        <div style=${{ marginTop: 10 }}>
          <div style=${{ fontSize: 11, color: C.slate, marginBottom: 4 }}>매주 반복 패턴</div>
          <div style=${{ fontSize: 12.5, color: C.ink }}>
            ${sorted.length === 0 ? html`<span style=${{ color: C.slate }}>등록된 수업 스케줄이 없어요.</span>` : sorted.map((d, i) => html`<span key=${i} style=${{ marginRight: 12 }}>${d.day}요일 ${d.time}</span>`)}
          </div>
          ${currentMonthly.length > 0 && html`
            <div style=${{ fontSize: 11, color: C.slate, margin: "10px 0 4px" }}>이번 달 확정 일정 (${currentMonthly.length}회)</div>
            <div style=${{ fontSize: 12.5, color: C.ink }}>${currentMonthly.map((d, i) => html`<span key=${i} style=${{ marginRight: 12 }}>${d.date.slice(5)} ${d.time}</span>`)}</div>
          `}
          ${student.goal && html`<div style=${{ fontSize: 12.5, color: C.slate, marginTop: 8 }}><b style=${{ color: C.ink }}>목표:</b> ${student.goal}</div>`}
        </div>
      ` : html`
        <div style=${{ marginTop: 10 }}>
          <div style=${{ fontSize: 11.5, color: C.slate, fontWeight: 700, marginBottom: 6 }}>매주 반복 패턴</div>
          ${days.map((d, i) => html`
            <div key=${i} style=${{ display: "flex", gap: 8, marginBottom: 6, alignItems: "center" }}>
              <select style=${{ ...inputStyle, marginBottom: 0, width: 90 }} value=${d.day} onChange=${(e) => updateSlot(i, "day", e.target.value)}>
                ${DAY_NAMES.map((n) => html`<option key=${n} value=${n}>${n}요일</option>`)}
              </select>
              <input style=${{ ...inputStyle, marginBottom: 0 }} type="time" value=${d.time} onChange=${(e) => updateSlot(i, "time", e.target.value)} />
              <button onClick=${() => removeSlot(i)} style=${{ background: "none", border: "none", color: C.danger, cursor: "pointer", fontSize: 16 }}>×</button>
            </div>
          `)}
          <${Button} variant="ghost" style=${{ padding: "5px 12px", fontSize: 11.5, marginBottom: 16 }} onClick=${addSlot}>+ 수업 시간 추가<//>

          <div style=${{ fontSize: 11.5, color: C.slate, fontWeight: 700, marginBottom: 6, borderTop: `1px dashed ${C.line}`, paddingTop: 12 }}>월별 확정 일정</div>
          <div style=${{ marginBottom: 8 }}><${MonthField} value=${month} onChange=${setMonth} /></div>
          <${Button} variant="ghost" style=${{ padding: "5px 12px", fontSize: 11.5, marginBottom: 10 }} onClick=${generateMonth}>이 달 일정 위 패턴으로 생성<//>
          ${monthly.map((d, i) => html`
            <div key=${i} style=${{ display: "flex", gap: 8, marginBottom: 6, alignItems: "center" }}>
              <${DateField} value=${d.date} onChange=${(v) => updateInstance(i, "date", v)} />
              <input style=${{ ...inputStyle, marginBottom: 0 }} type="time" value=${d.time} onChange=${(e) => updateInstance(i, "time", e.target.value)} />
              <button onClick=${() => removeInstance(i)} style=${{ background: "none", border: "none", color: C.danger, cursor: "pointer", fontSize: 16 }}>×</button>
            </div>
          `)}
          <${Button} variant="ghost" style=${{ padding: "5px 12px", fontSize: 11.5, marginBottom: 12 }} onClick=${addInstance}>+ 날짜 하나 추가<//>

          <${Field} label="학습 목표 (학부모 화면에도 표시돼요)"><input style=${inputStyle} value=${goal} onChange=${(e) => setGoal(e.target.value)} placeholder="예: 이번 학기 내신 어법 정확도 90% 이상" /><//>
          <${Button} variant="gold" style=${{ padding: "6px 14px", fontSize: 12 }} onClick=${save}>저장<//>
        </div>
      `}
    <//>
  `;
}

// ---------- 단어 시험지 생성 (기존 wordtest.html 도구를 그대로 임베드) ----------
function ExamKeyLibrarySection({ library, saveLibrary }) {
  const [status, setStatus] = useState("");
  const [pending, setPending] = useState(null); // sets parsed from a PDF, awaiting confirmation
  const [manualName, setManualName] = useState("");
  const [manualKey, setManualKey] = useState("");
  const [manualMsg, setManualMsg] = useState("");

  async function handlePdf(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setStatus("PDF 읽는 중...");
    setPending(null);
    try {
      const text = await extractPdfTextForKeys(file);
      const sets = parseExamKeyPdfText(text);
      if (sets.length === 0) {
        setStatus("정답표 형식을 인식하지 못했어요. 'N회 시험이름' 형식 제목과 '01 ① 02 ③...' 형식의 답이 있는 PDF인지 확인해 주세요.");
      } else {
        setPending(sets);
        setStatus(`${sets.length}개 시험의 정답표를 찾았어요. 아래에서 확인하고 저장해 주세요.`);
      }
    } catch (err) {
      setStatus("PDF를 읽지 못했어요. 파일을 확인해 주세요.");
    }
  }

  async function confirmSavePending() {
    await saveLibrary([...(pending || []), ...(library || [])]);
    setPending(null); setStatus("저장했어요.");
  }

  async function addManual() {
    const key = parseAnswerKey(manualKey).map((s) => Number(s)).filter((n) => !isNaN(n));
    if (!manualName || key.length === 0) { setManualMsg("이름과 정답을 입력해 주세요."); return; }
    await saveLibrary([{ id: uid(), name: manualName, answers: key }, ...(library || [])]);
    setManualName(""); setManualKey(""); setManualMsg("");
  }
  async function removeSet(id) {
    await saveLibrary((library || []).filter((s) => s.id !== id));
  }

  return html`
    <div>
      <div style=${{ fontSize: 12, color: C.slate, marginBottom: 14 }}>여기에 정답표를 미리 등록해두면, 모의고사 만들 때 매번 손으로 입력할 필요 없이 골라서 바로 채점할 수 있어요.</div>

      <${Card}>
        <h3>PDF로 한 번에 등록하기</h3>
        <div style=${{ fontSize: 12, color: C.slate, marginBottom: 10 }}>마더텅/수능기출 정답표처럼 "N회 시험이름" 제목 아래 "01 ① 02 ③ ..." 형식으로 된 PDF를 올리면, 여러 회차를 한 번에 인식해서 등록해요.</div>
        <label style=${{ fontSize: 12.5, fontWeight: 600, padding: "8px 14px", borderRadius: 3, border: `1px solid ${C.navy}`, color: C.navy, cursor: "pointer", display: "inline-block" }}>
          PDF 선택
          <input type="file" accept="application/pdf" onChange=${handlePdf} style=${{ display: "none" }} />
        </label>
        ${status && html`<div style=${{ fontSize: 12, color: C.navy, marginTop: 10 }}>${status}</div>`}
        ${pending && html`
          <div style=${{ marginTop: 12 }}>
            ${pending.map((s) => html`<div key=${s.id} style=${{ fontSize: 12.5, padding: "4px 0" }}>${s.name} — ${s.answers.length}문항</div>`)}
            <${Button} variant="gold" style=${{ marginTop: 10 }} onClick=${confirmSavePending}>이대로 저장하기<//>
          </div>
        `}
      <//>

      <${Card}>
        <h3>직접 하나씩 등록하기</h3>
        <${Field} label="시험 이름"><input style=${inputStyle} value=${manualName} onChange=${(e) => setManualName(e.target.value)} placeholder="예: 17회 2024년 3월 학력평가" /><//>
        <${Field} label="정답 (순서대로, 쉼표나 띄어쓰기로 구분)"><textarea style=${{ ...inputStyle, minHeight: 80, fontFamily: "monospace" }} value=${manualKey} onChange=${(e) => setManualKey(e.target.value)} placeholder="예: 5,5,1,3,5,3,2,5,4,3 ..." /><//>
        ${manualMsg && html`<div style=${{ fontSize: 12, color: C.danger, marginBottom: 8 }}>${manualMsg}</div>`}
        <${Button} variant="gold" onClick=${addManual}>등록<//>
      <//>

      <div style=${{ fontSize: 11.5, color: C.slate, fontWeight: 700, margin: "18px 0 8px" }}>등록된 정답표 (${(library || []).length}개)</div>
      ${(!library || library.length === 0) && html`<${Empty} text="아직 등록된 정답표가 없어요." />`}
      ${(library || []).map((s) => html`
        <${Card} key=${s.id}>
          <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div style=${{ fontSize: 13, fontWeight: 700, color: C.navy }}>${s.name}</div>

function BookingsCalendar({ items, selected, onSelect }) {
  const [viewDate, setViewDate] = useState(() => (selected ? new Date(selected + "T00:00:00") : new Date()));
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const startWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const weekdays = ["일", "월", "화", "수", "목", "금", "토"];
  const countByDate = {};
  (items || []).forEach((b) => { countByDate[b.date] = (countByDate[b.date] || 0) + 1; });
  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  function fmt(d) { return `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`; }
  return html`
    <div style=${{ border: `1px solid ${C.line}`, borderRadius: 4, padding: 14, background: C.white }}>
      <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
        <button type="button" onClick=${() => setViewDate(new Date(year, month - 1, 1))} style=${{ background: "none", border: "none", color: C.navy, cursor: "pointer", fontSize: 16, padding: "2px 8px" }}>‹</button>
        <div style=${{ ...serif, fontSize: 15, color: C.navy, fontWeight: 700 }}>${year}년 ${month + 1}월</div>
        <button type="button" onClick=${() => setViewDate(new Date(year, month + 1, 1))} style=${{ background: "none", border: "none", color: C.navy, cursor: "pointer", fontSize: 16, padding: "2px 8px" }}>›</button>
      </div>
      <div style=${{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 3, marginBottom: 2 }}>
        ${weekdays.map((w, i) => html`<div key=${i} style=${{ textAlign: "center", fontSize: 11, color: C.slate, fontWeight: 700, padding: "5px 0" }}>${w}</div>`)}
      </div>
      <div style=${{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 3 }}>
        ${cells.map((d, i) => {
          if (d === null) return html`<div key=${i}></div>`;
          const dateStr = fmt(d);
          const isSelected = dateStr === selected;
          const count = countByDate[dateStr] || 0;
          return html`
            <div key=${i} onClick=${() => onSelect(dateStr)} style=${{
              textAlign: "center", padding: "8px 0 6px", fontSize: 13, borderRadius: 3, cursor: "pointer", position: "relative",
              color: isSelected ? C.white : C.ink,
              background: isSelected ? C.gold : (count > 0 ? "#FBF6EA" : "transparent"),
              fontWeight: isSelected || count > 0 ? 700 : 400,
            }}>
              ${d}
              ${count > 0 && html`<div style=${{ fontSize: 9, marginTop: 2, color: isSelected ? C.white : C.gold }}>●${count > 1 ? count : ""}</div>`}
            </div>
          `;
        })}
      </div>
    </div>
  `;
}

function LevelTestBookingsOverview({ bookings, saveBookingsList, roster, ensureData, dataCache, updateData, onBack, onLogout }) {
  const [loaded, setLoaded] = useState(false);
  const [viewMode, setViewMode] = useState("calendar"); // "calendar" | "list"
  const [resultDrafts, setResultDrafts] = useState({});

  useEffect(() => {
    let cancelled = false;
    (async () => {
      for (const s of roster || []) { await ensureData(s.id); if (cancelled) return; }
      if (!cancelled) setLoaded(true);
    })();
    return () => { cancelled = true; };
  }, []);

  const bookingItems = (bookings || []).map((b) => ({
    _source: "booking", id: b.id, date: b.date, time: b.time, name: b.name, grade: b.grade, kind: b.kind || "레벨테스트",
    phone: b.phone, school: b.school, level: b.level, note: b.note, status: b.status || "대기", result: b.result, venue: b.venue,
  }));
  const consultItems = [];
  (roster || []).forEach((s) => {
    const d = dataCache[s.id] || emptyData();
    (d.consultRequests || []).forEach((r) => {
      const first = (r.choices || [])[0] || {};
      consultItems.push({
        _source: "consult", _studentId: s.id, id: r.id, date: first.date || "", time: first.time || "",
        name: s.name, grade: "", kind: "학부모상담", method: r.method, note: r.note, status: r.status || "대기", result: r.result,
      });
    });
  });
  const allItems = [...bookingItems, ...consultItems].filter((it) => it.date);
  const dates = [...new Set(allItems.map((it) => it.date))].sort();
  const [selectedDate, setSelectedDate] = useState(() => dates[0] || today());

  async function setStatus(item, status) {
    if (item._source === "booking") {
      await saveBookingsList((bookings || []).map((b) => (b.id === item.id ? { ...b, status } : b)));
    } else {
      await updateData(item._studentId, (d) => ({ ...d, consultRequests: (d.consultRequests || []).map((r) => (r.id === item.id ? { ...r, status } : r)) }));
    }
  }
  async function remove(item) {
    if (item._source === "booking") {
      await saveBookingsList((bookings || []).filter((b) => b.id !== item.id));
    } else {
      await updateData(item._studentId, (d) => ({ ...d, consultRequests: (d.consultRequests || []).filter((r) => r.id !== item.id) }));
    }
  }
  async function saveResult(item) {
    const text = resultDrafts[item.id] != null ? resultDrafts[item.id] : "";
    if (item._source === "booking") {
      await saveBookingsList((bookings || []).map((b) => (b.id === item.id ? { ...b, result: text } : b)));
    } else {
      await updateData(item._studentId, (d) => ({ ...d, consultRequests: (d.consultRequests || []).map((r) => (r.id === item.id ? { ...r, result: text } : r)) }));
    }
  }

  const dayList = allItems.filter((it) => it.date === selectedDate);
  const sortedAll = [...allItems].sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));

  return html`
    <div>
      <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
        <${BackBtn} onClick=${onBack} />
        <button onClick=${onLogout} style=${{ background: "none", border: "none", color: C.slate, fontSize: 12.5, cursor: "pointer" }}>로그아웃</button>
      </div>
      <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
        <div style=${{ ...serif, fontSize: 19, color: C.navy }}>레벨테스트 · 상담 예약 현황</div>
        <div style=${{ display: "flex", gap: 6 }}>
          <${Button} variant=${viewMode === "calendar" ? "gold" : "ghost"} style=${{ padding: "6px 14px", fontSize: 12 }} onClick=${() => setViewMode("calendar")}>달력<//>
          <${Button} variant=${viewMode === "list" ? "gold" : "ghost"} style=${{ padding: "6px 14px", fontSize: 12 }} onClick=${() => setViewMode("list")}>전체 목록<//>
        </div>
      </div>
      <div style=${{ fontSize: 12, color: C.slate, marginBottom: 14 }}>레벨테스트·상담 예약뿐 아니라, 학부모님이 각 학생 화면에서 신청한 상담 요청도 함께 모아 보여드려요.</div>
      ${allItems.length === 0 && !loaded ? html`<${Empty} text="불러오는 중..." />` : allItems.length === 0 ? html`<${Empty} text="아직 접수된 예약이나 상담 요청이 없어요." />` : viewMode === "list" ? html`
        ${sortedAll.map((item) => html`
          <${BookingEntryCard} key=${item._source + item.id} item=${item}
            onSetStatus=${(it, st) => setStatus(it, st)} onRemove=${remove} onSaveResult=${saveResult}
            resultDraft=${resultDrafts[item.id]} onDraftChange=${(v) => setResultDrafts((prev) => ({ ...prev, [item.id]: v }))} />
        `)}
      ` : html`
        <div className="ap-split">
          <div className="ap-split-left">
            <${BookingsCalendar} items=${allItems} selected=${selectedDate} onSelect=${setSelectedDate} />
          </div>
          <div className="ap-split-right">
            <div style=${{ fontSize: 12.5, color: C.slate, marginBottom: 12 }}>${fmtDateDay(selectedDate)} · ${dayList.length}건</div>
            ${dayList.length === 0 && html`<${Empty} text="이 날짜엔 예약이 없어요. 달력에서 점(●)이 있는 날짜를 눌러 보세요." />`}
            ${dayList.map((item) => html`
              <${BookingEntryCard} key=${item._source + item.id} item=${item}
                onSetStatus=${(it, st) => setStatus(it, st)} onRemove=${remove} onSaveResult=${saveResult}
                resultDraft=${resultDrafts[item.id]} onDraftChange=${(v) => setResultDrafts((prev) => ({ ...prev, [item.id]: v }))} />
            `)}
          </div>
        </div>
      `}
    </div>
  `;
}

  const sizeKB = Math.round(sizeBytes / 1024);
  const LIMIT_KB = 1000; // Firestore's hard cap is 1MB per document
  const pct = Math.min(100, Math.round((sizeBytes / (LIMIT_KB * 1024)) * 100));
  const photoCount = (data.homework || []).reduce((sum, h) => sum + (h.photos || (h.photo ? [h.photo] : [])).length, 0);
  const vocabResultCount = (data.vocabResults || []).length;
  const examResultCount = (data.examResults || []).length;
  const logCount = (data.logs || []).length;

  async function clearAllPhotos() {
    if (!confirm("이 학생의 모든 숙제 사진을 삭제할까요? 숙제 내용과 완료 표시는 그대로 남아요.")) return;

    setMsg("사진을 모두 삭제했어요.");
  }
  async function clearVocabResults() {
    if (!confirm("단어 재시험(퀴즈) 응시 기록을 전부 삭제할까요? 퀴즈 자체(문제)는 남고, 학생이 응시했던 결과 기록만 지워져요.")) return;
    await updateData((d) => ({ ...d, vocabResults: [] }));
    setMsg("단어 재시험 응시 기록을 정리했어요.");

function VocabLogEditor({ data, updateData }) {
  const [date, setDate] = useState(today());

  const [customBook, setCustomBook] = useState("");
  const [range, setRange] = useState("");
  const [correct, setCorrect] = useState("");
  const [total, setTotal] = useState("");
  const [retest, setRetest] = useState("");

  const isCumulative = range.includes("누적");
  const threshold = isCumulative ? 90 : 80;
  const pct = total ? Math.round((Number(correct) / Number(total)) * 100) : null;
  const allowedWrong = total ? Math.round(Number(total) * (isCumulative ? 0.10 : 0.20)) : null;
  const wrongCount = total && correct !== "" ? Number(total) - Number(correct) : null;
  const willPass = wrongCount !== null ? wrongCount <= allowedWrong : null;
  const effectiveBook = book === "__other__" ? customBook.trim() : book;

  async function add() {
    if (!date || !total || !range || !effectiveBook) return;
    const scorePct = Math.round((Number(correct) / Number(total)) * 100);
    const allowed = Math.round(Number(total) * (range.includes("누적") ? 0.10 : 0.20));
    const passed = (Number(total) - Number(correct)) <= allowed;
    await updateData((d) => ({
      ...d,
      vocabLog: [{ id: uid(), date, book: effectiveBook, range, correct: Number(correct), total: Number(total), score: scorePct, passed, retest }, ...(d.vocabLog || [])],
    }));
    setRange(""); setCorrect(""); setTotal(""); setRetest("");
  }
  async function remove(id) { await updateData((d) => ({ ...d, vocabLog: (d.vocabLog || []).filter((v) => v.id !== id) })); }

  const list = data.vocabLog || [];
  return html`
    <div>
      <div style=${{ fontSize: 12, color: C.slate, marginBottom: 10 }}>단어 시험을 직접 보고 채점한 결과를 기록하세요. 범위에 "누적"이 들어가면 90%(오답 10% 이내), 아니면 80%(오답 20% 이내) 기준으로 자동 합격 판정돼요. 문항 수에 맞춰 반올림한 허용 오답 개수를 기준으로 판정합니다.</div>
      <${Card}>
        <div className="ap-split">
          <div className="ap-split-left">
            <div style=${{ fontSize: 12, color: C.slate, marginBottom: 8, fontWeight: 600 }}>날짜</div>
            <${MiniCalendar} selected=${date} onSelect=${setDate} />
          </div>
          <div className="ap-split-right">
            <${Field} label="교재">
              <select style=${inputStyle} value=${book} onChange=${(e) => setBook(e.target.value)}>
                ${BOOK_LIST.map((b) => html`<option key=${b} value=${b}>${b}</option>`)}
                <option value="__other__">기타 (직접 입력)</option>
              </select>
            <//>
            ${book === "__other__" && html`<${Field} label="교재명 직접 입력"><input style=${inputStyle} value=${customBook} onChange=${(e) => setCustomBook(e.target.value)} placeholder="교재 이름 입력" /><//>`}
            <${Field} label="시험범위"><input style=${inputStyle} value=${range} onChange=${(e) => setRange(e.target.value)} placeholder="예: Day 1-9 누적" /><//>
            <div style=${{ display: "flex", gap: 8 }}>
              <div style=${{ flex: 1 }}><${Field} label="맞은 개수"><input style=${inputStyle} type="number" value=${correct} onChange=${(e) => setCorrect(e.target.value)} /><//></div>
              <div style=${{ flex: 1 }}><${Field} label="총 문항"><input style=${inputStyle} type="number" value=${total} onChange=${(e) => setTotal(e.target.value)} /><//></div>
            </div>
            ${pct !== null && html`<div style=${{ fontSize: 12.5, marginBottom: 10, color: willPass ? C.navy : C.danger, fontWeight: 700 }}>${pct}% (오답 ${wrongCount}개) · ${total}문항 중 오답 ${allowedWrong}개까지 허용 → ${willPass ? "합격" : "불합격"}</div>`}
            <${Field} label="재시험 메모 (선택)"><input style=${inputStyle} value=${retest} onChange=${(e) => setRetest(e.target.value)} placeholder="예: 7/20 10시" /><//>

          </div>

      <//>
      ${list.length === 0 && html`<${Empty} text="아직 기록이 없어요." />`}

              <div style=${{ fontSize: 13, marginTop: 4 }}>${v.range} — ${v.correct}/${v.total} (${v.score}%)</div>
              ${v.retest && html`<div style=${{ fontSize: 12, color: C.slate, marginTop: 2 }}>재시험: ${v.retest}</div>`}

// ---------- 정기시험 (내신 · 모의고사 점수) ----------
function buildScoreChartSVG(rows) {
  const pts = (rows || []).filter((r) => r.scoreNum != null && r.scoreNum !== "").map((r) => ({ date: r.date, examName: r.examName, score: Number(r.scoreNum) })).sort((a, b) => (a.date < b.date ? -1 : 1));
  if (pts.length < 2) {
    return '<div style="font-size:12.5px;color:#8A8370;padding:10px 0;">숫자 점수가 2개 이상 기록되면 그래프가 나타나요.</div>';
  }
  const W = 640, H = 220, padL = 36, padR = 20, padT = 20, padB = 34;
  const scores = pts.map((p) => p.score);
  let maxS = Math.max(...scores), minS = Math.min(...scores);
  if (maxS === minS) { maxS += 5; minS -= 5; }
  const rangePad = (maxS - minS) * 0.15;
  maxS += rangePad; minS = Math.max(0, minS - rangePad);
  const xStep = (W - padL - padR) / (pts.length - 1);
  const yOf = (s) => padT + (H - padT - padB) * (1 - (s - minS) / (maxS - minS));
  const xOf = (i) => padL + i * xStep;
  const linePath = pts.map((p, i) => `${i === 0 ? "M" : "L"}${xOf(i).toFixed(1)},${yOf(p.score).toFixed(1)}`).join(" ");
  const gridLines = [0, 0.5, 1].map((f) => {
    const y = padT + (H - padT - padB) * f;
    const val = Math.round(maxS - (maxS - minS) * f);
    return `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#EDE9DD" stroke-width="1"/><text x="${padL - 6}" y="${y + 4}" font-size="10" fill="#8A8370" text-anchor="end">${val}</text>`;
  }).join("");
  const points = pts.map((p, i) => `
    <circle cx="${xOf(i).toFixed(1)}" cy="${yOf(p.score).toFixed(1)}" r="3.5" fill="#B8935A"/>
    <text x="${xOf(i).toFixed(1)}" y="${(yOf(p.score) - 10).toFixed(1)}" font-size="11" fill="#1C2B4A" text-anchor="middle" font-weight="700">${p.score}</text>
    <text x="${xOf(i).toFixed(1)}" y="${H - 10}" font-size="9.5" fill="#8A8370" text-anchor="middle">${(p.date || "").slice(5)}</text>
  `).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:640px;height:auto;font-family:'Noto Sans KR',sans-serif;">
    ${gridLines}
    <path d="${linePath}" fill="none" stroke="#1C2B4A" stroke-width="2"/>
    ${points}
  </svg>`;
}

function parsePercentNum(str) {
  if (!str) return null;
  const m = String(str).match(/(\d+(?:\.\d+)?)/);
  return m ? Number(m[1]) : null;
}
function compareNeltCategory(curr, other) {
  if (!curr || !other) return null;
  const p1 = parsePercentNum(curr.percentile), p0 = parsePercentNum(other.percentile);
  const diff = (p1 != null && p0 != null) ? p0 - p1 : null; // 양수면 향상 (상위 %가 낮아짐)
  return { diff, levelOld: other.level_desc || "", levelNew: curr.level_desc || "" };
}
function neltDiffText(diff) {
  if (diff == null) return "";
  if (diff > 0) return `▲ 상위 ${diff}%p 향상`;
  if (diff < 0) return `▼ 상위 ${Math.abs(diff)}%p 하락`;
  return "변동 없음";
}
function buildNeltTrendChartSVG(results) {
  const pts = (results || [])
    .map((r) => ({ date: r.test_date, grade: r.overall_level_desc || r.overall_level || "", pct: parsePercentNum(r.overall_percentile) }))
    .filter((p) => p.date && p.pct != null)
    .sort((a, b) => (a.date < b.date ? -1 : 1));
  if (pts.length < 2) return '<div style="font-size:12.5px;color:#8A8370;padding:10px 0;">NELT 결과가 2개 이상 쌓이면 추이 그래프가 나타나요.</div>';
  const W = 640, H = 170, padL = 20, padR = 20, padT = 26, padB = 30;
  const xStep = pts.length > 1 ? (W - padL - padR) / (pts.length - 1) : 0;
  const xOf = (i) => padL + i * xStep;
  // percentile은 낮을수록 좋은 성적이라, 위로 갈수록(=y가 작을수록) 좋은 성적이 되도록 그대로 비율 사용
  const yOf = (pct) => padT + (H - padT - padB) * (Math.min(pct, 100) / 100);
  const linePath = pts.map((p, i) => `${i === 0 ? "M" : "L"}${xOf(i).toFixed(1)},${yOf(p.pct).toFixed(1)}`).join(" ");
  const points = pts.map((p, i) => `
    <circle cx="${xOf(i).toFixed(1)}" cy="${yOf(p.pct).toFixed(1)}" r="3.5" fill="#B8935A"/>
    <text x="${xOf(i).toFixed(1)}" y="${(yOf(p.pct) - 12).toFixed(1)}" font-size="11" fill="#1C2B4A" text-anchor="middle" font-weight="700">${p.grade}</text>
    <text x="${xOf(i).toFixed(1)}" y="${(yOf(p.pct) + 17).toFixed(1)}" font-size="10" fill="#B8935A" text-anchor="middle">상위 ${p.pct}%</text>
    <text x="${xOf(i).toFixed(1)}" y="${H - 8}" font-size="9.5" fill="#8A8370" text-anchor="middle">${(p.date || "").slice(5)}</text>
  `).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:640px;height:auto;font-family:'Noto Sans KR',sans-serif;">
    <line x1="${padL}" y1="${padT}" x2="${W - padR}" y2="${padT}" stroke="#EDE9DD" stroke-width="1"/>
    <path d="${linePath}" fill="none" stroke="#1C2B4A" stroke-width="2"/>
    ${points}
  </svg>`;
}

function NeltUploadSection({ data, updateData }) {
  const [uploading, setUploading] = useState(false);
  const [draft, setDraft] = useState(null);
  const [err, setErr] = useState("");
  const results = data.neltResults || [];
  const CATS = [["vocab", "어휘"], ["grammar", "문법"], ["listening", "듣기"], ["reading", "독해"]];

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(",")[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    setUploading(true); setErr(""); setDraft(null);
    try {
      const pdfBase64 = await fileToBase64(file);
      const res = await fetch(NELT_WORKER_URL, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ mode: "nelt", pdfBase64 }),
      });
      const json = await res.json();
      if (!res.ok || json.error) {
        setErr((json.error || "분석에 실패했습니다.") + (json.detail ? " / " + String(json.detail).slice(0, 200) : ""));
      } else {
        setDraft({
          test_name: json.test_name || "", student_name: json.student_name || "", grade: json.grade || "",
          test_date: json.test_date || today(),
          overall_level: json.overall_level || "", overall_level_desc: json.overall_level_desc || "", overall_percentile: json.overall_percentile || "",
          categories: {
            vocab: json.categories?.vocab || {}, grammar: json.categories?.grammar || {},
            listening: json.categories?.listening || {}, reading: json.categories?.reading || {},
          },
        });
      }
    } catch (ex) {
      setErr("서버에 연결하지 못했습니다: " + String(ex).slice(0, 150));
    } finally {
      setUploading(false);
      e.target.value = "";
    }
  }

  function updateDraftField(field, val) { setDraft((d) => ({ ...d, [field]: val })); }
  function updateDraftCat(cat, field, val) { setDraft((d) => ({ ...d, categories: { ...d.categories, [cat]: { ...d.categories[cat], [field]: val } } })); }

  async function saveDraft() {
    await updateData((d) => ({ ...d, neltResults: [{ id: uid(), ...draft }, ...(d.neltResults || [])] }));
    setDraft(null);
  }
  async function removeResult(id) { await updateData((d) => ({ ...d, neltResults: (d.neltResults || []).filter((r) => r.id !== id) })); }

  const sortedResults = [...results].sort((a, b) => (a.test_date < b.test_date ? -1 : 1));
  function getComparisons(r) {
    const idx = sortedResults.findIndex((x) => x.id === r.id);
    const prev = idx > 0 ? sortedResults[idx - 1] : null;
    const first = sortedResults.length > 1 && idx > 0 ? sortedResults[0] : null;
    return { prev, first };
  }

  return html`
    <div>
      <div style=${{ fontSize: 12, fontWeight: 700, color: C.navy, marginBottom: 8 }}>📄 NELT 성적표 업로드</div>
      <${Card} style=${{ marginBottom: 20 }}>
        <div style=${{ fontSize: 11.5, color: C.slate, marginBottom: 10 }}>NELT 성적표 PDF를 올리면 어휘·문법·듣기·독해별 수준과 석차를 자동으로 뽑아드려요 (1회 분석당 약 수십 원, 완료 전에 확인 후 저장할 수 있어요).</div>
        <input type="file" accept="application/pdf" onChange=${handleFile} disabled=${uploading} style=${{ fontSize: 12.5 }} />
        ${uploading && html`<div style=${{ fontSize: 12.5, color: C.gold, marginTop: 8 }}>분석 중... (10~20초 정도 걸려요)</div>`}
        ${err && html`<div style=${{ fontSize: 12, color: C.danger, marginTop: 8 }}>${err}</div>`}
      <//>

      ${draft && html`
        <${Card} style=${{ marginBottom: 20, borderLeft: `3px solid ${C.gold}` }}>
          <div style=${{ fontSize: 12, fontWeight: 700, color: C.navy, marginBottom: 10 }}>추출된 내용 확인 (필요하면 수정 후 저장하세요)</div>
          <div style=${{ display: "flex", gap: 8 }}>
            <div style=${{ flex: 1 }}><${Field} label="테스트명"><input style=${inputStyle} value=${draft.test_name} onChange=${(e) => updateDraftField("test_name", e.target.value)} /><//></div>
            <div style=${{ flex: 1 }}><${Field} label="응시일"><${DateField} value=${draft.test_date} onChange=${(v) => updateDraftField("test_date", v)} /><//></div>
          </div>
          <div style=${{ display: "flex", gap: 8 }}>
            <div style=${{ flex: 1 }}><${Field} label="종합 레벨"><input style=${inputStyle} value=${draft.overall_level} onChange=${(e) => updateDraftField("overall_level", e.target.value)} /><//></div>
            <div style=${{ flex: 1 }}><${Field} label="종합 수준"><input style=${inputStyle} value=${draft.overall_level_desc} onChange=${(e) => updateDraftField("overall_level_desc", e.target.value)} /><//></div>
            <div style=${{ flex: 1 }}><${Field} label="종합 석차"><input style=${inputStyle} value=${draft.overall_percentile} onChange=${(e) => updateDraftField("overall_percentile", e.target.value)} /><//></div>
          </div>
          ${CATS.map(([key, label]) => html`
            <div key=${key} style=${{ borderTop: `1px dashed ${C.line}`, paddingTop: 10, marginTop: 6 }}>
              <div style=${{ fontSize: 12, fontWeight: 700, color: C.gold, marginBottom: 6 }}>${label}</div>
              <div style=${{ display: "flex", gap: 8 }}>
                <div style=${{ flex: 1 }}><${Field} label="수준"><input style=${inputStyle} value=${draft.categories[key].level_desc || ""} onChange=${(e) => updateDraftCat(key, "level_desc", e.target.value)} /><//></div>

              </div>

              const cmpFirst = first ? compareNeltCategory(r.categories[key], first.categories[key]) : null;
              return html`
              <div key=${key} style=${{ border: `1px solid ${C.line}`, borderRadius: 3, padding: 8 }}>

                <div style=${{ fontSize: 12, color: C.gold, fontWeight: 700 }}>${(r.categories && r.categories[key] && r.categories[key].percentile) || ""}</div>

                ${cmpPrev && html`<div style=${{ fontSize: 10.5, color: cmpPrev.diff > 0 ? C.navy : (cmpPrev.diff < 0 ? C.danger : C.slate), marginTop: 4, borderTop: `1px dotted ${C.line}`, paddingTop: 4 }}>직전 대비: ${neltDiffText(cmpPrev.diff)}</div>`}
                ${cmpFirst && html`<div style=${{ fontSize: 10.5, color: cmpFirst.diff > 0 ? C.navy : (cmpFirst.diff < 0 ? C.danger : C.slate), marginTop: 2 }}>첫 시험 대비: ${neltDiffText(cmpFirst.diff)}</div>`}
              </div>
            `;

        <//>
      `;
      })}
    </div>
  `;
}

function buildDailyReportText(student, data, date, hwFrom) {
  const dt = new Date(date + "T00:00:00");
  const days = ["일", "월", "화", "수", "목", "금", "토"];
  const md = `${dt.getMonth() + 1}/${dt.getDate()}(${days[dt.getDay()]})`;

  const logsToday = (data.logs || []).filter((l) => l.date === date);
  const learnedBlock = logsToday.length > 0 ? logsToday.map((l) => l.content).join("\n") : "문법:\n독해:";

  const vocabToday = (data.vocabLog || []).filter((v) => v.date === date);
  const vocabBlock = vocabToday.length > 0
    ? vocabToday.map((v) => `${v.book} ${v.range}: ${v.correct}/${v.total} (${v.score}%) - ${v.passed ? "합격" : "불합격"}`).join("\n")
    : "기록 없음";

  const yesterday = new Date(dt); yesterday.setDate(yesterday.getDate() - 1);
  const y = yesterday.getFullYear(), m2 = String(yesterday.getMonth() + 1).padStart(2, "0"), d2 = String(yesterday.getDate()).padStart(2, "0");
  const yesterdayStr = `${y}-${m2}-${d2}`;
  const fromD = hwFrom && hwFrom <= yesterdayStr ? hwFrom : yesterdayStr;
  const inRange = (d) => d && d >= fromD && d <= yesterdayStr;
  const hwRange = (data.homework || []).filter((h) => inRange(h.dueDate));
  const hwBlock = hwRange.length > 0
    ? hwRange.map((h) => `${h.content} → ${h.done ? "완료" : "미완료"}`).join("\n")
    : "기록 없음";

  return `[${student.name}] ${md} 수업 안내\n📖 오늘 배운 내용\n${learnedBlock}\n✏️ 단어시험 결과\n${vocabBlock}\n📝 숙제 확인\n${hwBlock}`;
}

const REPORT_CATEGORIES = [
  { key: "vocab", label: "어휘 (Vocabulary)", desc: "단어 암기·활용" },
  { key: "grammar", label: "문법 (Grammar)", desc: "구문 이해·정확성" },
  { key: "reading", label: "독해 (Reading)", desc: "지문 이해·속도" },
  { key: "writing", label: "작문 (Writing)", desc: "영작·표현력" },
  { key: "attitude", label: "수업 태도 (Attitude)", desc: "집중·참여도" },
  { key: "homework", label: "과제 성실도 (Homework)", desc: "수행·완성도" },
];
const REPORT_RATINGS = ["매우 우수", "우수", "보통", "노력 요함"];

function buildNeltComparisonText(current, previous) {
  if (!current) return "";
  const CATS = [["vocab", "어휘"], ["grammar", "문법"], ["listening", "듣기"], ["reading", "독해"]];
  const lines = [];
  const curOverall = parsePercentNum(current.overall_percentile);
  const prevOverall = previous ? parsePercentNum(previous.overall_percentile) : null;
  const overallLabel = `${current.overall_level || ""} ${current.overall_level_desc || ""}`.trim();
  if (curOverall != null && prevOverall != null) {
    lines.push(`종합: ${overallLabel} · 상위 ${curOverall}% (직전 상위 ${prevOverall}% 대비 ${neltDiffText(prevOverall - curOverall)})`);
  } else {
    lines.push(`종합: ${overallLabel} · ${current.overall_percentile || "-"}`);
  }
  CATS.forEach(([key, label]) => {
    const cur = (current.categories && current.categories[key]) || {};
    const prev = (previous && previous.categories && previous.categories[key]) || null;
    const curNum = parsePercentNum(cur.percentile);
    const prevNum = prev ? parsePercentNum(prev.percentile) : null;
    if (curNum != null && prevNum != null) {
      lines.push(`${label}: 상위 ${curNum}% (${neltDiffText(prevNum - curNum)})`);
    } else {
      lines.push(`${label}: ${cur.percentile || cur.level_desc || "-"}`);
    }
  });
  return lines.join("\n");
}

function MonthlyReportView({ student, data, updateData }) {
  const [month, setMonth] = useState(today().slice(0, 7));
  const saved = (data.monthlyReports || {})[month] || {};
  const [ratings, setRatings] = useState(saved.ratings || {});
  const [attendance, setAttendance] = useState(saved.attendance || null);
  const [content, setContent] = useState(saved.content != null ? saved.content : null);
  const [good, setGood] = useState(saved.good || "");
  const [improve, setImprove] = useState(saved.improve || "");
  const [comment, setComment] = useState(saved.comment || "");
  const [nextMonth, setNextMonth] = useState(saved.nextMonth || "");
  const [neltComment, setNeltComment] = useState(saved.neltComment || "");
  const [published, setPublished] = useState(saved.published || false);
  const [generating, setGenerating] = useState(false);
  const [genErr, setGenErr] = useState("");

  const inMonth = (s) => s && s.startsWith(month);
  const hwRows = (data.homework || []).filter((h) => inMonth(h.dueDate));
  const hwDone = hwRows.filter((h) => h.done).length;
  const hwRate = hwRows.length ? Math.round((hwDone / hwRows.length) * 100) : null;

  const vcRows = (data.vocabLog || []).filter((v) => inMonth(v.date));
  const vcPass = vcRows.filter((v) => v.passed).length;
  const vcRate = vcRows.length ? Math.round((vcPass / vcRows.length) * 100) : null;

  const logRows = (data.logs || []).filter((l) => inMonth(l.date)).sort((a, b) => (a.date < b.date ? -1 : 1));
  const scheduledCount = ((student.monthlyInstances || {})[month] || []).length;
  const attendedCount = new Set(logRows.map((l) => l.date)).size;
  const neltThisMonth = (data.neltResults || []).filter((r) => inMonth(r.test_date));

  useEffect(() => {
    const s = (data.monthlyReports || {})[month] || {};
    setRatings(s.ratings || {});
    setAttendance(s.attendance || null);
    setContent(s.content != null ? s.content : null);
    setGood(s.good || ""); setImprove(s.improve || ""); setComment(s.comment || ""); setNextMonth(s.nextMonth || "");
    setNeltComment(s.neltComment || ""); setPublished(s.published || false); setGenErr("");
  }, [month]);

  const att = attendance || {
    classDays: scheduledCount || attendedCount || "",
    attended: attendedCount || "",
    absent: scheduledCount ? Math.max(scheduledCount - attendedCount, 0) : "",
    hwRate: hwRate === null ? "" : hwRate + "%",
    vocabRate: vcRate === null ? "" : vcRate + "%",
  };
  const draftContent = content != null ? content : (logRows.length === 0 ? "" : logRows.map((l) => `• ${fmtDate(l.date)}: ${l.content}`).join("\n"));

  async function saveReport(publishOverride) {
    const nextPublished = publishOverride != null ? publishOverride : published;
    await updateData((d) => ({
      ...d,
      monthlyReports: { ...(d.monthlyReports || {}), [month]: { ratings, attendance: att, content: draftContent, good, improve, comment, nextMonth, neltComment, published: nextPublished } },
    }));
    setPublished(nextPublished);
  }
  async function publishReport() { await saveReport(true); }
  async function unpublishReport() { await saveReport(false); }

  function setRating(key, val) { setRatings((r) => ({ ...r, [key]: val })); }
  function setAtt(key, val) { setAttendance({ ...att, [key]: val }); }

  function findPreviousNelt() {
    const all = (data.neltResults || []).filter((r) => r.test_date && r.test_date < month + "-01");
    return all.sort((a, b) => (a.test_date < b.test_date ? 1 : -1))[0] || null;
  }

  async function generateWithAI() {
    setGenerating(true); setGenErr("");
    try {
      const currentNelt = neltThisMonth[neltThisMonth.length - 1] || null;
      if (currentNelt) setNeltComment(buildNeltComparisonText(currentNelt, findPreviousNelt()));
      const res = await fetch(NELT_WORKER_URL, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          mode: "monthlyReport",
          studentName: student.name,
          month,
          rough: { content: draftContent, good, improve, comment, nextMonth },
        }),
      });
      const json = await res.json();
      if (!res.ok || json.error) {
        setGenErr((json.error || "AI 작성에 실패했습니다.") + (json.detail ? " / " + String(json.detail).slice(0, 200) : ""));
      } else {
        if (json.content != null) setContent(json.content);
        if (json.good != null) setGood(json.good);
        if (json.improve != null) setImprove(json.improve);
        if (json.comment != null) setComment(json.comment);
        if (json.nextMonth != null) setNextMonth(json.nextMonth);
      }
    } catch (ex) {
      setGenErr("서버에 연결하지 못했습니다: " + String(ex).slice(0, 150));
    } finally {
      setGenerating(false);
    }
  }

  function printReport() {

    const ratingCell = (key) => REPORT_RATINGS.map((r) => `<td style="text-align:center;">${ratings[key] === r ? "●" : ""}</td>`).join("");

function LogsEditor({ data, updateData }) {

  function startEdit(l) { setEditId(l.id); setEditDate(l.date); setEditContent(l.content); }

    await updateData((d) => ({ ...d, logs: d.logs.map((l) => (l.id === editId ? { ...l, date: editDate, content: editContent } : l)) }));
