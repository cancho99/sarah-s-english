function VocabResultRow({ r, updateData }) {
  const [open, setOpen] = useState(false);
  const pct = Math.round((r.score / r.total) * 100);
  const ok = pct >= 90;
  const hasBreakdown = Array.isArray(r.breakdown) && r.breakdown.length > 0;

  async function markCorrect(idx) {
    await updateData((d) => ({
      ...d,
      vocabResults: d.vocabResults.map((x) => {
        if (x.id !== r.id) return x;
        const breakdown = x.breakdown.map((row, i) => (i === idx ? { ...row, ok: true, manualOverride: true } : row));
        const score = breakdown.filter((row) => row.ok).length;
        return { ...x, breakdown, score };
      }),
    }));
  }

  return html`
    <div style=${{ marginBottom: 6, paddingBottom: 6, borderBottom: `1px solid ${C.line}` }}>
      <div style=${{ fontSize: 12.5, display: "flex", alignItems: "center", gap: 8, cursor: hasBreakdown ? "pointer" : "default" }} onClick=${() => hasBreakdown && setOpen((o) => !o)}>
        <span>${fmtDate(r.date)} 응시 — <b>${r.score}</b> / ${r.total} (${pct}%)</span>
        <span style=${{ fontSize: 10.5, fontWeight: 700, padding: "1px 7px", borderRadius: 20, background: ok ? "#E9F1EA" : "#F7E9E6", color: ok ? "#3D6B4F" : C.danger }}>${ok ? "합격" : "재시험 필요"}</span>
        ${hasBreakdown && html`<span style=${{ fontSize: 11, color: C.slate, marginLeft: "auto" }}>${open ? "▲ 답안 닫기" : "▼ 답안 보기"}</span>`}
      </div>
      ${open && hasBreakdown && html`
        <div style=${{ marginTop: 8, background: C.ivory, border: `1px solid ${C.line}`, borderRadius: 4, padding: 10 }}>
          ${r.breakdown.map((row, i) => html`
            <div key=${i} style=${{ padding: "6px 0", borderBottom: i < r.breakdown.length - 1 ? `1px dotted ${C.line}` : "none" }}>
              <div style=${{ fontSize: 12, fontWeight: 700, color: C.navy, whiteSpace: "pre-wrap" }}>${i + 1}. ${row.prompt}</div>
              <div style=${{ fontSize: 12, marginTop: 2, color: row.ok ? C.navy : C.danger }}>학생 답: ${row.given} ${row.ok ? "✓" : "✗"}${row.manualOverride ? " (선생님 확인 정답 처리)" : ""}</div>
              ${!row.ok && html`
                <div style=${{ display: "flex", alignItems: "center", gap: 8, marginTop: 3 }}>
                  <div style=${{ fontSize: 11.5, color: C.slate }}>정답: ${row.correct}</div>
                  <button onClick=${() => markCorrect(i)} style=${{ fontSize: 11, padding: "3px 9px", borderRadius: 20, border: `1px solid ${C.gold}`, background: "none", color: C.gold, cursor: "pointer" }}>맞는 걸로 처리</button>
                </div>
              `}
            </div>
          `)}
        </div>
      `}
    </div>
  `;
}

function VocabEditor({ data, updateData }) {
  const [creating, setCreating] = useState(false); const [title, setTitle] = useState("");
  const [mode, setMode] = useState("mix");
  const [words, setWords] = useState([{ word: "", meaning: "" }]);
  const [showPaste, setShowPaste] = useState(false); const [pasteText, setPasteText] = useState(""); const [pasteMsg, setPasteMsg] = useState("");
  const [showBank, setShowBank] = useState(false); const [bankBooks, setBankBooks] = useState(null);
  const [bankBookId, setBankBookId] = useState(""); const [bankFrom, setBankFrom] = useState(1); const [bankTo, setBankTo] = useState(1);
  const [bankCount, setBankCount] = useState("");
  const [bankMsg, setBankMsg] = useState("");

  function runParse() {
    const parsed = parseVocabPaste(pasteText);
    if (parsed.length === 0) { setPasteMsg("인식된 단어가 없어요. 형식을 확인해 주세요."); return; }
    setWords(parsed); setPasteMsg(`${parsed.length}개 단어를 불러왔어요. 아래에서 확인 후 저장하세요.`); setShowPaste(false); setPasteText("");
  }
  async function openBank() {
    setShowBank(true);
    if (bankBooks === null) {
      try {
        const ref = window.__doc(window.__db, "sarahsEnglishWordbank", "main");
        const snap = await window.__getDoc(ref);
        const rec = snap.exists() ? snap.data() : {};
        const books = Array.isArray(rec.books) ? rec.books : [];
        setBankBooks(books);
        if (books[0]) { setBankBookId(books[0].id); setBankTo(books[0].totalDays || 1); }
        if (books.length === 0) setBankMsg("워드뱅크에 등록된 교재가 없어요. 먼저 '단어 시험지 생성' 메뉴에서 교재와 단어를 등록해 주세요.");
      } catch (e) { setBankBooks([]); setBankMsg("워드뱅크를 불러오지 못했어요."); }
    }
  }
  function importFromBank() {
    const book = (bankBooks || []).find((b) => b.id === bankBookId);
    if (!book) return;
    const from = Math.max(1, Number(bankFrom) || 1);
    const to = Math.max(from, Math.min(book.totalDays || from, Number(bankTo) || from));
    let picked = [];
    for (let d = from; d <= to; d++) {
      const arr = (book.days || {})["day" + d] || [];
      picked = picked.concat(arr.map((w) => ({ word: w.en, meaning: w.ko })));
    }
    if (picked.length === 0) { setBankMsg("해당 범위에 저장된 단어가 없어요."); return; }
    const n = Number(bankCount);
    if (n > 0 && n < picked.length) picked = shuffle(picked).slice(0, n);
    setWords(picked);
    setTitle((t) => t || `${book.name} Day ${from}-${to}`);
    setBankMsg(`${picked.length}개 단어를 불러왔어요. 아래에서 확인 후 저장하세요.`);
    setShowBank(false);
  }
  function setRow(i, key, val) { setWords((w) => w.map((row, idx) => (idx === i ? { ...row, [key]: val } : row))); }
  function addRow() { setWords((w) => [...w, { word: "", meaning: "" }]); }
  function removeRow(i) { setWords((w) => w.filter((_, idx) => idx !== i)); }
  async function save() {
    const clean = words.filter((w) => w.word && w.meaning).map((w) => ({
      word: w.word, meaning: w.meaning,
      synonyms: (w.synonyms || "").split(",").map((s) => s.trim()).filter(Boolean),
    }));
    if (!title || clean.length < 2) return;
    await updateData((d) => ({ ...d, vocabTests: [{ id: uid(), title, date: today(), words: clean, mode }, ...d.vocabTests] }));
    setTitle(""); setWords([{ word: "", meaning: "" }]); setMode("mix"); setCreating(false);
  }
  async function removeTest(id) { await updateData((d) => ({ ...d, vocabTests: d.vocabTests.filter((t) => t.id !== id) })); }

  return html`
    <div>
      ${!creating ? html`
        <${Button} variant="ghost" onClick=${() => setCreating(true)} style=${{ width: "100%", justifyContent: "center", marginBottom: 12 }}>+ 새 단어 재시험 만들기<//>
      ` : html`
        <${Card}>
          <${Field} label="재시험 이름"><input style=${inputStyle} value=${title} onChange=${(e) => setTitle(e.target.value)} placeholder="예: Unit 5 단어 재시험" /><//>
          <${Field} label="출제 방식">
            <div style=${{ display: "flex", gap: 8 }}>
              ${[["mix", "혼합 (영↔한 랜덤)"], ["w2m", "영단어 → 뜻만"], ["m2w", "뜻 → 영단어만"]].map(([val, label]) => html`
                <div key=${val} onClick=${() => setMode(val)} style=${{
                  flex: 1, textAlign: "center", padding: "9px 4px", borderRadius: 3, cursor: "pointer", fontSize: 12.5,
                  border: `1px solid ${mode === val ? C.gold : C.line}`, background: mode === val ? "#FBF6EA" : C.white,
                  fontWeight: mode === val ? 700 : 400, color: mode === val ? C.navy : C.slate,
                }}>${label}</div>
              `)}
            </div>
          <//>
          <div style=${{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <${Button} variant="ghost" onClick=${() => setShowPaste(true)} style=${{ marginBottom: 12 }}>붙여넣기로 한번에 가져오기<//>
            <${Button} variant="ghost" onClick=${openBank} style=${{ marginBottom: 12 }}>📚 워드뱅크에서 가져오기<//>
          </div>
          ${showPaste && html`
            <${Card} style=${{ background: C.ivory }}>
              <div style=${{ fontSize: 12, color: C.slate, marginBottom: 6 }}>한 줄에 단어 하나씩, "단어 - 뜻" 형식으로 붙여넣어 주세요. 뜻이 여러 개면 콤마(,)나 세미콜론(;)으로 이어서 써도 돼요.</div>
              <textarea style=${{ ...inputStyle, minHeight: 110, fontFamily: "monospace", fontSize: 12.5 }} placeholder=${"apple - 사과\nhesitate - 주저하다, 망설이다"} value=${pasteText} onChange=${(e) => setPasteText(e.target.value)} />
              <div style=${{ display: "flex", gap: 8, marginTop: 8 }}>
                <${Button} variant="gold" onClick=${runParse}>가져오기<//>
                <${Button} variant="ghost" onClick=${() => setShowPaste(false)}>취소<//>
              </div>
            <//>
          `}
          ${showBank && html`
            <${Card} style=${{ background: C.ivory }}>
              ${bankBooks === null ? html`<div style=${{ fontSize: 12.5, color: C.slate }}>불러오는 중...</div>` : bankBooks.length === 0 ? html`<div style=${{ fontSize: 12.5, color: C.slate }}>${bankMsg}</div>` : html`
                <${Field} label="교재">
                  <select style=${inputStyle} value=${bankBookId} onChange=${(e) => { setBankBookId(e.target.value); const b = bankBooks.find((x) => x.id === e.target.value); setBankFrom(1); setBankTo(b ? b.totalDays : 1); }}>
                    ${bankBooks.map((b) => html`<option key=${b.id} value=${b.id}>${b.name}</option>`)}
                  </select>
                <//>
                <div style=${{ display: "flex", gap: 8 }}>
                  <div style=${{ flex: 1 }}><${Field} label="시작 Day"><input style=${inputStyle} type="number" min="1" value=${bankFrom} onChange=${(e) => setBankFrom(e.target.value)} /><//></div>
                  <div style=${{ flex: 1 }}><${Field} label="끝 Day"><input style=${inputStyle} type="number" min="1" value=${bankTo} onChange=${(e) => setBankTo(e.target.value)} /><//></div>
                </div>
                <${Field} label="출제 문항 수 (비워두면 범위의 전체 단어)"><input style=${inputStyle} type="number" min="1" value=${bankCount} onChange=${(e) => setBankCount(e.target.value)} placeholder="예: 20" /><//>
                <div style=${{ display: "flex", gap: 8, marginTop: 4 }}>
                  <${Button} variant="gold" onClick=${importFromBank}>이 범위로 가져오기<//>
                  <${Button} variant="ghost" onClick=${() => setShowBank(false)}>취소<//>
                </div>
              `}
            <//>
          `}

function ExamEditor({ data, updateData }) {
  const [creating, setCreating] = useState(false); const [title, setTitle] = useState("");
  const [questions, setQuestions] = useState([{ q: "", choices: ["", ""], answer: 0 }]);
  const [showPaste, setShowPaste] = useState(false); const [pasteText, setPasteText] = useState(""); const [pasteMsg, setPasteMsg] = useState("");

  function runParse() {
    const parsed = parseExamPaste(pasteText);
    if (parsed.length === 0) { setPasteMsg("인식된 문제가 없어요. 형식을 확인해 주세요."); return; }
    setQuestions(parsed); setPasteMsg(`${parsed.length}개 문제를 불러왔어요. 아래에서 확인 후 저장하세요.`); setShowPaste(false); setPasteText("");
  }
  function setQ(i, val) { setQuestions((qs) => qs.map((row, idx) => (idx === i ? { ...row, q: val } : row))); }
  function setChoice(qi, ci, val) { setQuestions((qs) => qs.map((row, idx) => (idx === qi ? { ...row, choices: row.choices.map((c, cidx) => (cidx === ci ? val : c)) } : row))); }
  function setAnswer(qi, ci) { setQuestions((qs) => qs.map((row, idx) => (idx === qi ? { ...row, answer: ci } : row))); }
  function addChoice(qi) { setQuestions((qs) => qs.map((row, idx) => (idx === qi ? { ...row, choices: [...row.choices, ""] } : row))); }
  function removeChoice(qi, ci) { setQuestions((qs) => qs.map((row, idx) => (idx === qi ? { ...row, choices: row.choices.filter((_, cidx) => cidx !== ci), answer: row.answer === ci ? 0 : row.answer > ci ? row.answer - 1 : row.answer } : row))); }
  function addQuestion() { setQuestions((qs) => [...qs, { q: "", choices: ["", ""], answer: 0 }]); }
  function removeQuestion(i) { setQuestions((qs) => qs.filter((_, idx) => idx !== i)); }
  async function save() {
    const clean = questions.filter((q) => q.q && q.choices.every((c) => c) && q.choices.length >= 2);
    if (!title || clean.length === 0) return;
    await updateData((d) => ({ ...d, examTests: [{ id: uid(), title, date: today(), questions: clean }, ...d.examTests] }));
    setTitle(""); setQuestions([{ q: "", choices: ["", ""], answer: 0 }]); setCreating(false);
  }
  async function removeTest(id) { await updateData((d) => ({ ...d, examTests: d.examTests.filter((t) => t.id !== id) })); }

  return html`
    <div>
      ${!creating ? html`
        <${Button} variant="ghost" onClick=${() => setCreating(true)} style=${{ width: "100%", justifyContent: "center", marginBottom: 12 }}>+ 새 추가 시험 만들기<//>
      ` : html`
        <${Card}>
          <${Field} label="시험 이름"><input style=${inputStyle} value=${title} onChange=${(e) => setTitle(e.target.value)} placeholder="예: 관계대명사 추가 문제" /><//>
          ${!showPaste ? html`
            <${Button} variant="ghost" onClick=${() => setShowPaste(true)} style=${{ marginBottom: 12 }}>붙여넣기로 한번에 가져오기<//>
          ` : html`
            <${Card} style=${{ background: C.ivory }}>
              <div style=${{ fontSize: 12, color: C.slate, marginBottom: 6 }}>문제 사이는 빈 줄로 구분해 주세요.</div>
              <textarea style=${{ ...inputStyle, minHeight: 160, fontFamily: "monospace", fontSize: 12, whiteSpace: "pre" }}
                placeholder=${"1. 다음 중 관계대명사가 알맞은 것은?\n1) who\n2) which\n3) that\n4) whose\n정답: 1"}
                value=${pasteText} onChange=${(e) => setPasteText(e.target.value)} />
              <div style=${{ display: "flex", gap: 8, marginTop: 8 }}>
                <${Button} variant="gold" onClick=${runParse}>가져오기<//>
                <${Button} variant="ghost" onClick=${() => setShowPaste(false)}>취소<//>
              </div>
            <//>
          `}
          ${pasteMsg && html`<div style=${{ fontSize: 12, color: C.navy, marginBottom: 10 }}>${pasteMsg}</div>`}
          ${questions.map((q, qi) => html`
            <div key=${qi} style=${{ border: `1px solid ${C.line}`, borderRadius: 4, padding: 10, marginBottom: 10 }}>
              <div style=${{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                <div style=${{ fontSize: 12, color: C.gold, fontWeight: 700 }}>문제 ${qi + 1}</div>
                ${questions.length > 1 && html`<button onClick=${() => removeQuestion(qi)} style=${{ background: "none", border: "none", color: C.slate, cursor: "pointer" }}>✕</button>`}
              </div>
              <textarea style=${{ ...inputStyle, minHeight: 50, marginBottom: 8 }} placeholder="문제 내용" value=${q.q} onChange=${(e) => setQ(qi, e.target.value)} />
              ${q.choices.map((c, ci) => html`
                <div key=${ci} style=${{ display: "flex", gap: 6, alignItems: "center", marginBottom: 5 }}>
                  <input type="radio" checked=${q.answer === ci} onChange=${() => setAnswer(qi, ci)} />
                  <input style=${{ ...inputStyle, flex: 1 }} placeholder=${`보기 ${ci + 1}`} value=${c} onChange=${(e) => setChoice(qi, ci, e.target.value)} />
                  ${q.choices.length > 2 && html`<button onClick=${() => removeChoice(qi, ci)} style=${{ background: "none", border: "none", color: C.slate, cursor: "pointer" }}>✕</button>`}
                </div>
              `)}
              <button onClick=${() => addChoice(qi)} style=${{ background: "none", border: "none", color: C.navy, fontSize: 12, cursor: "pointer", padding: 0, marginTop: 4 }}>+ 보기 추가</button>
              <div style=${{ fontSize: 11, color: C.slate, marginTop: 4 }}>라디오 버튼으로 정답을 표시하세요.</div>
            </div>
          `)}
          <${Button} variant="ghost" onClick=${addQuestion} style=${{ marginBottom: 12 }}>+ 문제 추가<//>
          <div style=${{ display: "flex", gap: 8 }}>
            <${Button} variant="gold" onClick=${save}>저장<//>
            <${Button} variant="ghost" onClick=${() => setCreating(false)}>취소<//>
          </div>
        <//>
      `}
      <${SectionLabel} n=${2} label="등록된 시험" />
      ${data.examTests.length === 0 && html`<${Empty} text="아직 만든 시험이 없어요." />`}
      ${data.examTests.map((t) => {
        const results = data.examResults.filter((r) => r.testId === t.id);
        return html`
          <${Card} key=${t.id}>
            <div style=${{ display: "flex", justifyContent: "space-between" }}>
              <div>
                <div style=${{ fontWeight: 700, color: C.navy }}>${t.title}</div>
                <div style=${{ fontSize: 11.5, color: C.slate, marginTop: 2 }}>${fmtDate(t.date)} · 문제 ${t.questions.length}개</div>
              </div>
              <button onClick=${() => removeTest(t.id)} style=${{ background: "none", border: "none", color: C.slate, cursor: "pointer" }}>✕</button>
            </div>
            ${results.length === 0 ? html`<div style=${{ fontSize: 12, color: C.slate, marginTop: 8 }}>아직 응시하지 않았어요.</div>` : html`
              <div style=${{ marginTop: 8, borderTop: `1px solid ${C.line}`, paddingTop: 8 }}>
                ${results.map((r) => html`<div key=${r.id} style=${{ fontSize: 12.5, marginBottom: 3 }}>${fmtDate(r.date)} 응시 — <b>${r.score}</b> / ${r.total}</div>`)}

      })}
    </div>
  `;
}

function MockExamTaker({ test, onExit, onSubmit }) {
  const total = test.answerKey.length;
  const [answers, setAnswers] = useState(Array(total).fill(""));
  const [submitted, setSubmitted] = useState(false);
  const [result, setResult] = useState(null);
  const [wrong, setWrong] = useState([]);

  function pick(i, val) { if (submitted) return; setAnswers((a) => a.map((v, idx) => (idx === i ? val : v))); }

  function submit() {
    let score = 0; const wrongNums = [];
    test.answerKey.forEach((correct, i) => {
      if (normText(answers[i]) === normText(correct) && normText(answers[i]).length > 0) score++;
      else wrongNums.push(i + 1);
    });
    setResult(score); setWrong(wrongNums); setSubmitted(true);
  }

  if (submitted) {
    return html`
      <div>
        <${Card} style=${{ textAlign: "center", padding: 28 }}>
          <div style=${{ ...serif, fontSize: 20, color: C.navy, marginBottom: 8 }}>${test.title}</div>
          <div style=${{ fontSize: 12, color: C.slate, marginBottom: 16 }}>채점 결과</div>
          <div style=${{ fontSize: 34, ...serif, color: C.gold }}>${result} <span style=${{ fontSize: 18, color: C.slate }}>/ ${total}</span></div>
          ${wrong.length > 0 && html`<div style=${{ fontSize: 13, color: C.danger, marginTop: 10 }}>틀린 문제: ${wrong.join(", ")}번</div>`}
        <//>
        <${Button} variant="gold" style=${{ width: "100%", justifyContent: "center" }} onClick=${() => onSubmit(result, total, wrong)}>결과 저장하고 나가기<//>
      </div>
    `;
  }

  return html`
    <div>
      <${BackBtn} onClick=${onExit} />
      <div style=${{ ...serif, fontSize: 18, color: C.navy, marginBottom: 2 }}>${test.title}</div>
      ${test.pageRange && html`<div style=${{ fontSize: 12.5, color: C.slate, marginBottom: 12 }}>${test.pageRange}</div>`}
      <${Card}>
        <div style=${{ display: "flex", flexWrap: "wrap", gap: 10 }}>
          ${test.answerKey.map((_, i) => html`
            <div key=${i} style=${{ width: 62 }}>
              <div style=${{ fontSize: 11, color: C.gold, fontWeight: 700, marginBottom: 3, textAlign: "center" }}>${i + 1}</div>
              <input style=${{ ...inputStyle, padding: "8px 6px", textAlign: "center" }} inputMode="numeric" pattern="[0-9]*" value=${answers[i]} onChange=${(e) => pick(i, e.target.value.replace(/[^0-9]/g, ""))} />
            </div>
          `)}
        </div>
      <//>
      <${Button} variant="gold" style=${{ width: "100%", justifyContent: "center" }} disabled=${answers.some((a) => !a.trim())} onClick=${submit}>제출하기<//>
    </div>
  `;
}

  async function save() {
    await updateData(studentId, (d) => ({
      ...d,
      studyLog: (d.studyLog || []).map((s) => (s.id === entry.id ? { ...s, subject, minutes: Number(minutes) || 0, content } : s)),
    }));
    setEditing(false);
  }
  async function remove() {
    if (!confirm("이 기록을 삭제할까요?")) return;
    await updateData(studentId, (d) => ({ ...d, studyLog: (d.studyLog || []).filter((s) => s.id !== entry.id) }));
  }

  if (!editing) {
    return html`
      <${Card} style=${{ marginBottom: 6, padding: 12 }}>
        <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 12 }}>
          <b style=${{ color: C.navy }}>${entry.subject || "공부"}</b>
          <div style=${{ display: "flex", alignItems: "center", gap: 10 }}>
            <span style=${{ color: C.gold }}>${entry.minutes}분</span>
            <button onClick=${() => setEditing(true)} style=${{ background: "none", border: "none", color: C.slate, fontSize: 11, cursor: "pointer", padding: 0 }}>수정</button>
            <button onClick=${remove} style=${{ background: "none", border: "none", color: C.danger, fontSize: 11, cursor: "pointer", padding: 0 }}>삭제</button>
          </div>
        </div>
        ${entry.content && html`<div style=${{ fontSize: 12, color: C.slate, marginTop: 3, whiteSpace: "pre-wrap" }}>${entry.content}</div>`}
      <//>
    `;
  }
  return html`
    <${Card} style=${{ marginBottom: 6, padding: 12 }}>
      <div style=${{ display: "flex", gap: 6, marginBottom: 6 }}>
        <input style=${{ ...inputStyle, marginBottom: 0, flex: 1, fontSize: 12.5 }} value=${subject} onChange=${(e) => setSubject(e.target.value)} placeholder="과목" />
        <input style=${{ ...inputStyle, marginBottom: 0, width: 70, fontSize: 12.5 }} type="number" value=${minutes} onChange=${(e) => setMinutes(e.target.value)} />
      </div>
      <textarea style=${{ ...inputStyle, marginBottom: 6, minHeight: 50, fontSize: 12.5 }} value=${content} onChange=${(e) => setContent(e.target.value)} placeholder="공부한 내용" />
      <div style=${{ display: "flex", gap: 6 }}>
        <${Button} variant="gold" style=${{ padding: "5px 14px", fontSize: 11.5 }} onClick=${save}>저장<//>
        <${Button} variant="ghost" style=${{ padding: "5px 14px", fontSize: 11.5 }} onClick=${() => setEditing(false)}>취소<//>
      </div>
    <//>
  `;
}

function StudentDash({ student, ensureData, updateData, dataCache, onLogout }) {
  const [tab, setTab] = useState("logs");
  const [data, setData] = useState(null);
  const [activeTest, setActiveTest] = useState(null);
  const [activeMock, setActiveMock] = useState(null);
  const [timerRunning, setTimerRunning] = useState(false);
  const [timerStart, setTimerStart] = useState(null);
  const [elapsedSec, setElapsedSec] = useState(0);
  const [studySubject, setStudySubject] = useState("");
  const [studyContent, setStudyContent] = useState("");
  const [resumedFromSession, setResumedFromSession] = useState(false);

  useEffect(() => { (async () => { const d = await ensureData(student.id); setData(d); })(); }, [student.id]);
  useEffect(() => { if (dataCache[student.id]) setData(dataCache[student.id]); }, [dataCache, student.id]);
  useEffect(() => {
    if (!timerRunning) return;
    const iv = setInterval(() => { setElapsedSec(Math.floor((Date.now() - timerStart) / 1000)); }, 1000);
    return () => clearInterval(iv);
  }, [timerRunning, timerStart]);
  // 페이지를 나갔다 와도(새로고침 포함) 진행 중이던/일시정지된 타이머가 그대로 이어지도록, 시작 시각과 실행 여부를 저장해두고 여기서 복원
  useEffect(() => {
    if (data && data.activeStudySession && !resumedFromSession) {
      const s = data.activeStudySession;
      setStudySubject(s.subject || "");
      setStudyContent(s.content || "");
      if (s.running) {
        setTimerStart(s.startedAt);
        setElapsedSec(Math.floor((Date.now() - s.startedAt) / 1000));
        setTimerRunning(true);
      } else {
        setElapsedSec(s.frozenElapsedSec || 0);
        setTimerRunning(false);
      }
      setResumedFromSession(true);
    }
  }, [data]);

  const tabs = [
    { key: "logs", label: "오늘의 학습", icon: "📘" },
    { key: "homework", label: "숙제", icon: "📝" },
    { key: "vocab", label: "단어 재시험", icon: "🔤" },
    { key: "exam", label: "추가 시험", icon: "🗒" },
    { key: "mock", label: "모의고사", icon: "📄" },
  ];

  if (!data) return html`<${Empty} text="불러오는 중..." />`;

  if (activeMock) {
    return html`<${MockExamTaker} test=${activeMock} onExit=${() => setActiveMock(null)}
      onSubmit=${async (score, total, wrong) => {
        const save = () => updateData(student.id, (d) => ({ ...d, mockExamResults: [{ id: uid(), testId: activeMock.id, date: today(), score, total, wrong }, ...(d.mockExamResults || [])] }));
        try {
          await save();
        } catch (e) {
          console.error("결과 저장 실패", e);
          let recovered = false;
          if (isDocSizeError(e)) recovered = await attemptAutoShrinkAndRetry(student.id, updateData, save);
          if (!recovered) alert(friendlyErrorMessage(e));
        }
        setActiveMock(null);
      }} />`;
  }

  if (activeTest) {
    return html`<${TestTaker} activeTest=${activeTest} onExit=${() => setActiveTest(null)}
      onSubmit=${async (score, total, breakdown) => {
        const save = () => activeTest.type === "vocab"
          ? updateData(student.id, (d) => ({ ...d, vocabResults: [{ id: uid(), testId: activeTest.test.id, date: today(), score, total, breakdown }, ...d.vocabResults] }))
          : updateData(student.id, (d) => ({ ...d, examResults: [{ id: uid(), testId: activeTest.test.id, date: today(), score, total, breakdown }, ...d.examResults] }));
        try {
          await save();
        } catch (e) {
          console.error("결과 저장 실패", e);
          let recovered = false;
          if (isDocSizeError(e)) recovered = await attemptAutoShrinkAndRetry(student.id, updateData, save);
          if (!recovered) alert(friendlyErrorMessage(e));
        }
        setActiveTest(null);
      }} />`;
  }

  const DAY_NAMES = ["일", "월", "화", "수", "목", "금", "토"];
  const todayStr = today();
  const todayHw = (data.homework || []).filter((h) => !h.done && h.dueDate <= todayStr);
  let nextClassText = "등록된 수업 스케줄이 없어요.";
  if (student.schedule && student.schedule.length > 0) {
    const now = new Date();
    const nowDay = now.getDay();
    const nowHM = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
    let best = null, bestOffset = 8;
    student.schedule.forEach((s) => {
      const idx = DAY_NAMES.indexOf(s.day);
      let offset = (idx - nowDay + 7) % 7;
      if (offset === 0 && s.time < nowHM) offset = 7;
      if (offset < bestOffset) { bestOffset = offset; best = s; }
    });
    if (best) nextClassText = (bestOffset === 0 ? "오늘" : bestOffset === 1 ? "내일" : best.day + "요일") + " " + best.time;
  }
  const studyLog = data.studyLog || [];
  const todayEntries = studyLog.filter((s) => s.date === todayStr);
  const todayTotalMin = todayEntries.reduce((sum, s) => sum + (s.minutes || 0), 0);

  async function startTimer() {
    const start = Date.now() - elapsedSec * 1000;
    setTimerStart(start); setTimerRunning(true);
    await updateData(student.id, (d) => ({ ...d, activeStudySession: { startedAt: start, running: true, frozenElapsedSec: elapsedSec, subject: studySubject, content: studyContent } }));
  }
  async function pauseTimer() {
    setTimerRunning(false);
    await updateData(student.id, (d) => ({ ...d, activeStudySession: { startedAt: timerStart, running: false, frozenElapsedSec: elapsedSec, subject: studySubject, content: studyContent } }));
  }
  async function saveTimerEntry() {
    const m = Math.round(elapsedSec / 60);
    if (m <= 0) return;
    await updateData(student.id, (d) => ({
      ...d,
      studyLog: [{ id: uid(), date: todayStr, minutes: m, subject: studySubject, content: studyContent }, ...(d.studyLog || [])],
      activeStudySession: null,
    }));
    setTimerRunning(false); setElapsedSec(0); setStudySubject(""); setStudyContent(""); setResumedFromSession(false);
  }
  function fmtElapsed(sec) {
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    return (h > 0 ? String(h).padStart(2, "0") + ":" : "") + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
  }

  return html`
    <div>
      <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
        <div style=${{ ...serif, fontSize: 19, color: C.navy }}>${student.name} 학생</div>
        <button onClick=${onLogout} style=${{ background: "none", border: "none", color: C.slate, fontSize: 12.5, cursor: "pointer" }}>로그아웃</button>
      </div>

      <div style=${{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: 10, marginBottom: 16 }}>
        <${Card} style=${{ marginBottom: 0 }}>
          <div style=${{ fontSize: 11, color: C.gold, fontWeight: 700, marginBottom: 4 }}>📌 오늘 해야 할 일</div>
          ${todayHw.length === 0 ? html`<div style=${{ fontSize: 12.5, color: C.slate }}>오늘 할 일이 없어요!</div>` : todayHw.map((h) => html`<div key=${h.id} style=${{ fontSize: 12.5, padding: "3px 0" }}>${h.content}</div>`)}
        <//>
        <${Card} style=${{ marginBottom: 0 }}>
          <div style=${{ fontSize: 11, color: C.gold, fontWeight: 700, marginBottom: 4 }}>🗓 다음 수업</div>
          <div style=${{ fontSize: 12.5, color: C.ink }}>${nextClassText}</div>
        <//>
        <${Card} style=${{ marginBottom: 0 }}>
          <div style=${{ fontSize: 11, color: C.gold, fontWeight: 700, marginBottom: 4 }}>⏱ 공부 시간 기록</div>
          <div style=${{ ...serif, fontSize: 20, color: C.navy, textAlign: "center", margin: "4px 0" }}>${fmtElapsed(elapsedSec)}</div>
          <div style=${{ display: "flex", justifyContent: "center", gap: 6, marginBottom: 8 }}>
            ${!timerRunning
              ? html`<${Button} variant="gold" style=${{ padding: "7px 22px", fontSize: 12 }} onClick=${startTimer}>${elapsedSec > 0 ? "이어서 시작" : "시작"}<//>`
              : html`<${Button} variant="ghost" style=${{ padding: "7px 22px", fontSize: 12 }} onClick=${pauseTimer}>일시정지<//>`}
          </div>
          ${elapsedSec > 0 && html`
            <input style=${{ ...inputStyle, marginBottom: 6, fontSize: 12.5 }} placeholder="과목 (예: 문법, 독해)" value=${studySubject} onChange=${(e) => setStudySubject(e.target.value)} />
            <textarea style=${{ ...inputStyle, marginBottom: 6, minHeight: 50, fontSize: 12.5 }} placeholder="공부한 내용" value=${studyContent} onChange=${(e) => setStudyContent(e.target.value)} />
            <div style=${{ display: "flex", justifyContent: "center" }}><${Button} variant="gold" style=${{ padding: "7px 22px", fontSize: 12 }} onClick=${saveTimerEntry}>기록 저장<//></div>
          `}
          ${todayTotalMin > 0 && html`<div style=${{ fontSize: 11, color: C.slate, marginTop: 8 }}>오늘 총 ${todayTotalMin}분 기록됨 (${todayEntries.length}건)</div>`}
        <//>
        <${Card} style=${{ marginBottom: 0 }}>
          <div style=${{ fontSize: 11, color: C.gold, fontWeight: 700, marginBottom: 4 }}>✅ 이번 달 목표</div>
          ${(() => {
            const monthGoals = (data.monthlyGoals || []).filter((g) => g.month === todayStr.slice(0, 7));
            const remaining = monthGoals.filter((g) => !g.done);
            if (monthGoals.length === 0) return html`<div style=${{ fontSize: 12.5, color: C.slate }}>등록된 목표가 없어요.</div>`;
            if (remaining.length === 0) return html`<div style=${{ fontSize: 12.5, color: C.navy }}>이번 달 목표를 모두 달성했어요! 🎉</div>`;
            return remaining.map((g) => html`<div key=${g.id} style=${{ fontSize: 12.5, padding: "3px 0" }}>☐ ${g.text}</div>`);
          })()}
        <//>
      </div>

      ${todayEntries.length > 0 && html`
        <div style=${{ marginBottom: 16 }}>
          ${todayEntries.map((e) => html`<${StudyLogEntryCard} key=${e.id} entry=${e} studentId=${student.id} updateData=${updateData} />`)}
        </div>
      `}

      <${Tabs} tabs=${tabs} active=${tab} onChange=${setTab} />

      ${tab === "logs" && (data.logs.length === 0 ? html`<${Empty} text="아직 등록된 학습 기록이 없어요." />` : data.logs.map((l) => html`
        <${Card} key=${l.id}><div style=${{ fontSize: 11.5, color: C.gold, fontWeight: 700 }}>${fmtDate(l.date)}</div><div style=${{ fontSize: 13.5, marginTop: 6, whiteSpace: "pre-wrap" }}>${l.content}</div><//>
      `))}

      ${tab === "homework" && ((data.homework || []).length === 0 ? html`<${Empty} text="아직 등록된 숙제가 없어요." />` :
        groupByDate(data.homework || [], "dueDate").map((grp) => html`
          <div key=${grp.date}>
            <div style=${{ fontSize: 12.5, fontWeight: 700, color: C.navy, margin: "14px 0 6px", borderBottom: `1px solid ${C.line}`, paddingBottom: 4 }}>기한 ${fmtDateDay(grp.date)}</div>
            ${grp.items.map((h) => html`<${HomeworkStudentCard} key=${h.id} h=${h} studentId=${student.id} updateData=${updateData} />`)}
          </div>
        `))}

      ${tab === "vocab" && (data.vocabTests.length === 0 ? html`<${Empty} text="등록된 단어 재시험이 없어요." />` : data.vocabTests.map((t) => {
        const myResults = data.vocabResults.filter((r) => r.testId === t.id);
        const latest = myResults[0];
        const latestPct = latest ? Math.round((latest.score / latest.total) * 100) : null;
        const needsRetest = latest && latestPct < 90;
        return html`
          <${Card} key=${t.id} style=${needsRetest ? { borderLeft: `3px solid ${C.danger}` } : {}}>
            <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div>
                <div style=${{ fontWeight: 700, color: C.navy }}>${t.title}</div>
                <div style=${{ fontSize: 11.5, color: C.slate, marginTop: 2 }}>단어 ${t.words.length}개</div>
                ${latest && html`
                  <div style=${{ display: "flex", alignItems: "center", gap: 8, marginTop: 6 }}>
                    <span style=${{ fontSize: 12 }}>최근 결과: ${latest.score} / ${latest.total} (${latestPct}%)</span>
                    <span style=${{ fontSize: 11, fontWeight: 700, padding: "2px 8px", borderRadius: 20, background: needsRetest ? "#F7E9E6" : "#E9F1EA", color: needsRetest ? C.danger : "#3D6B4F" }}>${needsRetest ? "재시험 필요 (90% 미만)" : "합격"}</span>
                  </div>
                `}
              </div>
              <${Button} variant=${needsRetest ? "danger" : (myResults.length ? "ghost" : "gold")} onClick=${() => setActiveTest({ type: "vocab", test: t })}>${needsRetest ? "재응시하기" : (myResults.length ? "다시 풀기" : "응시하기")}<//>
            </div>
          <//>
        `;
      }))}

      ${tab === "exam" && (data.examTests.length === 0 ? html`<${Empty} text="등록된 추가 시험이 없어요." />` : data.examTests.map((t) => {
        const myResults = data.examResults.filter((r) => r.testId === t.id);
        return html`
          <${Card} key=${t.id}>
            <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div>
                <div style=${{ fontWeight: 700, color: C.navy }}>${t.title}</div>
                <div style=${{ fontSize: 11.5, color: C.slate, marginTop: 2 }}>문제 ${t.questions.length}개</div>
                ${myResults.length > 0 && html`<div style=${{ fontSize: 12, marginTop: 6 }}>✓ 최근 결과: ${myResults[0].score} / ${myResults[0].total}</div>`}
              </div>
              <${Button} variant=${myResults.length ? "ghost" : "gold"} onClick=${() => setActiveTest({ type: "exam", test: t })}>${myResults.length ? "다시 풀기" : "응시하기"}<//>
            </div>
          <//>
        `;
      }))}

      ${tab === "mock" && ((data.mockExams || []).length === 0 ? html`<${Empty} text="등록된 모의고사가 없어요." />` : groupByDate(data.mockExams || [], "date").map((grp) => html`
        <div key=${grp.date}>
          <div style=${{ fontSize: 12.5, fontWeight: 700, color: C.navy, margin: "14px 0 6px", borderBottom: `1px solid ${C.line}`, paddingBottom: 4 }}>${fmtDateDay(grp.date)}</div>
          ${grp.items.map((t) => {
        const myResults = (data.mockExamResults || []).filter((r) => r.testId === t.id);
        return html`
          <${Card} key=${t.id}>
            <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div>
                <div style=${{ fontWeight: 700, color: C.navy }}>${t.title}</div>
                <div style=${{ fontSize: 11.5, color: C.slate, marginTop: 2 }}>문항 ${t.answerKey.length}개${t.pageRange ? ` · ${t.pageRange}` : ""}</div>
                ${myResults.length > 0 && html`<div style=${{ fontSize: 12, marginTop: 6 }}>✓ 최근 결과: ${myResults[0].score} / ${myResults[0].total}</div>`}
              </div>
              <${Button} variant=${myResults.length ? "ghost" : "gold"} onClick=${() => setActiveMock(t)}>${myResults.length ? "다시 풀기" : "응시하기"}<//>
            </div>
          <//>
        `;
          })}
        </div>
      `))}
    </div>
  `;
}

function HomeworkStudentCard({ h, studentId, updateData }) {
  const [busy, setBusy] = useState(false); const [err, setErr] = useState("");
  const inputId = `hwphoto-${h.id}`;
  const photos = h.photos || (h.photo ? [h.photo] : []);

  async function handleFile(e) {
    const files = Array.from(e.target.files || []);
    e.target.value = "";
    if (files.length === 0) return;
    setErr(""); setBusy(true);
    try {
      const newOnes = [];
      let runningTotal = photos.reduce((sum, p) => sum + (p ? p.length : 0), 0);
      const BUDGET = 550000; // leaves headroom under Firestore's 1MB-per-document cap for this student's other data
      for (const file of files) {
        const dataUrl = await withTimeout(compressImage(file, 640, 0.5), 20000, "storage/timeout");
        if (dataUrl.length > 180000) { setErr("사진 한 장의 용량이 너무 커서 건너뛰었어요."); continue; }
        if (runningTotal + dataUrl.length > BUDGET) { setErr("사진을 더 담기엔 이 학생의 저장 공간이 부족해요. '저장 공간 관리'에서 정리한 뒤 다시 시도해 주세요."); break; }
        runningTotal += dataUrl.length;
        newOnes.push(dataUrl);
      }
      if (newOnes.length > 0) {
        const save = () => updateData(studentId, (d) => ({
          ...d,
          homework: (d.homework || []).map((x) => (x.id === h.id ? { ...withoutLegacyPhoto(x), photos: [...(x.photos || (x.photo ? [x.photo] : [])), ...newOnes], done: true } : x)),
        }));
        try {
          await save();
        } catch (saveErr) {
          let recovered = false;
          if (isDocSizeError(saveErr)) recovered = await attemptAutoShrinkAndRetry(studentId, updateData, save);
          if (!recovered) throw saveErr;
        }
      }
    } catch (e) { setErr(friendlyErrorMessage(e)); }
    setBusy(false);
  }
  async function removePhoto(idx) {
    await updateData(studentId, (d) => ({
      ...d,
      homework: (d.homework || []).map((x) => (x.id === h.id ? { ...withoutLegacyPhoto(x), photos: (x.photos || (x.photo ? [x.photo] : [])).filter((_, i) => i !== idx) } : x)),
    }));
  }
  async function toggleDone() { await updateData(studentId, (d) => ({ ...d, homework: (d.homework || []).map((x) => (x.id === h.id ? { ...x, done: !x.done } : x)) })); }

  return html`
    <${Card}>
      <div style=${{ fontSize: 11.5, color: C.gold, fontWeight: 700 }}>내준 날짜 ${fmtDate(h.assignedDate)}</div>
      <div style=${{ fontSize: 13.5, marginTop: 6, whiteSpace: "pre-wrap" }}>${h.content}</div>
      ${photos.length > 0 && html`
        <div style=${{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 8 }}>
          ${photos.map((p, pi) => html`
            <div key=${pi} style=${{ position: "relative" }}>
              <img src=${p} style=${{ width: 76, height: 76, objectFit: "cover", borderRadius: 4, border: `1px solid ${C.line}`, display: "block" }} />
              <button onClick=${() => removePhoto(pi)} style=${{ position: "absolute", top: -6, right: -6, width: 20, height: 20, borderRadius: "50%", border: "none", background: C.danger, color: "#fff", fontSize: 11, cursor: "pointer", lineHeight: "20px", padding: 0 }}>✕</button>
            </div>
          `)}
        </div>
      `}
      <div style=${{ display: "flex", alignItems: "center", gap: 12, marginTop: 10, flexWrap: "wrap" }}>
        <label htmlFor=${busy ? undefined : inputId} style=${{ fontSize: 12.5, fontWeight: 600, padding: "8px 14px", borderRadius: 3, border: `1px solid ${C.navy}`, color: busy ? C.slate : C.navy, cursor: busy ? "default" : "pointer", opacity: busy ? 0.6 : 1, pointerEvents: busy ? "none" : "auto" }}>
          ${busy ? "업로드 중..." : photos.length > 0 ? "인증샷 추가하기" : "인증샷 올리기"}
        </label>
        <input id=${inputId} type="file" accept="image/*" multiple onChange=${handleFile} style=${{ display: "none" }} disabled=${busy} />

        <div onClick=${toggleDone} style=${{ display: "inline-flex", alignItems: "center", gap: 6, cursor: "pointer", fontSize: 12.5, color: h.done ? C.gold : C.slate, fontWeight: 600 }}>
          ${h.done ? "✓ 완료함" : "완료로 표시하기"}
        </div>
      </div>
      ${err && html`<div style=${{ fontSize: 11.5, color: C.danger, marginTop: 6 }}>${err}</div>`}
    <//>
  `;
}

function withTimeout(promise, ms, code) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject({ code: code || "timeout", message: `timed out after ${ms}ms` }), ms)),
  ]);
}
function stripUndefinedDeep(value) {
  if (Array.isArray(value)) return value.map(stripUndefinedDeep);
  if (value && typeof value === "object") {
    const out = {};
    Object.keys(value).forEach((k) => {
      if (value[k] !== undefined) out[k] = stripUndefinedDeep(value[k]);
    });
    return out;
  }
  return value;
}
function withoutLegacyPhoto(obj) {
  const { photo, ...rest } = obj;
  return rest;
}
function isDocSizeError(e) {
  const msg = ((e && e.message) || "").toLowerCase();
  return msg.includes("1048487") || msg.includes("1048576") || msg.includes("maximum allowed size") || (msg.includes("longer than") && msg.includes("byte"));
}
function shrinkStudentData(d) {
  return {
    ...d,
    homework: (d.homework || []).map((h) => ({ ...withoutLegacyPhoto(h), photos: (h.photos || (h.photo ? [h.photo] : [])).filter((p) => p && p.length < 120000) })),
    vocabResults: (d.vocabResults || []).slice(0, 30),
    examResults: (d.examResults || []).slice(0, 30),
    mockExamResults: (d.mockExamResults || []).slice(0, 30),
    logs: (d.logs || []).slice(0, 60),
  };
}
async function attemptAutoShrinkAndRetry(studentId, updateData, retryFn) {
  if (!confirm("저장 공간이 가득 차서 실패했어요. 예전 방식 사진과 오래된 응시 기록을 정리하고 바로 다시 시도할까요? (최근 기록은 그대로 남아요)")) return false;
  try {
    await updateData(studentId, (d) => shrinkStudentData(d));
    await retryFn();
    return true;
  } catch (e2) {
    alert("정리는 됐지만 다시 저장하는 중 문제가 있었어요. 잠시 후 다시 시도해 주세요.");
    return false;
  }
}

function friendlyErrorMessage(e) {
  const raw = (e && e.code) || (e && e.message) || String(e);
  const base = friendlyErrorMessageBase(e);
  return `${base} (오류 세부정보: ${raw})`;
}
function friendlyErrorMessageBase(e) {
  const msg = ((e && e.message) || "").toLowerCase();
  const code = (e && e.code) || "";
  if (code === "storage/timeout") {
    return "사진을 처리하는 데 너무 오래 걸려서 중단했어요. 사진 용량이 너무 크거나 형식이 안 맞을 수 있어요. 다른 사진으로 다시 시도해 주세요.";
  }
  if (isDocSizeError(e)) {
    return "이 학생의 저장 공간이 가득 찼어요 (사진이 너무 많이 쌓였을 때 생겨요). 오래된 사진을 몇 장 지운 뒤 다시 시도해 주세요.";
  }
  if (code === "permission-denied") {
    return "저장 권한 문제가 있어요. Firebase 콘솔에서 Firestore 보안 규칙을 확인해 주세요.";
  }
  return "저장하는 데 문제가 있었어요. 인터넷 연결을 확인하고 다시 시도해 주세요.";
}

function checkWordAnswer(userAnswer, correctWord, synonyms) {
  const norm = normText(userAnswer);
  if (!norm) return false;
  if (norm === normText(correctWord)) return true;
  if ((synonyms || []).some((s) => normText(s) === norm)) return true;
  return isKnownSynonym(userAnswer, correctWord);
}

function TestTaker({ activeTest, onExit, onSubmit }) {
  const { type, test } = activeTest;
  const questions = type === "vocab" ? test.words : test.questions;
  const total = questions.length;
  const [directions] = useState(() => {
    if (type !== "vocab") return null;
    const vmode = test.mode || "mix";
    return questions.map(() => (vmode === "w2m" ? "w2m" : vmode === "m2w" ? "m2w" : (Math.random() < 0.5 ? "w2m" : "m2w")));
  });
  const [answers, setAnswers] = useState(type === "vocab" ? Array(total).fill("") : Array(total).fill(null));
  const [submitted, setSubmitted] = useState(false);
  const [result, setResult] = useState(null);
  const [breakdown, setBreakdown] = useState(null);

  function pick(qi, val) { if (submitted) return; setAnswers((a) => a.map((v, idx) => (idx === qi ? val : v))); }

  function submit() {
    let score = 0; const rows = [];
    questions.forEach((q, i) => {
      if (type === "vocab") {
        const dir = directions[i];
        if (dir === "w2m") {
          const ok = checkVocabAnswer(answers[i], q.meaning, q.synonyms);
          if (ok) score++;
          rows.push({ prompt: q.word || "(단어 없음)", given: answers[i] || "(빈칸)", correct: q.meaning || "(뜻 없음)", ok });
        } else {
          const ok = checkWordAnswer(answers[i], q.word, q.synonyms);
          if (ok) score++;
          const correctDisplay = (q.synonyms && q.synonyms.length) ? `${q.word || ""} (${q.synonyms.join(", ")}도 정답)` : (q.word || "(단어 없음)");
          rows.push({ prompt: q.meaning || "(뜻 없음)", given: answers[i] || "(빈칸)", correct: correctDisplay, ok });
        }
      } else {
        const ok = answers[i] === q.answer;
        if (ok) score++;
        const givenChoice = answers[i] != null ? q.choices[answers[i]] : null;
        rows.push({ prompt: q.q || "", given: givenChoice || "(선택 안 함)", correct: (q.choices && q.choices[q.answer]) || "", ok });
      }
    });
    setResult(score); setBreakdown(rows); setSubmitted(true);
  }

  if (submitted) {
    return html`
      <div>
        <${Card} style=${{ textAlign: "center", padding: 28 }}>
          <div style=${{ ...serif, fontSize: 20, color: C.navy, marginBottom: 8 }}>${test.title}</div>
          <div style=${{ fontSize: 12, color: C.slate, marginBottom: 16 }}>채점 결과</div>
          <div style=${{ fontSize: 34, ...serif, color: C.gold }}>${result} <span style=${{ fontSize: 18, color: C.slate }}>/ ${total}</span></div>
        <//>
        ${breakdown && html`
          <${Card}>
            ${breakdown.map((r, i) => html`
              <div key=${i} style=${{ padding: "8px 0", borderBottom: i < breakdown.length - 1 ? `1px solid ${C.line}` : "none" }}>
                <div style=${{ fontSize: 12.5, fontWeight: 700, color: C.navy, whiteSpace: "pre-wrap" }}>${i + 1}. ${r.prompt}</div>
                <div style=${{ fontSize: 12, marginTop: 3, color: r.ok ? C.navy : C.danger }}>내 답: ${r.given} ${r.ok ? "✓" : "✗"}</div>
                ${!r.ok && html`<div style=${{ fontSize: 12, color: C.slate, marginTop: 1 }}>정답: ${r.correct}</div>`}
              </div>
            `)}
          <//>
        `}
        <${Button} variant="gold" style=${{ width: "100%", justifyContent: "center" }} onClick=${() => onSubmit(result, total, breakdown)}>결과 저장하고 나가기<//>
      </div>
    `;
  }

  return html`
    <div>
      <${BackBtn} onClick=${onExit} />
      <div style=${{ ...serif, fontSize: 18, color: C.navy, marginBottom: 12 }}>${test.title}</div>
      ${questions.map((q, qi) => html`
        <${Card} key=${qi}>
          <div style=${{ fontSize: 13, fontWeight: 700, color: C.navy, marginBottom: 10, whiteSpace: "pre-wrap" }}>${qi + 1}. ${type === "vocab" ? (directions[qi] === "w2m" ? q.word : q.meaning) : q.q}</div>
          ${type === "vocab" ? html`
            <input style=${inputStyle} placeholder=${directions[qi] === "w2m" ? "뜻을 입력하세요" : "영어 단어를 입력하세요"} value=${answers[qi]} onChange=${(e) => pick(qi, e.target.value)} />
          ` : q.choices.map((opt, oi) => {
            const selected = answers[qi] === oi;
            return html`
              <div key=${oi} onClick=${() => pick(qi, oi)} style=${{ padding: "9px 12px", border: `1px solid ${selected ? C.gold : C.line}`, background: selected ? "#FBF4EA" : C.white, borderRadius: 3, marginBottom: 6, fontSize: 13, cursor: "pointer" }}>${opt}</div>
            `;
          })}
        <//>
      `)}
      <${Button} variant="gold" style=${{ width: "100%", justifyContent: "center" }} disabled=${answers.some((a) => a === null || a === "")} onClick=${submit}>제출하기<//>
    </div>
  `;
}

          ${(data.feedback || []).map((f) => html`
            <${Card} key=${f.id} style=${f.from === "parent" ? { borderLeft: `3px solid ${C.gold}` } : {}}>
              <div style=${{ fontSize: 11.5, color: C.gold, fontWeight: 700 }}>${fmtDate(f.date)} · ${f.from === "parent" ? "🙋 나의 코멘트" : "선생님"}</div>
              <div style=${{ fontSize: 13.5, marginTop: 6, whiteSpace: "pre-wrap" }}>${f.text}</div>
            <//>
          `)}
          <${Card}>
            <${Field} label="선생님께 전할 말씀"><textarea style=${{ ...inputStyle, minHeight: 70 }} value=${commentText} onChange=${(e) => setCommentText(e.target.value)} placeholder="궁금한 점이나 전하고 싶은 말씀을 남겨 주세요." /><//>
            <${Button} variant="gold" onClick=${sendComment}>보내기<//>
            ${commentSent && html`<div style=${{ fontSize: 12, color: C.navy, marginTop: 8 }}>${commentSent}</div>`}
          <//>
        </div>
      `}
      ${tab === "consult" && html`<${ConsultRequestPanel} student=${student} data=${data} updateData=${(updater) => updateData(student.id, updater)} />`}
    </div>
  `;
}

function ConsultRequestPanel({ data, updateData }) {
  const [method, setMethod] = useState("카톡 상담");
  const [d1, setD1] = useState(""); const [t1, setT1] = useState("");
  const [d2, setD2] = useState(""); const [t2, setT2] = useState("");
  const [d3, setD3] = useState(""); const [t3, setT3] = useState("");
  const [note, setNote] = useState("");
  const [sent, setSent] = useState(false);

  async function submit() {
    if (!d1 || !t1) return;
    const req = {
      id: uid(), createdAt: today(), method, note, status: "대기",
      choices: [{ date: d1, time: t1 }, ...(d2 ? [{ date: d2, time: t2 }] : []), ...(d3 ? [{ date: d3, time: t3 }] : [])],
    };
    await updateData((d) => ({ ...d, consultRequests: [req, ...(d.consultRequests || [])] }));
    setD1(""); setT1(""); setD2(""); setT2(""); setD3(""); setT3(""); setNote("");
    setSent(true);
    setTimeout(() => setSent(false), 3000);
  }

  const list = data.consultRequests || [];
  return html`
    <div>
      <${Card}>
        <div style=${{ fontSize: 12, color: C.slate, marginBottom: 10 }}>희망하시는 상담 방식과 날짜·시간대를 1지망부터 순서대로 입력해 주세요.</div>
        <${Field} label="상담 방식">
          <select style=${inputStyle} value=${method} onChange=${(e) => setMethod(e.target.value)}>
            <option value="카톡 상담">카톡 상담</option>
            <option value="전화 상담">전화 상담</option>
            <option value="대면 상담">대면 상담</option>
          </select>
        <//>
        <div style=${{ fontSize: 11.5, color: C.slate, fontWeight: 700, marginTop: 10, marginBottom: 4 }}>1지망 (필수)</div>
        <div style=${{ display: "flex", gap: 8 }}>
          <div style=${{ flex: 1 }}><${DateField} value=${d1} onChange=${setD1} disablePast=${true} /></div>
          <div style=${{ flex: 1 }}><input style=${inputStyle} value=${t1} onChange=${(e) => setT1(e.target.value)} placeholder="예: 오후 3시" /></div>
        </div>
        <div style=${{ fontSize: 11.5, color: C.slate, fontWeight: 700, marginTop: 10, marginBottom: 4 }}>2지망 (선택)</div>
        <div style=${{ display: "flex", gap: 8 }}>
          <div style=${{ flex: 1 }}><${DateField} value=${d2} onChange=${setD2} disablePast=${true} /></div>
          <div style=${{ flex: 1 }}><input style=${inputStyle} value=${t2} onChange=${(e) => setT2(e.target.value)} placeholder="예: 오후 3시" /></div>
        </div>
        <div style=${{ fontSize: 11.5, color: C.slate, fontWeight: 700, marginTop: 10, marginBottom: 4 }}>3지망 (선택)</div>
        <div style=${{ display: "flex", gap: 8 }}>
          <div style=${{ flex: 1 }}><${DateField} value=${d3} onChange=${setD3} disablePast=${true} /></div>
          <div style=${{ flex: 1 }}><input style=${inputStyle} value=${t3} onChange=${(e) => setT3(e.target.value)} placeholder="예: 오후 3시" /></div>
        </div>
        <${Field} label="전하고 싶은 내용 (선택)"><textarea style=${{ ...inputStyle, minHeight: 60, marginTop: 6 }} value=${note} onChange=${(e) => setNote(e.target.value)} /><//>
        <${Button} variant="gold" style=${{ marginTop: 10 }} disabled=${!d1 || !t1} onClick=${submit}>상담 신청하기<//>
        ${sent && html`<div style=${{ fontSize: 12, color: C.navy, marginTop: 8 }}>신청됐어요. 선생님이 확인 후 연락드릴 거예요.</div>`}
      <//>
      ${list.length > 0 && html`
        <div style=${{ fontSize: 11.5, color: C.slate, fontWeight: 700, margin: "16px 0 8px" }}>신청 내역</div>
        ${list.map((r) => html`
          <${Card} key=${r.id}>
            <div style=${{ fontSize: 12, color: C.gold, fontWeight: 700 }}>${r.method} · ${r.status}</div>
            ${r.choices.map((c, i) => html`<div key=${i} style=${{ fontSize: 12.5, marginTop: 4 }}>${i + 1}지망: ${c.date} ${c.time}</div>`)}
            ${r.note && html`<div style=${{ fontSize: 12, color: C.slate, marginTop: 4 }}>${r.note}</div>`}
          <//>
        `)}
      `}
    </div>
  `;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(html`<${App} />`);
}); // end DOMContentLoaded
</script>
</body>
</html>
