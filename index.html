// ---------- Firestore storage ----------
// roster/teacherAuth live in one small "meta" doc.
// Each student's own data (logs/homework/feedback/tests/etc, including photos & audio)
// lives in its own doc, so one student's data never affects another's, and we
// stay well clear of Firestore's 1MB-per-document limit as the roster grows.
const META_COLLECTION = "sarahsEnglishMeta";
const META_DOC_ID = "main";
const STUDENTS_COLLECTION = "sarahsEnglishStudents";

let store = null; // in-memory cache: { roster, teacherAuth, studentData }

async function loadStore(attempts = 3) {
  for (let i = 0; i < attempts; i++) {
    try {
      const ref = window.__doc(window.__db, META_COLLECTION, META_DOC_ID);
      const snap = await window.__getDoc(ref);
      const rec = snap.exists() ? snap.data() : {};
      store = {
        roster: Array.isArray(rec.roster) ? rec.roster : [],
        teacherAuth: rec.teacherAuth || null,
        levelTestBookings: Array.isArray(rec.levelTestBookings) ? rec.levelTestBookings : [],
        announcement: rec.announcement || null,
        examKeyLibrary: Array.isArray(rec.examKeyLibrary) ? rec.examKeyLibrary : [],
        studentData: {}, // fetched per-student on demand via ensureData()
      };
      return store;
    } catch (e) {
      console.error("loadStore error", e);
      if (i === attempts - 1) throw e;
      await new Promise((r) => setTimeout(r, 500 * (i + 1)));
    }
  }
}

async function saveMeta() {
  try {
    const ref = window.__doc(window.__db, META_COLLECTION, META_DOC_ID);
    // merge: true — this only touches the fields listed below. Without it, this being a plain
    // setDoc would replace the ENTIRE meta doc, silently wiping fields this function doesn't know
    // about (e.g. teacherFcmTokens, written separately by addTeacherFcmToken's own transaction)
    // any time a teacher saves the roster/announcement/bookings/exam key library.
    await window.__setDoc(ref, { roster: store.roster, teacherAuth: store.teacherAuth, levelTestBookings: store.levelTestBookings || [], announcement: store.announcement || null, examKeyLibrary: store.examKeyLibrary || [] }, { merge: true });
    return true;
  } catch (e) {
    console.error("saveMeta error", e);
    return false;
  }
}

async function loadStudentDoc(id) {
  try {
    const ref = window.__doc(window.__db, STUDENTS_COLLECTION, id);
    const snap = await window.__getDoc(ref);
    return snap.exists() ? snap.data() : null;
  } catch (e) {
    console.error("loadStudentDoc error", e);
    return null;
  }
}

async function saveStudentDoc(id, data) {
  try {
    const ref = window.__doc(window.__db, STUDENTS_COLLECTION, id);
    await window.__setDoc(ref, data);
    return true;
  } catch (e) {
    console.error("saveStudentDoc error", e);
    return false;
  }
}

// NELT 성적표 PDF 업로드 분석용 (지문 변형 도구와 동일한 서버, Firebase Cloud Functions)
const NELT_WORKER_URL = "https://us-central1-sarah-s-english.cloudfunctions.net/aiWorker";
const NOTIFY_URL = "https://us-central1-sarah-s-english.cloudfunctions.net/notifyTeacher";
const NOTIFY_STUDENT_URL = "https://us-central1-sarah-s-english.cloudfunctions.net/notifyStudent";
const TEST_NOTIFY_URL = "https://us-central1-sarah-s-english.cloudfunctions.net/sendTestNotification";
const FCM_VAPID_KEY = "BKXGKOsQBe0e0TLKdjkmtuDTR9iy9o7qSCZu1UmP8x7xvRuG7x1uRu1FgYCoF7YsGSwfIQ_dvutD39uV_nMhJG4";

async function enableNotifications() {
  if (!("Notification" in window) || !("serviceWorker" in navigator) || !window.__messaging) {
    throw new Error("이 브라우저에서는 알림을 지원하지 않아요.");
  }
  const permission = await Notification.requestPermission();
  if (permission !== "granted") throw new Error("알림 권한이 허용되지 않았어요.");
  // Relative path (not "/firebase-messaging-sw.js") — the site is hosted under a subpath
  // (github.io/sarah-s-english/), so an absolute root path would 404 there even though it
  // resolves fine when testing locally at localhost:8080/index.html.
  await navigator.serviceWorker.register("firebase-messaging-sw.js");
  // register() resolves as soon as the worker is found/installing, not once it's actually
  // active — calling getToken() (which subscribes to PushManager) before activation finishes
  // throws "no active Service Worker". .ready waits for an active worker controlling this scope.
  const registration = await navigator.serviceWorker.ready;
  const token = await window.__getFcmToken(window.__messaging, { vapidKey: FCM_VAPID_KEY, serviceWorkerRegistration: registration });
  if (!token) throw new Error("알림 토큰을 받지 못했어요.");
  return token;
}

// Foreground pushes don't trigger the service worker's background handler (that only fires when
// the tab isn't focused), so this shows the same notification when the tab IS focused — keeping
// behavior consistent regardless of whether the app happens to be in view. Routed through the
// service worker registration (registration.showNotification) rather than `new Notification()`
// directly — some browsers suppress or delay notifications constructed straight from a focused
// page more aggressively than ones issued via a service worker, so this is the more reliable path.
if (window.__onFcmMessage && window.__messaging) {
  window.__onFcmMessage(window.__messaging, async (payload) => {
    const { title, body } = payload.data || {};
    if (!title || Notification.permission !== "granted") return;
    if (navigator.serviceWorker) {
      const reg = await navigator.serviceWorker.getRegistration();
      if (reg) { reg.showNotification(title, { body: body || "" }); return; }
    }
    new Notification(title, { body: body || "" });
  });
}

async function notifyTeacher(studentName, kind, detail) {
  try {
    await fetch(NOTIFY_URL, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ studentName, kind, detail }),
    });
  } catch (e) {
    console.warn("notifyTeacher failed", e);
  }
}

// Fires when the teacher assigns something new (homework/mock exam/vocab test) to a student —
// unlike notifyTeacher, the recipient is a single, different student each time, so the token is
// passed straight from the roster entry the teacher already has loaded rather than looked up
// server-side. No-op if the student never enabled notifications (no token on file).
async function notifyStudent(token, kind, detail) {
  if (!token) return;
  try {
    await fetch(NOTIFY_STUDENT_URL, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ token, kind, detail }),
    });
  } catch (e) {
    console.warn("notifyStudent failed", e);
  }
}

// Sends a test push straight to the token just issued, so enabling notifications gives
// immediate feedback instead of only working the next time a real event happens to fire.
async function sendTestNotification(token) {
  const res = await fetch(TEST_NOTIFY_URL, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ token }),
  });
  if (!res.ok) throw new Error("테스트 알림을 보내지 못했어요.");
}

// Finds the true next class by merging two sources — the recurring weekly tutoring pattern
// (skipping any date the teacher marked as an exception, e.g. a cancelled holiday class) and
// one-off makeup classes from monthlyInstances, which can land sooner than the next weekly
// occurrence. Shared by StudentDash/ParentDash so both show the exact same "다음 수업" text.
function nextClassText(student, todayStr) {
  const DAY_NAMES = ["일", "월", "화", "수", "목", "금", "토"];
  const now = new Date();
  const nowHM = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
  const exceptions = student.tutoringExceptions || [];
  const candidates = [];
  (student.schedule || []).forEach((s) => {
    for (let offset = 0; offset <= 14; offset++) {
      const dt = new Date(now); dt.setDate(dt.getDate() + offset);
      const dateStr = `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
      if (DAY_NAMES[dt.getDay()] !== s.day) continue;
      if (exceptions.includes(dateStr)) continue;
      if (offset === 0 && s.time < nowHM) continue;
      candidates.push({ date: dateStr, time: s.time, kind: "tutoring" });
      break;
    }
  });
  Object.values(student.monthlyInstances || {}).forEach((list) => {
    (list || []).forEach((inst) => {
      if (inst.date > todayStr || (inst.date === todayStr && inst.time >= nowHM)) {
        candidates.push({ date: inst.date, time: inst.time, kind: inst.type === "tutoring" ? "tutoring" : "makeup" });
      }
    });
  });
  candidates.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  const best = candidates[0];
  if (!best) return "등록된 수업 스케줄이 없어요.";
  const dt = new Date(best.date + "T00:00:00");
  const diffDays = Math.round((dt - new Date(todayStr + "T00:00:00")) / 86400000);
  const label = diffDays === 0 ? "오늘" : diffDays === 1 ? "내일" : `${dt.getMonth() + 1}/${dt.getDate()} (${DAY_NAMES[dt.getDay()]})`;
  return `${label} ${best.time}${best.kind === "makeup" ? " (보강)" : ""}`;
}

// ---------- Answer-key PDF import (e.g. 마더텅/수능기출 정답표) ----------
// Some 정답표 sheets (esp. 유형별/단원별 문제집 books) cram an entire book's answers onto one
// page in tiny multi-column print. Sending the raw PDF lets Claude's own PDF-to-image step pick
// the resolution, which can downsample dense pages enough to cause misreads. Rendering each page
// ourselves at high DPI and slicing it into per-column tiles keeps every region well above the
// point where fine print becomes unreadable.
//
// Tiling on a blind fixed grid (with overlap to avoid cutting through a block) was tried first
// but proved unreliable: any row-wise split risked truncating a tall block at the tile boundary
// (a block bigger than one cell silently lost its trailing items), and tuning overlap % just
// traded one kind of miscount for another. Real print layouts, though, have genuine full-height
// blank gutters between columns — detecting those via pixel ink-density (same technique used
// earlier for the logo crop) and cutting only there means every tile contains only whole boxes,
// so there's nothing to truncate and nothing to de-duplicate.
async function findColumnGutters(canvas) {
  const ctx = canvas.getContext("2d");
  const { width, height } = canvas;
  const { data } = ctx.getImageData(0, 0, width, height);
  const colInk = new Uint32Array(width);
  for (let y = 0; y < height; y++) {
    const rowOff = y * width * 4;
    for (let x = 0; x < width; x++) {
      const i = rowOff + x * 4;
      const lum = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
      if (lum < 200) colInk[x]++;
    }
  }
  // A "blank" column allows a small amount of stray ink (anti-aliasing bleed from a neighboring
  // block's border/title that doesn't perfectly line up with the block below it), not literally
  // zero — 유형별/단원별 문제집 pages stack many blocks of slightly different widths in each
  // print-column, so demanding a pixel-perfect blank run across the FULL page height almost never
  // matched even though the column is clearly visually blank; findColumnGutters was silently
  // returning zero gutters on exactly this document type, so the AI had to guess the multi-column
  // reading order from one undivided image instead of getting pre-split, unambiguous column tiles.
  const blankThreshold = Math.max(2, height * 0.006);
  const isBlank = [];
  for (let x = 0; x < width; x++) isBlank.push(colInk[x] < blankThreshold);
  const runs = [];
  let start = null;
  for (let x = 0; x < width; x++) {
    if (isBlank[x] && start === null) start = x;
    else if (!isBlank[x] && start !== null) { runs.push([start, x]); start = null; }
  }
  if (start !== null) runs.push([start, width]);
  // internal gutters only — drop runs touching the page edges (those are just margins)
  return runs.filter(([s, e]) => e - s > 5 && s > 0 && e < width).map(([s, e]) => Math.round((s + e) / 2));
}

async function renderPdfPageTiles(file) {
  if (window.pdfjsLib && window.pdfjsLib.GlobalWorkerOptions && !window.pdfjsLib.GlobalWorkerOptions.workerSrc) {
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  }
  const buf = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
  // Two passes instead of one: rendering a dense multi-column page (thousands of small text runs)
  // straight at tileScale could take 1-2+ minutes per page or effectively hang the tab — far past
  // what the "몇십 초" progress message implied, and easy to mistake for the tool being broken.
  // detectScale is only used to locate column gutters cheaply; the actual images sent to the AI
  // are still rendered at full tileScale, just one narrow column at a time (translating the canvas
  // context so pdf.js only fills pixels inside that tile's bounds keeps each render fast even
  // though tileScale itself didn't change).
  const detectScale = 1.4;
  const tileScale = 3.2;
  const tiles = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);

    const detectViewport = page.getViewport({ scale: detectScale });
    const detectCanvas = document.createElement("canvas");
    detectCanvas.width = Math.ceil(detectViewport.width);
    detectCanvas.height = Math.ceil(detectViewport.height);
    await withTimeout(page.render({ canvasContext: detectCanvas.getContext("2d"), viewport: detectViewport }).promise, 60000, "pdf/render-detect");

    const guttersLow = await findColumnGutters(detectCanvas);
    const ratio = tileScale / detectScale;
    const fullWidthHigh = Math.ceil(detectCanvas.width * ratio);
    const fullHeightHigh = Math.ceil(detectCanvas.height * ratio);
    const boundsHigh = [0, ...guttersLow.map((g) => Math.round(g * ratio)), fullWidthHigh];

    const tileViewport = page.getViewport({ scale: tileScale });
    for (let i = 0; i < boundsHigh.length - 1; i++) {
      const x0 = boundsHigh[i], x1 = boundsHigh[i + 1];
      const w = x1 - x0, h = fullHeightHigh;
      const tileCanvas = document.createElement("canvas");
      tileCanvas.width = w; tileCanvas.height = h;
      const tctx = tileCanvas.getContext("2d");
      tctx.translate(-x0, 0);
      await withTimeout(page.render({ canvasContext: tctx, viewport: tileViewport }).promise, 60000, "pdf/render-tile");
      tiles.push(tileCanvas.toDataURL("image/png").split(",")[1]);
    }
  }
  return tiles;
}

function splitFirst(line, delim) {
  const idx = line.indexOf(delim);
  if (idx === -1) return null;
  return [line.slice(0, idx).trim(), line.slice(idx + delim.length).trim()];
}
function parseVocabPaste(text) {
  const lines = text.split("\n").map((l) => l.trim()).filter(Boolean);
  const rows = [];
  for (const line of lines) {
    let pair = splitFirst(line, " - ") || splitFirst(line, "\t") || splitFirst(line, ":") || splitFirst(line, ",");
    if (!pair) {
      const m = line.split(/\s{2,}/);
      if (m.length >= 2) pair = [m[0].trim(), m.slice(1).join(" ").trim()];
    }
    if (pair) {
      const [word, meaning] = pair;
      if (word && meaning) rows.push({ word, meaning });
    }
  }
  return rows;
}
function parseExamPaste(text) {
  const blocks = text.split(/\n\s*\n/).map((b) => b.trim()).filter(Boolean);
  const out = [];
  for (const block of blocks) {
    const lines = block.split("\n").map((l) => l.trim()).filter(Boolean);
    if (lines.length < 3) continue;
    const isMarker = (l) => /^(?:[①②③④⑤]|[1-9][.\)]|[A-Da-d][.\)])\s*/.test(l);
    const isAnswer = (l) => /^정답\s*[:：]?/.test(l);
    const qLines = [];
    let i = 0;
    while (i < lines.length && !isMarker(lines[i]) && !isAnswer(lines[i])) { qLines.push(lines[i]); i++; }
    if (qLines.length === 0) continue;
    qLines[0] = qLines[0].replace(/^\d+[.\)]\s*/, "");
    const qText = qLines.join("\n");
    const choices = [];
    let answerIdx = 0;
    for (; i < lines.length; i++) {
      const line = lines[i];
      const ansMatch = line.match(/^정답\s*[:：]?\s*([1-9A-Da-d])/);
      if (ansMatch) {
        const a = ansMatch[1];
        answerIdx = /[1-9]/.test(a) ? parseInt(a, 10) - 1 : a.toUpperCase().charCodeAt(0) - 65;
        continue;
      }
      const marker = line.match(/^(?:[①②③④⑤]|[1-9][.\)]|[A-Da-d][.\)])\s*/);
      if (marker) choices.push(line.slice(marker[0].length).trim());
      else if (choices.length > 0) choices[choices.length - 1] += " " + line;
    }
    if (qText && choices.length >= 2) out.push({ q: qText, choices, answer: Math.min(Math.max(answerIdx, 0), choices.length - 1) });
  }
  return out;
}
function normText(s) { return String(s ?? "").replace(/\s+/g, "").toLowerCase(); }
function checkVocabAnswer(userAnswer, correctMeaning, synonyms) {
  const norm = normText(userAnswer);
  if (!norm) return false;
  const segments = correctMeaning.split(/[,;/·]|\(|\)|\[|\]/).map((s) => normText(s)).filter(Boolean);
  const extra = (synonyms || []).map((s) => normText(s)).filter(Boolean);
  return [...segments, ...extra].some((seg) => seg === norm || (seg.length >= 2 && norm.length >= 2 && (seg.includes(norm) || norm.includes(seg))));
}
async function compressImage(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
          else { width = Math.round(width * (maxDim / height)); height = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => resolve(e.target.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Materials library ("자료실") — a dedicated top-level collection (one Firestore doc per file),
// not embedded in sarahsEnglishMeta/main, because files here (PDFs/이미지 등, inline as base64)
// would otherwise blow through that doc's 1MB shared cap after just a couple of uploads. Same
// pattern as passageArchive in passage-transform.html. Per-student, not shared — each doc carries a
// studentId and every read is scoped to one student so a student/parent only ever sees their own.
const MATERIALS_COLLECTION = "materialsLibrary";
async function fetchMaterials(studentId) {
  // Sorted client-side (not via orderBy in the query) so this stays a single-field equality
  // filter — combining it with orderBy on a different field would need a composite index
  // pre-created in the Firebase console, which nothing in this repo provisions.
  const q = window.__query(window.__collection(window.__db, MATERIALS_COLLECTION), window.__where("studentId", "==", studentId));
  const snap = await window.__getDocs(q);
  return snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
}
async function addMaterial(entry) {
  await window.__addDoc(window.__collection(window.__db, MATERIALS_COLLECTION), { ...entry, createdAt: window.__serverTimestamp() });
}
async function deleteMaterial(id) {
  await window.__deleteDoc(window.__doc(window.__db, MATERIALS_COLLECTION, id));
}

// 공유 자료실 — a second, separate collection (not a null/blank studentId on the same collection)

// ---------- Root ----------
function App() {
  const [screen, setScreen] = useState("home");
  const [roster, setRoster] = useState(null);
  const [teacherAuth, setTeacherAuth] = useState(null);
  const [levelTestBookings, setLevelTestBookings] = useState([]);
  const [announcement, setAnnouncement] = useState(null);
  const [examKeyLibrary, setExamKeyLibrary] = useState([]);
  const [session, setSession] = useState(null);
  const [dataCache, setDataCache] = useState({});
  const [selectedStudentId, setSelectedStudentId] = useState(null);
  const [err, setErr] = useState("");
  const [loadError, setLoadError] = useState(false);
  const [loadTick, setLoadTick] = useState(0);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      setLoadError(false);
      try {
        const s = await loadStore();
        if (cancelled) return;
        setRoster(s.roster);
        setTeacherAuth(s.teacherAuth);
        setLevelTestBookings(s.levelTestBookings || []);
        setAnnouncement(s.announcement || null);
        setExamKeyLibrary(s.examKeyLibrary || []);
      } catch (e) {
        if (!cancelled) setLoadError(true);
      }
    })();
    return () => { cancelled = true; };
  }, [loadTick]);

  async function saveBookingsList(list) {
    setLevelTestBookings(list);
    if (store) store.levelTestBookings = list;
    await saveMeta();
  }
  async function addBooking(b) {
    const next = [{ id: uid(), status: "대기", createdAt: today(), ...b }, ...levelTestBookings];
    await saveBookingsList(next);
    notifyTeacher(b.name, "level_test_booking", `${b.kind || "예약"} · 희망일 ${b.date}${b.time ? " " + b.time : ""}`);
  }
  async function saveAnnouncement(text) {
    const next = text ? { text, updatedAt: today() } : null;
    setAnnouncement(next);
    if (store) store.announcement = next;
    await saveMeta();
  }
  async function saveExamKeyLibrary(list) {
    setExamKeyLibrary(list);
    if (store) store.examKeyLibrary = list;
    await saveMeta();
  }

  async function ensureData(id) {
    const remote = await loadStudentDoc(id);
    const d = remote || dataCache[id] || emptyData();
    setDataCache((prev) => ({ ...prev, [id]: d }));
    if (store) store.studentData[id] = d;
    return d;
  }
  async function updateData(id, updater) {
    // Use a Firestore transaction so the read-modify-write is atomic on the server.
    // This is what actually prevents data loss from rapid or overlapping edits (e.g. two
    // photos taken back to back, or the teacher and a student editing at the same moment) —
    // a client-side cache or same-tab queue can't protect against a second browser tab/device
    // writing in between, but a transaction does.
    const ref = window.__doc(window.__db, STUDENTS_COLLECTION, id);
    let next;
    await window.__runTransaction(window.__db, async (tx) => {
      const snap = await tx.get(ref);
      const cur = snap.exists() ? snap.data() : (dataCache[id] || emptyData());
      next = stripUndefinedDeep(updater(cur));
      tx.set(ref, next);
    });
    setDataCache((prev) => ({ ...prev, [id]: next }));
    if (store) store.studentData[id] = next;
    return next;
  }
  async function saveRosterList(list) {
    setRoster(list);
    if (store) store.roster = list;
    await saveMeta();
  }
  // saveRosterList does a blind overwrite of the whole meta doc (fine when only the teacher,
  // a single actor, ever edits it). Once students can edit their own schedule too, concurrent
  // writes from different students (or a student and the teacher) racing on the same doc could
  // silently drop each other's changes — the same class of bug fixed earlier for per-student
  // data via a transaction. This does the same for a single roster entry: read-modify-write the
  // meta doc inside a transaction, touching only that one student's fields.
  async function updateStudentRosterEntry(studentId, updater) {
    const ref = window.__doc(window.__db, META_COLLECTION, META_DOC_ID);
    let nextRoster;
    await window.__runTransaction(window.__db, async (tx) => {
      const snap = await tx.get(ref);
      const cur = snap.exists() ? snap.data() : {};
      const curRoster = Array.isArray(cur.roster) ? cur.roster : [];
      nextRoster = curRoster.map((r) => (r.id === studentId ? updater(r) : r));
      tx.set(ref, { ...cur, roster: nextRoster });
    });
    setRoster(nextRoster);
    if (store) store.roster = nextRoster;
    return nextRoster;
  }
  async function saveTeacherAuthGlobal(ta) {
    setTeacherAuth(ta);
    if (store) store.teacherAuth = ta;
    await saveMeta();
  }
  // Multiple devices/tabs could each register their own token around the same time — a
  // transaction (like updateStudentRosterEntry above) keeps one device's registration from
  // wiping out another's, which a blind saveMeta() overwrite could otherwise do.
  async function addTeacherFcmToken(token) {
    const ref = window.__doc(window.__db, META_COLLECTION, META_DOC_ID);
    await window.__runTransaction(window.__db, async (tx) => {
      const snap = await tx.get(ref);
      const cur = snap.exists() ? snap.data() : {};
      const tokens = new Set(cur.teacherFcmTokens || []);
      tokens.add(token);
      tx.set(ref, { ...cur, teacherFcmTokens: [...tokens] });
    });
  }

  function logout() {
    setSession(null); setSelectedStudentId(null); setErr(""); setScreen("home");
  }

  if (loadError) {
    return html`
      <div style=${{ minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", color: C.slate, gap: 14, padding: 20, textAlign: "center" }}>
        <div style=${{ fontSize: 15, color: C.navy, fontWeight: 700 }}>데이터를 불러오지 못했어요</div>
        <div style=${{ fontSize: 13 }}>네트워크 상태를 확인하고 다시 시도해 주세요. (안전을 위해, 불러오기 전에는 아무 것도 저장하지 않아요)</div>
        <${Button} variant="gold" onClick=${() => setLoadTick((n) => n + 1)}>다시 시도<//>
      </div>
    `;
  }

  if (roster === null) {
    return html`<div style=${{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: C.slate }}>불러오는 중...</div>`;
  }

  if (screen === "teacherDash") {
    return html`<${TeacherDash} roster=${roster} saveRosterList=${saveRosterList}
      selectedStudentId=${selectedStudentId} setSelectedStudentId=${setSelectedStudentId}
      ensureData=${ensureData} updateData=${updateData} dataCache=${dataCache} onLogout=${logout}
      levelTestBookings=${levelTestBookings} saveBookingsList=${saveBookingsList}
      announcement=${announcement} saveAnnouncement=${saveAnnouncement}
      examKeyLibrary=${examKeyLibrary} saveExamKeyLibrary=${saveExamKeyLibrary}
      addTeacherFcmToken=${addTeacherFcmToken} />`;
  }

  const MODAL_SCREENS = ["levelTest", "teacherLogin", "studentLogin", "parentLogin"];
  const isModal = MODAL_SCREENS.includes(screen);
  const isWide = screen === "home" || isModal;
  return html`
    <div style=${{ minHeight: "100vh", background: C.ivory }}>
      ${(screen !== "home" && !isModal) && html`<${TopBar} tagline=${screen === "studentDash" ? "Student Portal" : screen === "parentDash" ? "Parent Portal" : "learning, tracked with care"} />`}
      <div style=${{ maxWidth: isWide ? 1080 : 480, margin: "0 auto", padding: (screen === "home" || isModal) ? "0 0 60px" : "18px 16px 60px" }}>
        ${(screen === "home" || isModal) && html`<${HomePage} setScreen=${setScreen} announcement=${announcement} />`}
        ${screen === "studentDash" && html`<${StudentDash} student=${roster.find((r) => r.id === session.student.id) || session.student}
          updateStudentRosterEntry=${updateStudentRosterEntry} ensureData=${ensureData} updateData=${updateData} dataCache=${dataCache} onLogout=${logout} />`}
        ${screen === "parentDash" && html`<${ParentDash} student=${roster.find((r) => r.id === session.student.id) || session.student}
          updateStudentRosterEntry=${updateStudentRosterEntry} ensureData=${ensureData} updateData=${updateData} dataCache=${dataCache} onLogout=${logout} />`}
      </div>
      ${isModal && html`<${Modal} onClose=${() => setScreen("home")}>
        ${screen === "levelTest" && html`<${LevelTestBooking} onBack=${() => setScreen("home")} onSubmit=${async (b) => { await addBooking(b); }} />`}
        ${screen === "teacherLogin" && html`<${TeacherLogin} teacherAuth=${teacherAuth} onBack=${() => setScreen("home")}
          onSetPass=${async (p) => { const ta = { passcode: p }; await saveTeacherAuthGlobal(ta); setSession({ role: "teacher" }); setScreen("teacherDash"); }}
          onLogin=${(p) => { if (teacherAuth && p === teacherAuth.passcode) { setSession({ role: "teacher" }); setScreen("teacherDash"); } else setErr("비밀번호가 맞지 않아요."); }}
          err=${err} />`}
        ${screen === "studentLogin" && html`<${StudentParentLogin} mode="student" roster=${roster} onBack=${() => setScreen("home")}
          onLogin=${(s) => {
            setSession({ role: "student", student: s }); setScreen("studentDash");
            // Fire-and-forget: recording the login time shouldn't block or fail the login itself.
            saveRosterList(roster.map((r) => (r.id === s.id ? { ...r, lastStudentLoginAt: Date.now() } : r))).catch(() => {});
            notifyTeacher(s.name, "student_login");
          }} />`}
        ${screen === "parentLogin" && html`<${StudentParentLogin} mode="parent" roster=${roster} onBack=${() => setScreen("home")}
          onLogin=${(s) => {
            setSession({ role: "parent", student: s }); setScreen("parentDash");
            saveRosterList(roster.map((r) => (r.id === s.id ? { ...r, lastParentLoginAt: Date.now() } : r))).catch(() => {});
            notifyTeacher(s.name, "parent_login");
          }} />`}
      <//>`}
    </div>
  `;
}

function NotifyButton({ onEnable }) {
  // Doesn't infer "on" purely from Notification.permission on mount — permission can be
  // "granted" from an earlier attempt whose getToken()/save step then failed, which would show
  // a false "🔔 알림 켜짐" with no token ever saved. But showing a plain "off" button in that case
  // isn't right either — if permission really was already granted (the normal case after a
  // previous successful setup), the button looked reset on every page load even though
  // notifications were still working, because nothing re-ran the token/save step. So: if
  // permission is already granted, silently redo the enable flow on mount — requestPermission()
  // on an already-granted permission resolves immediately without re-prompting, so this is safe
  // to do automatically, and it also keeps the token fresh (FCM tokens can rotate over time).
  const [status, setStatus] = useState("idle");
  useEffect(() => {
    if (typeof Notification === "undefined" || Notification.permission !== "granted") return;
    (async () => {
      try {
        const token = await enableNotifications();
        await onEnable(token);
        setStatus("on");
      } catch {
        // leave as idle — user can retry manually via the button
      }
    })();
  }, []);
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [testMsg, setTestMsg] = useState("");

  async function handle() {
    setErr(""); setBusy(true);
    try {
      const token = await enableNotifications();
      await onEnable(token);
      setStatus("on");
      try {
        await sendTestNotification(token);
      } catch {
        // token saved fine either way — the test push failing isn't fatal, just less feedback
      }
    } catch (e) {
      setErr(e.message || String(e));
    }
    setBusy(false);
  }

  async function retest() {
    setTestMsg("보내는 중...");
    try {
      const token = await enableNotifications();
      await sendTestNotification(token);
      setTestMsg("테스트 알림을 보냈어요. 잠시 후 알림이 안 오면 브라우저 알림 권한을 확인해 주세요.");
    } catch (e) {
      setTestMsg(e.message || String(e));
    }
  }

  if (status === "on") return html`
    <span>
      <span style=${{ fontSize: 11.5, color: C.navy }}>🔔 알림 켜짐</span>
      <button onClick=${retest} style=${{ background: "none", border: "none", color: C.gold, fontSize: 10.5, marginLeft: 8, cursor: "pointer", textDecoration: "underline" }}>테스트 알림 다시 보내기</button>
      ${testMsg && html`<div style=${{ fontSize: 10.5, color: C.slate, marginTop: 4, maxWidth: 220 }}>${testMsg}</div>`}
    </span>
  `;
  return html`
    <span>
      <button onClick=${handle} disabled=${busy} style=${{ background: "none", border: `1px solid ${C.gold}`, color: C.gold, fontSize: 11.5, padding: "4px 10px", borderRadius: 3, cursor: busy ? "default" : "pointer", opacity: busy ? 0.6 : 1 }}>${busy ? "설정 중..." : "🔔 알림 받기"}</button>
      ${err && html`<div style=${{ fontSize: 10.5, color: C.danger, marginTop: 4, maxWidth: 200 }}>${err}</div>`}
    </span>
  `;
}

function MiniCalendar({ selected, onSelect, disablePast }) {
  const [viewDate, setViewDate] = useState(() => (selected ? new Date(selected + "T00:00:00") : new Date()));
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const startWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayStr = today();
  const weekdays = ["일", "월", "화", "수", "목", "금", "토"];
  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  function fmt(d) { return `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`; }
  return html`
    <div style=${{ border: `1px solid ${C.line}`, borderRadius: 4, padding: 9, background: C.white }}>
      <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 5 }}>
        <button type="button" onClick=${() => setViewDate(new Date(year, month - 1, 1))} style=${{ background: "none", border: "none", color: C.navy, cursor: "pointer", fontSize: 14, padding: "2px 6px" }}>‹</button>
        <div style=${{ ...serif, fontSize: 12.5, color: C.navy, fontWeight: 700 }}>${year}년 ${month + 1}월</div>
        <button type="button" onClick=${() => setViewDate(new Date(year, month + 1, 1))} style=${{ background: "none", border: "none", color: C.navy, cursor: "pointer", fontSize: 14, padding: "2px 6px" }}>›</button>
      </div>
      <div style=${{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 1, marginBottom: 1 }}>
        ${weekdays.map((w, i) => html`<div key=${i} style=${{ textAlign: "center", fontSize: 9.5, color: C.slate, fontWeight: 700, padding: "2px 0" }}>${w}</div>`)}
      </div>
      <div style=${{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 1 }}>
        ${cells.map((d, i) => {
          if (d === null) return html`<div key=${i}></div>`;
          const dateStr = fmt(d);
          const isPast = disablePast && dateStr < todayStr;
          const isSelected = dateStr === selected;
          return html`
            <div key=${i} onClick=${() => !isPast && onSelect(dateStr)} style=${{
              textAlign: "center", padding: "4px 0", fontSize: 11.5, borderRadius: 3,
              cursor: isPast ? "default" : "pointer",
              color: isPast ? "#C7C2B4" : (isSelected ? C.white : C.ink),
              background: isSelected ? C.gold : "transparent",
              fontWeight: isSelected ? 700 : 400,
            }}>${d}</div>
          `;
        })}
      </div>
    </div>
  `;
}

// Presents a 24h "HH:MM" value/onChange (the format every scheduling function in this app
// expects) as three plain <select> dropdowns — 오전/오후, 시, 분 — instead of the native
// <input type="time">, whose AM/PM segment is fiddly to operate (click precisely into a tiny
// segment, then type or scroll). Minutes are 10-min increments to match MASTER_SCHEDULE_TIME_SLOTS'
// grid resolution, since that's also what real class times land on in practice (e.g. 19:40~21:50).
function TimeField({ value, onChange }) {
  const [h24raw, mRaw] = (value || "09:00").split(":").map(Number);
  const h24 = isNaN(h24raw) ? 9 : h24raw;
  const isPM = h24 >= 12;
  const h12 = ((h24 + 11) % 12) + 1;
  const m = Math.round((isNaN(mRaw) ? 0 : mRaw) / 10) * 10 % 60;

  function commit(nextH12, nextIsPM, nextM) {
    let h = nextH12 % 12;
    if (nextIsPM) h += 12;
    onChange(`${String(h).padStart(2, "0")}:${String(nextM).padStart(2, "0")}`);
  }

  return html`
    <div style=${{ display: "flex", gap: 6 }}>
      <select style=${{ ...inputStyle, marginBottom: 0, width: 66 }} value=${isPM ? "PM" : "AM"} onChange=${(e) => commit(h12, e.target.value === "PM", m)}>
        <option value="AM">오전</option>
        <option value="PM">오후</option>
      </select>
      <select style=${{ ...inputStyle, marginBottom: 0, width: 62 }} value=${h12} onChange=${(e) => commit(Number(e.target.value), isPM, m)}>
        ${Array.from({ length: 12 }, (_, i) => i + 1).map((n) => html`<option key=${n} value=${n}>${n}시</option>`)}
      </select>
      <select style=${{ ...inputStyle, marginBottom: 0, width: 66 }} value=${m} onChange=${(e) => commit(h12, isPM, Number(e.target.value))}>
        ${[0, 10, 20, 30, 40, 50].map((n) => html`<option key=${n} value=${n}>${String(n).padStart(2, "0")}분</option>`)}
      </select>
    </div>
  `;
}

function MonthField({ value, onChange }) {
  const [y, m] = (value || today().slice(0, 7)).split("-").map(Number);
  function shift(delta) {
    const d = new Date(y, m - 1 + delta, 1);
    onChange(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`);
  }
  return html`
    <div style=${{ display: "flex", alignItems: "center", gap: 10, border: `1px solid ${C.line}`, borderRadius: 3, padding: "10px 14px", background: C.white }}>
      <button type="button" onClick=${() => shift(-1)} style=${{ background: "none", border: "none", color: C.navy, cursor: "pointer", fontSize: 15 }}>‹</button>
      <div style=${{ flex: 1, textAlign: "center", ...serif, fontSize: 14, color: C.navy, fontWeight: 700 }}>${y}년 ${m}월</div>
      <button type="button" onClick=${() => shift(1)} style=${{ background: "none", border: "none", color: C.navy, cursor: "pointer", fontSize: 15 }}>›</button>
    </div>
  `;
}

// ---------- Student/Parent login ----------
function StudentParentLogin({ mode, roster, onBack, onLogin }) {
  const [code, setCode] = useState(""); const [err, setErr] = useState("");
  function submit() {
    const trimmed = code.trim();
    if (!trimmed) { setErr("코드를 입력해 주세요."); return; }
    const s = roster.find((r) => (mode === "student" ? r.studentCode : r.parentCode) === trimmed);
    if (!s) { setErr("코드가 맞지 않아요. 선생님께 확인해 주세요."); return; }
    onLogin(s);
  }
  return html`
    <div style=${{ display: "flex", justifyContent: "center", padding: "30px 0" }}>
      <div style=${{ width: "100%", maxWidth: 380 }}>
        <${BackBtn} onClick=${onBack} />
        <div style=${{ background: C.white, border: `1px solid ${C.line}`, borderTop: `3px solid ${C.gold}`, padding: "34px 30px", marginTop: 14 }}>
          <div style=${{ textAlign: "center", marginBottom: 24 }}>
            <div role="img" aria-label="Sarah's English" style=${{ width: 44, height: 44, borderRadius: 11, border: `1px solid ${C.navy}`, margin: "0 auto 12px", boxSizing: "border-box", backgroundImage: `url(${LOGO_MARK_DATA_URI})`, backgroundSize: "cover", backgroundPosition: "center" }}></div>
            <div style=${{ ...serif, fontSize: 20, color: C.navy }}>${mode === "student" ? "학생 로그인" : "학부모 로그인"}</div>
          </div>
          ${roster.length === 0 ? html`<${Empty} text="아직 등록된 학생이 없어요. 선생님께 등록을 요청해 주세요." />` : html`
            <${Field} label=${mode === "student" ? "학생 코드" : "학부모 코드"}>
              <input style=${inputStyle} value=${code} onChange=${(e) => setCode(e.target.value)}
                onKeyDown=${(e) => e.key === "Enter" && submit()} placeholder="선생님께 받은 코드를 입력하세요" autoFocus />
            <//>
            ${err && html`<div style=${{ color: C.danger, fontSize: 12, marginBottom: 8 }}>${err}</div>`}
            <${Button} variant="gold" style=${{ width: "100%", justifyContent: "center", marginTop: 6 }} onClick=${submit}>로그인<//>
          `}
        </div>
      </div>
    </div>
  `;
}

function TeacherOverview({ roster, ensureData, dataCache, updateData, levelTestBookings, announcement, saveAnnouncement, onGoBookings, onGoHwStatus, onSelectStudent, showAdd, setShowAdd, name, setName, sc, setSc, pc, setPc, addErr, addStudent }) {

  }, []);
  useEffect(() => { setAnnText(announcement ? announcement.text : ""); }, [announcement]);

  async function submitAnnouncement() {

    for (const { student } of sizeInfo) {
      const d = dataCache[student.id] || emptyData();

        ...d,
        homework: (d.homework || []).map((h) => {
          const photos = (h.photos || (h.photo ? [h.photo] : [])).filter((p) => p && photoUrl(p).length < 120000); // keep small (newly compressed) photos, drop old large ones
          return { ...withoutLegacyPhoto(h), photos };
        }),
      };
      await updateData(student.id, () => next);
    }
  }
  const allConsults = [];
  roster.forEach((s) => {
    const d = dataCache[s.id] || emptyData();
    (d.consultRequests || []).forEach((r) => allConsults.push({ student: s, r }));
  });

  return html`
    <div>
      <div style=${{ fontSize: 13, color: C.slate, marginBottom: 16 }}>왼쪽 목록에서 학생을 바로 선택하시거나, 아래에서 전체 현황을 확인하세요.</div>

      <div className="main-quad-grid" style=${{ display: "grid", gridTemplateColumns: "1fr 1fr", gridTemplateRows: "1fr 1fr", gap: 20, height: "calc(100vh - 190px)", minHeight: 480 }}>
        <div style=${{ display: "flex", flexDirection: "column", minHeight: 0 }}>
          <div style=${{ fontSize: 12, fontWeight: 700, color: C.navy, marginBottom: 8, flexShrink: 0 }}>📢 공지사항</div>
          <${Card} style=${{ padding: 22, marginBottom: 0, flex: 1, minHeight: 0, display: "flex", flexDirection: "column" }}>
            <div style=${{ fontSize: 11.5, color: C.slate, marginBottom: 10, flexShrink: 0 }}>여기에 적으신 내용은 추후 학생·학부모 화면에도 표시할 수 있어요.</div>
            <textarea style=${{ ...inputStyle, flex: 1, minHeight: 0, fontSize: 14.5, resize: "none" }} value=${annText} onChange=${(e) => setAnnText(e.target.value)} placeholder="예: 8/1~8/3 방학 특강 일정 안내" />
            <div style=${{ display: "flex", alignItems: "center", gap: 10, marginTop: 10, flexShrink: 0 }}>
              <${Button} variant="gold" style=${{ padding: "8px 20px", fontSize: 13 }} onClick=${submitAnnouncement}>저장<//>
              ${annSaved && html`<span style=${{ fontSize: 12, color: C.navy }}>저장됐어요.</span>`}
            </div>
          <//>
        </div>
        <div style=${{ display: "flex", flexDirection: "column", minHeight: 0 }}>
          <div style=${{ fontSize: 12, fontWeight: 700, color: C.navy, marginBottom: 8, flexShrink: 0 }}>🗓 레벨테스트·상담 문의 ${pendingBookings.length > 0 ? `(${pendingBookings.length}건)` : ""}</div>
          <${Card} onClick=${onGoBookings} style=${{ marginBottom: 0, flex: 1, minHeight: 0, overflowY: "auto" }}>
            ${pendingBookings.length === 0 ? html`<div style=${{ fontSize: 12.5, color: C.slate }}>대기 중인 문의가 없어요.</div>` : pendingBookings.slice(0, 6).map((b) => html`
              <div key=${b.id} style=${{ fontSize: 12.5, padding: "4px 0" }}>${b.name} ${b.grade ? `(${b.grade})` : ""} — ${b.date}${b.time ? " · " + b.time : ""}</div>
            `)}
            <div style=${{ fontSize: 11.5, color: C.gold, marginTop: 6 }}>전체 보기 →</div>
          <//>
        </div>
        <div style=${{ display: "flex", flexDirection: "column", minHeight: 0 }}>
          <div style=${{ fontSize: 12, fontWeight: 700, color: C.navy, marginBottom: 8, flexShrink: 0 }}>📝 오늘(${fmtDate(todayStr)}) 확인해야 할 숙제 ${todayHomework.length > 0 ? `(${todayHomework.length}건)` : ""}</div>

            <div style=${{ fontSize: 11, color: C.slate, marginBottom: 8 }}>기한이 오늘이거나 지났는데 아직 완료 표시 안 된 숙제를 학생 전체 기준으로 모았어요.</div>
            ${!loaded ? html`<div style=${{ fontSize: 12.5, color: C.slate }}>불러오는 중...</div>` : todayHomework.length === 0 ? html`<div style=${{ fontSize: 12.5, color: C.slate }}>확인이 필요한 숙제가 없어요.</div>` : todayHomework.map(({ student, hw }, i) => html`
              <div key=${i} onClick=${() => onSelectStudent(student.id)} style=${{ fontSize: 12.5, padding: "6px 0", borderBottom: `1px dotted ${C.line}`, cursor: "pointer" }}>
                <div style=${{ fontSize: 10.5, color: C.slate }}>기한 ${fmtDate(hw.dueDate)}</div>
                <div style=${{ display: "flex", justifyContent: "space-between" }}>
                  <span><b>${student.name}</b> — ${hw.content}</span>
                  <span style=${{ color: C.danger, fontWeight: 700, whiteSpace: "nowrap", marginLeft: 8 }}>✗ 미완료</span>
                </div>

            <div onClick=${onGoHwStatus} style=${{ fontSize: 11.5, color: C.gold, marginTop: 8, cursor: "pointer" }}>전체 숙제 현황 보기 →</div>
          <//>
        </div>
        <div style=${{ display: "flex", flexDirection: "column", minHeight: 0 }}>
          <div style=${{ fontSize: 12, fontWeight: 700, color: C.navy, marginBottom: 8, flexShrink: 0 }}>💬 학부모 상담 요청 ${pendingConsults.length > 0 ? `(${pendingConsults.length}건)` : ""}</div>

              <div key=${c.r.id} onClick=${() => onSelectStudent(c.student.id)} style=${{ fontSize: 12.5, padding: "6px 0", borderBottom: `1px dotted ${C.line}`, cursor: "pointer" }}>
                <b>${c.student.name}</b> · ${c.r.method} — 1지망 ${c.r.choices[0].date} ${c.r.choices[0].time}
              </div>
            `)}
            <div onClick=${onGoBookings} style=${{ fontSize: 11.5, color: C.gold, marginTop: 6, cursor: "pointer" }}>레벨테스트·상담 문의에서 함께 보기 →</div>

      ${sizeInfo.length > 0 && html`

              <span>${x.student.name}</span><span style=${{ color: x.pct >= 90 ? C.danger : C.gold, fontWeight: 700 }}>${x.kb}KB (${x.pct}%)</span>
            </div>
          `)}
          <${Button} variant="danger" style=${{ marginTop: 10, padding: "7px 14px", fontSize: 12 }} onClick=${bulkClearOldPhotos}>예전 방식 사진 한꺼번에 정리<//>
          <div style=${{ fontSize: 11, color: C.slate, marginTop: 6 }}>학생 이름을 누르면 그 학생의 "저장 공간 관리" 탭에서 세부적으로 정리할 수도 있어요.</div>
        <//>
      `}
    </div>
  `;
}

function RevenueOverviewSection({ roster, ensureData, dataCache }) {
  const [month, setMonth] = useState(today().slice(0, 7));
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      for (const s of roster) { await ensureData(s.id); if (cancelled) return; }
      if (!cancelled) setLoaded(true);
    })();
    return () => { cancelled = true; };
  }, []);

  if (!loaded) return html`<${Empty} text="불러오는 중..." />`;

  const rows = roster
    .map((s) => ({ student: s, rec: ((dataCache[s.id] || emptyData()).tuitionRecords || {})[month] }))
    .filter((r) => r.rec)
    .sort((a, b) => (b.rec.amount || 0) - (a.rec.amount || 0));
  const total = rows.reduce((sum, r) => sum + (r.rec.amount || 0), 0);
  const unpaidRows = rows.filter((r) => !r.rec.paid);
  const unpaidTotal = unpaidRows.reduce((sum, r) => sum + (r.rec.amount || 0), 0);

  const trendMonths = [];
  {
    const [y, m] = month.split("-").map(Number);
    for (let i = 5; i >= 0; i--) {
      const dt = new Date(y, m - 1 - i, 1);
      trendMonths.push(`${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}`);
    }
  }
  const trendTotals = trendMonths.map((mo) => roster.reduce((sum, s) => {
    const rec = ((dataCache[s.id] || emptyData()).tuitionRecords || {})[mo];
    return sum + (rec ? (rec.amount || 0) : 0);
  }, 0));
  const maxTrend = Math.max(1, ...trendTotals);

  return html`
    <div>
      <${Card}>
        <div style=${{ marginBottom: 10 }}><${MonthField} value=${month} onChange=${setMonth} /></div>
        <div style=${{ ...serif, fontSize: 26, color: C.navy, textAlign: "center", margin: "8px 0 4px" }}>${total.toLocaleString()}원</div>
        <div style=${{ fontSize: 12, color: C.slate, textAlign: "center" }}>${month} 총 매출 (저장된 수업료 기록 기준, ${rows.length}명)</div>
        ${rows.length > 0 && html`
          <div style=${{ fontSize: 12, color: unpaidRows.length > 0 ? C.danger : "#3D6B4F", textAlign: "center", marginTop: 6, fontWeight: 700 }}>
            ${unpaidRows.length > 0 ? `미입금 ${unpaidRows.length}명 · ${unpaidTotal.toLocaleString()}원` : "전원 입금 완료"}
          </div>
        `}
      <//>
      <${Card}>
        <div style=${{ fontSize: 12, fontWeight: 700, color: C.navy, marginBottom: 8 }}>학생별 수업료 · 입금 현황</div>
        ${rows.length === 0 ? html`<${Empty} text="이 달 저장된 수업료 기록이 없어요. 학생 관리 > 출결·수업료에서 입력해 주세요." />` : html`
          <div style=${{ overflowX: "auto", border: `1px solid ${C.line}`, borderRadius: 4 }}>
            <table style=${{ width: "100%", borderCollapse: "collapse", fontSize: 12.5, minWidth: 380 }}>
              <thead>
                <tr style=${{ background: C.ivory }}>
                  <th style=${{ padding: "7px 10px", textAlign: "left", color: C.navy, fontSize: 11 }}>학생</th>
                  <th style=${{ padding: "7px 10px", textAlign: "right", color: C.navy, fontSize: 11 }}>금액</th>
                  <th style=${{ padding: "7px 10px", textAlign: "left", color: C.navy, fontSize: 11, width: 90 }}>입금</th>
                </tr>
              </thead>
              <tbody>
                ${rows.map(({ student, rec }) => html`
                  <tr key=${student.id} style=${{ borderTop: `1px solid ${C.line}` }}>
                    <td style=${{ padding: "7px 10px", fontWeight: 700, color: C.navy, whiteSpace: "nowrap" }}>${student.name}${!rec.published ? html` <span style=${{ color: C.slate, fontSize: 10.5, fontWeight: 400 }}>(비공개)</span>` : ""}</td>
                    <td style=${{ padding: "7px 10px", textAlign: "right", whiteSpace: "nowrap" }}>${(rec.amount || 0).toLocaleString()}원</td>
                    <td style=${{ padding: "7px 10px" }}><span style=${{ fontSize: 10.5, fontWeight: 700, padding: "2px 8px", borderRadius: 20, background: rec.paid ? "#E9F1EA" : "#F7E9E6", color: rec.paid ? "#3D6B4F" : C.danger, whiteSpace: "nowrap" }}>${rec.paid ? "입금완료" : "미입금"}</span></td>
                  </tr>
                `)}
              </tbody>
            </table>
          </div>
        `}
      <//>
      <${Card}>
        <div style=${{ fontSize: 12, fontWeight: 700, color: C.navy, marginBottom: 10 }}>최근 6개월 매출 추이</div>
        <div style=${{ display: "flex", alignItems: "flex-end", gap: 8, height: 100 }}>
          ${trendMonths.map((mo, i) => html`
            <div key=${mo} style=${{ flex: 1, textAlign: "center" }}>
              <div style=${{ height: `${Math.max(2, Math.round((trendTotals[i] / maxTrend) * 80))}px`, background: mo === month ? C.gold : C.line, borderRadius: "2px 2px 0 0" }}></div>
              <div style=${{ fontSize: 9, color: C.slate, marginTop: 4 }}>${mo.slice(5)}월</div>
            </div>
          `)}
        </div>
      <//>
    </div>
  `;
}

    if (!name || !sc || !pc) return;
    const dupe = roster.some((r) => r.studentCode === sc || r.parentCode === sc || r.studentCode === pc || r.parentCode === pc);

function ScheduleGoalEditor({ student, saveRosterList, roster }) {
  const [showMonthly, setShowMonthly] = useState(false); // monthly overrides are the less-common case, so they stay tucked behind their own toggle instead of always showing alongside the weekly pattern
  // Left column is add/edit-one-at-a-time — registered slots are NOT listed here (that would just
  // duplicate what the calendar on the right already shows). Clicking a class on the calendar loads
  // it into this form via onSelectTutoring instead of a separate editable list.
  const [form, setForm] = useState({ day: "월", time: "18:00", endTime: "19:00" });
  const [editingIndex, setEditingIndex] = useState(null); // index into student.schedule, or null while adding a new one
  const [busy, setBusy] = useState(false);
  const [month, setMonth] = useState(today().slice(0, 7));
  const [monthly, setMonthly] = useState((student.monthlyInstances || {})[today().slice(0, 7)] || []);
  const [monthlySaved, setMonthlySaved] = useState(false);
  useEffect(() => {
    setForm({ day: "월", time: "18:00", endTime: "19:00" }); setEditingIndex(null); setShowMonthly(false);
    setMonth(today().slice(0, 7));
    setMonthly((student.monthlyInstances || {})[today().slice(0, 7)] || []);
  }, [student.id]);
  useEffect(() => {
    setMonthly((student.monthlyInstances || {})[month] || []);
  }, [month]);

  const DAY_NAMES = ["일", "월", "화", "수", "목", "금", "토"];

  function selectForEdit(idx) {
    const s = (student.schedule || [])[idx];
    if (!s) return;
    setForm({ day: s.day, time: s.time, endTime: s.endTime || "" });
    setEditingIndex(idx);
  }
  function resetForm() { setForm({ day: "월", time: "18:00", endTime: "19:00" }); setEditingIndex(null); }
  async function submitForm() {
    setBusy(true);
    try {
      const next = [...(student.schedule || [])];
      if (editingIndex != null) next[editingIndex] = { ...form };
      else next.push({ ...form });
      await saveRosterList(roster.map((r) => (r.id === student.id ? { ...r, schedule: next } : r)));
      resetForm();
    } finally {
      setBusy(false);
    }
  }
  async function deleteEditing() {
    if (editingIndex == null) return;
    setBusy(true);
    try {
      const next = (student.schedule || []).filter((_, i) => i !== editingIndex);
      await saveRosterList(roster.map((r) => (r.id === student.id ? { ...r, schedule: next } : r)));
      resetForm();
    } finally {
      setBusy(false);
    }
  }
  async function removeTutoringOccurrence(dateStr) {
    await saveRosterList(roster.map((r) => (r.id === student.id
      ? { ...r, tutoringExceptions: [...new Set([...(r.tutoringExceptions || []), dateStr])] }
      : r)));
  }

  function generateMonth() {
    const [y, m] = month.split("-").map(Number);
    const daysInMonth = new Date(y, m, 0).getDate();
    const generated = [];
    for (let d = 1; d <= daysInMonth; d++) {
      const dt = new Date(y, m - 1, d);
      const dayName = DAY_NAMES[dt.getDay()];
      const match = (student.schedule || []).find((s) => s.day === dayName);
      if (match) generated.push({ date: `${month}-${String(d).padStart(2, "0")}`, time: match.time, endTime: match.endTime, type: "tutoring" });
    }
    setMonthly(generated);
    setMonthlySaved(false);
  }
  function updateInstance(i, field, val) { setMonthly(monthly.map((d, idx) => (idx === i ? { ...d, [field]: val } : d))); setMonthlySaved(false); }
  function removeInstance(i) { setMonthly(monthly.filter((_, idx) => idx !== i)); setMonthlySaved(false); }
  function addInstance() { setMonthly([...monthly, { date: month + "-01", time: "18:00", endTime: "19:00", type: "makeup" }].sort((a, b) => (a.date < b.date ? -1 : 1))); setMonthlySaved(false); }
  async function saveMonthly() {
    await saveRosterList(roster.map((r) => (r.id === student.id
      ? { ...r, monthlyInstances: { ...(r.monthlyInstances || {}), [month]: monthly } }
      : r)));
    setMonthlySaved(true);
  }

  return html`
    <${Card} style=${{ marginBottom: 16 }}>
      <div style=${{ fontSize: 12, fontWeight: 700, color: C.navy, marginBottom: 12 }}>🗓 수업 스케줄</div>
      <div style=${{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(280px, 1fr))", gap: 20, alignItems: "start" }}>
        <div>
          <div style=${{ fontSize: 11.5, color: C.slate, fontWeight: 700, marginBottom: 4 }}>${editingIndex != null ? "수업 시간 수정" : "매주 반복 수업 등록"}</div>
          <div style=${{ fontSize: 11, color: C.slate, marginBottom: 10 }}>등록한 수업은 오른쪽 달력에 표시돼요. 달력에서 수업을 누르면 여기서 바로 수정·삭제할 수 있어요.</div>
          <select style=${{ ...inputStyle, marginBottom: 8, width: 110 }} value=${form.day} onChange=${(e) => setForm({ ...form, day: e.target.value })}>
            ${DAY_NAMES.map((n) => html`<option key=${n} value=${n}>${n}요일</option>`)}
          </select>
          <div style=${{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", marginBottom: 12 }}>
            <${TimeField} value=${form.time} onChange=${(v) => setForm({ ...form, time: v })} />
            <span style=${{ color: C.slate }}>~</span>
            <${TimeField} value=${form.endTime} onChange=${(v) => setForm({ ...form, endTime: v })} />
          </div>
          <div style=${{ display: "flex", gap: 8, marginBottom: 16 }}>
            <${Button} variant="gold" disabled=${busy} style=${{ padding: "6px 14px", fontSize: 12 }} onClick=${submitForm}>${editingIndex != null ? "저장" : "+ 추가"}<//>
            ${editingIndex != null && html`<${Button} variant="danger" disabled=${busy} style=${{ padding: "6px 14px", fontSize: 12 }} onClick=${deleteEditing}>삭제<//>`}
            ${editingIndex != null && html`<${Button} variant="ghost" style=${{ padding: "6px 14px", fontSize: 12 }} onClick=${resetForm}>취소<//>`}
          </div>

          <div style=${{ borderTop: `1px dashed ${C.line}`, paddingTop: 12 }}>
            <button onClick=${() => setShowMonthly((v) => !v)} style=${{ background: "none", border: "none", color: C.gold, fontSize: 11.5, fontWeight: 700, cursor: "pointer", padding: 0 }}>
              ${showMonthly ? "▾" : "▸"} 특정 날짜만 다르게 (보강 등)
            </button>
            ${showMonthly && html`
              <div style=${{ marginTop: 10 }}>
                <div style=${{ fontSize: 11.5, color: C.slate, marginBottom: 8 }}>위 매주 패턴을 고른 달 달력에 그대로 채운 다음, 날짜가 바뀐 날만 골라 수정하세요.</div>
                <div style=${{ marginBottom: 8 }}><${MonthField} value=${month} onChange=${setMonth} /></div>
                <${Button} variant="ghost" style=${{ padding: "5px 12px", fontSize: 11.5, marginBottom: 10 }} onClick=${generateMonth}>이 달 일정, 매주 패턴으로 채우기<//>
                ${monthly.map((d, i) => html`
                  <div key=${i} style=${{ border: `1px solid ${C.line}`, borderRadius: 4, padding: 10, marginBottom: 8 }}>
                    <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8, gap: 8 }}>
                      <${DateField} value=${d.date} onChange=${(v) => updateInstance(i, "date", v)} />
                      <select style=${{ ...inputStyle, marginBottom: 0, width: 96 }} value=${d.type || "makeup"} onChange=${(e) => updateInstance(i, "type", e.target.value)}>
                        <option value="tutoring">영어과외</option>
                        <option value="makeup">영어보강</option>
                      </select>
                      <button onClick=${() => removeInstance(i)} style=${{ background: "none", border: "none", color: C.danger, cursor: "pointer", fontSize: 18, padding: "0 4px" }}>×</button>
                    </div>
                    <div style=${{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
                      <${TimeField} value=${d.time} onChange=${(v) => updateInstance(i, "time", v)} />
                      <span style=${{ color: C.slate }}>~</span>
                      <${TimeField} value=${d.endTime || ""} onChange=${(v) => updateInstance(i, "endTime", v)} />
                    </div>
                  </div>
                `)}
                <div style=${{ display: "flex", alignItems: "center", gap: 10 }}>
                  <${Button} variant="ghost" style=${{ padding: "5px 12px", fontSize: 11.5 }} onClick=${addInstance}>+ 날짜 하나만 따로 추가<//>
                  <${Button} variant="gold" style=${{ padding: "5px 12px", fontSize: 11.5 }} onClick=${saveMonthly}>저장<//>
                  ${monthlySaved && html`<span style=${{ fontSize: 11.5, color: C.navy }}>저장됐어요.</span>`}
                </div>
              </div>
            `}
          </div>
        </div>

        <div>
          <div style=${{ fontSize: 11.5, color: C.slate, fontWeight: 700, marginBottom: 8 }}>월간 시간표 (과외 + 보강 + 학생이 입력한 다른 학원)</div>
          <${MonthlyScheduleGrid} tutoring=${student.schedule || []} monthlyInstances=${student.monthlyInstances || {}} other=${student.otherSchedule || []}
            tutoringExceptions=${student.tutoringExceptions || []} onRemoveTutoring=${removeTutoringOccurrence} onSelectTutoring=${selectForEdit} />
        </div>
      </div>
    <//>
  `;
}

// ---------- 단어 시험지 생성 (기존 wordtest.html 도구를 그대로 임베드) ----------
function ExamKeyLibrarySection({ library, saveLibrary }) {
  const [status, setStatus] = useState("");
  const [pending, setPending] = useState(null); // sets parsed from a PDF, awaiting confirmation
  const [pdfBook, setPdfBook] = useState("");
  const [manualBook, setManualBook] = useState("");
  const [manualName, setManualName] = useState("");
  const [manualAnswers, setManualAnswers] = useState([]);
  const [manualMsg, setManualMsg] = useState("");
  const [collapsedBooks, setCollapsedBooks] = useState({});
  const [editingId, setEditingId] = useState(null); // id of a saved set currently being corrected
  const [editDraft, setEditDraft] = useState({ name: "", answers: [] });

  function resizeAnswers(setter) {
    return (n) => {
      const count = Math.max(0, Math.min(200, Number(n) || 0));
      setter((prev) => {
        const next = prev.slice(0, count);
        while (next.length < count) next.push("");
        return next;
      });
    };
  }
  const setManualCount = resizeAnswers(setManualAnswers);
  function setManualAt(i, val) { setManualAnswers((prev) => prev.map((v, idx) => (idx === i ? val : v))); }
  function setEditCount(n) {
    const count = Math.max(0, Math.min(200, Number(n) || 0));
    setEditDraft((d) => {
      const next = d.answers.slice(0, count);
      while (next.length < count) next.push("");
      return { ...d, answers: next };
    });
  }
  function setEditAt(i, val) { setEditDraft((d) => ({ ...d, answers: d.answers.map((v, idx) => (idx === i ? val : v)) })); }
  function updatePendingCount(id, n) {
    const count = Math.max(0, Math.min(200, Number(n) || 0));
    setPending((prev) => prev.map((s) => {
      if (s.id !== id) return s;
      const next = s.answers.slice(0, count);
      while (next.length < count) next.push("");
      return { ...s, answers: next };
    }));
  }
  function updatePendingAt(id, i, val) {
    setPending((prev) => prev.map((s) => (s.id === id ? { ...s, answers: s.answers.map((v, idx) => (idx === i ? val : v)) } : s)));
  }

  const existingBooks = [...new Set((library || []).map((s) => s.book).filter(Boolean))];

  async function parseExamKeyPdfWithAI(file) {
    const images = await renderPdfPageTiles(file);
    const res = await fetch(NELT_WORKER_URL, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ mode: "examkey", images }),
    });
    const json = await res.json();
    if (!res.ok || json.error) {
      throw new Error((json.error || "AI 인식에 실패했습니다.") + (json.detail ? " / " + String(json.detail).slice(0, 200) : ""));
    }
    return Array.isArray(json) ? json : [];
  }

  async function handlePdf(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    if (!pdfBook.trim()) { setStatus("먼저 위에 책 이름을 입력해 주세요."); return; }
    setStatus("AI로 PDF를 읽는 중이에요. 페이지가 촘촘하거나 여러 장이면 1~2분 이상 걸릴 수 있어요 — 창을 닫지 말고 기다려 주세요...");
    setPending(null);
    try {
      // Text-position-based local parsing was tried here previously, but 유형별/단원별 문제집
      // answer sheets often use a flowing masonry layout (boxes of varying height packed side by
      // side) rather than a clean fixed-column grid, which broke position-clustering in ways that
      // silently produced garbled, merged block names instead of failing loudly. Always reading
      // via AI vision on high-DPI tiles is slower per upload but reads the page the way a human
      // would, regardless of layout complexity.
      const aiSets = await parseExamKeyPdfWithAI(file);
      const seenNames = new Set();
      const sets = aiSets
        .map((s) => ({ id: uid(), name: s.name, answers: (s.answers || []).map((a) => String(a)) }))
        .filter((s) => s.name && s.answers.length > 0)
        // overlapping high-res tiles can cause the same block to be read twice — keep the first.
        .filter((s) => (seenNames.has(s.name) ? false : (seenNames.add(s.name), true)));
      if (sets.length === 0) {
        setStatus("정답표 형식을 인식하지 못했어요. PDF를 확인해 주세요.");
      } else {
        setPending(sets.map((s) => ({ ...s, book: pdfBook.trim() })));
        setStatus(`${sets.length}개 시험의 정답표를 찾았어요. 정답을 꼭 확인하고 저장해 주세요 (AI로 읽은 결과예요).`);
      }
    } catch (err) {
      setStatus("AI 인식에 실패했어요: " + String(err.message || err).slice(0, 200));
    }
  }

  // Guards against a double-click on "저장" firing two saveLibrary calls back to back — without
  // this, the second call can still be holding the pre-save `library`/`pending` closure (same
  // ids), so both writes land with identical ids. That's what was causing the reported "one entry
  // deletes several at once": removeSet's `s.id !== id` filter drops every entry sharing that id.
  const [saving, setSaving] = useState(false);

  async function confirmSavePending() {
    if (saving) return;
    setSaving(true);
    try {
      const cleaned = (pending || []).map((s) => ({ ...s, answers: s.answers.map((a) => Number(a)).filter((n) => !isNaN(n)) }));
      await saveLibrary([...cleaned, ...(library || [])]);
      setPending(null); setStatus("저장했어요."); setPdfBook("");
    } finally {
      setSaving(false);
    }
  }

  async function addManual() {
    if (saving) return;
    const key = manualAnswers.map((s) => Number(s)).filter((n) => !isNaN(n));
    if (!manualBook.trim() || !manualName || key.length === 0 || key.length !== manualAnswers.length) { setManualMsg("책 이름, 시험 이름, 모든 문항의 정답을 입력해 주세요."); return; }
    setSaving(true);
    try {
      await saveLibrary([{ id: uid(), book: manualBook.trim(), name: manualName, answers: key }, ...(library || [])]);
      setManualName(""); setManualAnswers([]); setManualMsg("");
    } finally {
      setSaving(false);
    }
  }
  async function removeSet(id) {
    await saveLibrary((library || []).filter((s) => s.id !== id));
  }
  async function removeBook(book) {
    if (!confirm(`"${book}" 책에 등록된 정답표를 전부 삭제할까요?`)) return;
    await saveLibrary((library || []).filter((s) => (s.book || "미분류") !== book));
  }
  // Cleans up both symptoms the teacher hit: entries that share an id (from the double-save race
  // above) and entries that are simply exact duplicates (same book/name/answers, e.g. from
  // re-uploading the same PDF) — keeps one copy of each.
  async function dedupeLibrary() {
    const seenIds = new Set();
    const seenContent = new Set();
    let removed = 0;
    const cleaned = (library || []).filter((s) => {
      const contentKey = `${s.book || ""}|${s.name || ""}|${(s.answers || []).join(",")}`;
      if (seenIds.has(s.id) || seenContent.has(contentKey)) { removed++; return false; }
      seenIds.add(s.id);
      seenContent.add(contentKey);
      return true;
    });
    if (removed === 0) { setStatus("중복된 정답표가 없어요."); return; }
    if (!confirm(`중복된 정답표 ${removed}개를 정리할까요? (내용이 완전히 같은 항목은 하나만 남겨요)`)) return;
    await saveLibrary(cleaned);
    setStatus(`중복 ${removed}개를 정리했어요.`);
  }
  function toggleBook(book) {
    setCollapsedBooks((c) => ({ ...c, [book]: !c[book] }));
  }

  // AI로 읽은 결과(또는 예전에 잘못 저장된 결과)가 틀렸을 때 PDF를 다시 올리거나 처음부터
  // 다시 입력하지 않고, 틀린 문항 몇 개만 바로 고칠 수 있게 하는 용도.
  function startEditSet(s) {
    setEditingId(s.id);
    setEditDraft({ name: s.name, answers: s.answers.map(String) });
  }
  async function saveEditSet(id) {
    const key = editDraft.answers.map((s) => Number(s)).filter((n) => !isNaN(n));
    if (!editDraft.name.trim() || key.length === 0 || key.length !== editDraft.answers.length) return;
    await saveLibrary((library || []).map((s) => (s.id === id ? { ...s, name: editDraft.name.trim(), answers: key } : s)));
    setEditingId(null);
  }

  return html`
    <div>
      <div style=${{ fontSize: 12, color: C.slate, marginBottom: 14 }}>여기에 정답표를 미리 등록해두면, 모의고사 만들 때 매번 손으로 입력할 필요 없이 골라서 바로 채점할 수 있어요.</div>

      <datalist id="examkey-book-list">
        ${existingBooks.map((b) => html`<option key=${b} value=${b} />`)}
      </datalist>

      <${Card}>
        <h3>PDF로 한 번에 등록하기</h3>
        <div style=${{ fontSize: 12, color: C.slate, marginBottom: 10 }}>마더텅/수능기출 정답표처럼 "N회 시험이름" 또는 "N. 유형이름" 제목 아래 "01 ① 02 ③ ..." 형식으로 된 PDF를 올리면, AI가 여러 회차·단원을 한 번에 인식해서 등록해요 (몇십 초 걸릴 수 있어요).</div>
        <${Field} label="책 이름"><input style=${inputStyle} list="examkey-book-list" value=${pdfBook} onChange=${(e) => setPdfBook(e.target.value)} placeholder="예: 2026 마더텅 수능기출 20분 미니모의고사 고1" /><//>
        <label style=${{ fontSize: 12.5, fontWeight: 600, padding: "8px 14px", borderRadius: 3, border: `1px solid ${C.navy}`, color: C.navy, cursor: "pointer", display: "inline-block" }}>
          PDF 선택
          <input type="file" accept="application/pdf" onChange=${handlePdf} style=${{ display: "none" }} />
        </label>
        ${status && html`<div style=${{ fontSize: 12, color: C.navy, marginTop: 10 }}>${status}</div>`}
        ${pending && html`
          <div style=${{ fontSize: 11.5, color: C.danger, marginTop: 10 }}>AI가 읽은 결과예요. 저장 전에 원본 PDF와 꼭 대조해서 틀린 부분이 있으면 아래에서 바로 고쳐 주세요.</div>
          <div style=${{ marginTop: 8, maxHeight: 420, overflowY: "auto" }}>
            ${pending.map((s) => html`
              <div key=${s.id} style=${{ fontSize: 12.5, padding: "8px 0", borderBottom: `1px dotted ${C.line}` }}>
                <b style=${{ color: C.navy }}>${s.name}</b>
                <${AnswerKeyBoxes} answers=${s.answers} onChangeCount=${(n) => updatePendingCount(s.id, n)} onChangeAt=${(i, v) => updatePendingAt(s.id, i, v)} />
              </div>
            `)}
          </div>
          <${Button} variant="gold" disabled=${saving} style=${{ marginTop: 10 }} onClick=${confirmSavePending}>${saving ? "저장 중..." : "확인했어요, 저장하기"}<//>
        `}
      <//>

      <${Card}>
        <h3>직접 하나씩 등록하기</h3>
        <${Field} label="책 이름"><input style=${inputStyle} list="examkey-book-list" value=${manualBook} onChange=${(e) => setManualBook(e.target.value)} placeholder="예: 2026 마더텅 수능기출 20분 미니모의고사 고1" /><//>
        <${Field} label="시험 이름"><input style=${inputStyle} value=${manualName} onChange=${(e) => setManualName(e.target.value)} placeholder="예: 17회 2024년 3월 학력평가" /><//>
        <${AnswerKeyBoxes} answers=${manualAnswers} onChangeCount=${setManualCount} onChangeAt=${setManualAt} />
        ${manualMsg && html`<div style=${{ fontSize: 12, color: C.danger, marginBottom: 8 }}>${manualMsg}</div>`}
        <${Button} variant="gold" disabled=${saving} onClick=${addManual}>${saving ? "저장 중..." : "등록"}<//>
      <//>

      <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center", margin: "18px 0 8px" }}>
        <div style=${{ fontSize: 11.5, color: C.slate, fontWeight: 700 }}>등록된 정답표 (${(library || []).length}개)</div>
        <button onClick=${dedupeLibrary} style=${{ background: "none", border: `1px solid ${C.line}`, color: C.slate, borderRadius: 3, padding: "5px 10px", fontSize: 11, cursor: "pointer" }}>중복 정리</button>
      </div>
      ${(!library || library.length === 0) && html`<${Empty} text="아직 등록된 정답표가 없어요." />`}
      ${(() => {
        const groups = {};
        (library || []).forEach((s) => {
          const book = s.book || "미분류";
          if (!groups[book]) groups[book] = [];
          groups[book].push(s);
        });
        return Object.keys(groups).sort().map((book) => html`
          <div key=${book} style=${{ marginBottom: 14 }}>
            <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 10px", background: C.ivory, borderRadius: 3, cursor: "pointer" }} onClick=${() => toggleBook(book)}>
              <div style=${{ fontSize: 13, fontWeight: 700, color: C.navy }}>${collapsedBooks[book] ? "▸" : "▾"} 📘 ${book} <span style=${{ color: C.slate, fontWeight: 400 }}>(${groups[book].length}개)</span></div>
              <button onClick=${(e) => { e.stopPropagation(); removeBook(book); }} style=${{ background: "none", border: "none", color: C.danger, cursor: "pointer", fontSize: 11.5 }}>책 전체 삭제</button>
            </div>
            ${!collapsedBooks[book] && html`
              <div style=${{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(160px, 1fr))", gap: 8, marginTop: 8 }}>
                ${groups[book].map((s) => html`
                  <${Card} key=${s.id} style=${{ marginBottom: 0, padding: 10 }}>
                    ${editingId === s.id ? html`
                      <input style=${{ ...inputStyle, fontSize: 12, marginBottom: 4 }} value=${editDraft.name} onChange=${(e) => setEditDraft({ ...editDraft, name: e.target.value })} />
                      <${AnswerKeyBoxes} answers=${editDraft.answers} onChangeCount=${setEditCount} onChangeAt=${setEditAt} />
                      <div style=${{ display: "flex", gap: 6 }}>
                        <button onClick=${() => saveEditSet(s.id)} style=${{ background: C.gold, border: "none", color: "#fff", borderRadius: 3, padding: "4px 10px", fontSize: 11, cursor: "pointer" }}>저장</button>
                        <button onClick=${() => setEditingId(null)} style=${{ background: "none", border: `1px solid ${C.line}`, borderRadius: 3, padding: "4px 10px", fontSize: 11, cursor: "pointer" }}>취소</button>
                      </div>
                    ` : html`
                      <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                        <div style=${{ fontSize: 12.5, fontWeight: 700, color: C.navy }}>${s.name}</div>
                        <div style=${{ display: "flex", gap: 8 }}>
                          <button onClick=${() => startEditSet(s)} style=${{ background: "none", border: "none", color: C.gold, cursor: "pointer", fontSize: 11.5 }}>수정</button>
                          <button onClick=${() => removeSet(s.id)} style=${{ background: "none", border: "none", color: C.danger, cursor: "pointer", fontSize: 14 }}>✕</button>
                        </div>
                      </div>
                      <div style=${{ fontSize: 11, color: C.slate, marginTop: 4 }}>${s.answers.length}문항</div>
                    `}
                  <//>
                `)}
              </div>
            `}
          </div>
        `);
      })()}
    </div>
  `;
}
