];
const REPORT_RATINGS = ["매우 우수", "우수", "보통", "노력 요함"];

function buildNeltComparisonText(current, previous) {
  if (!current) return "";
  const CATS = [["vocab", "어휘"], ["grammar", "문법"], ["listening", "듣기"], ["reading", "독해"]];
  const lines = [];
  const curOverall = parsePercentNum(current.overall_percentile);
  const prevOverall = previous ? parsePercentNum(previous.overall_percentile) : null;
  const overallLabel = `${current.overall_level || ""} ${current.overall_level_desc || ""}`.trim();
  if (curOverall != null && prevOverall != null) {
    lines.push(`종합: ${overallLabel} · 상위 ${curOverall}% (직전 상위 ${prevOverall}% 대비 ${neltDiffText(prevOverall - curOverall)})`);
  } else {
    lines.push(`종합: ${overallLabel} · ${current.overall_percentile || "-"}`);
  }
  CATS.forEach(([key, label]) => {
    const cur = (current.categories && current.categories[key]) || {};
    const prev = (previous && previous.categories && previous.categories[key]) || null;
    const curNum = parsePercentNum(cur.percentile);
    const prevNum = prev ? parsePercentNum(prev.percentile) : null;
    if (curNum != null && prevNum != null) {
      lines.push(`${label}: 상위 ${curNum}% (${neltDiffText(prevNum - curNum)})`);
    } else {
      lines.push(`${label}: ${cur.percentile || cur.level_desc || "-"}`);
    }
  });
  return lines.join("\n");
}

function MonthlyReportView({ student, data, updateData }) {
  const [month, setMonth] = useState(today().slice(0, 7));
  const saved = (data.monthlyReports || {})[month] || {};
  const [ratings, setRatings] = useState(saved.ratings || {});
  const [attendance, setAttendance] = useState(saved.attendance || null);
  const [content, setContent] = useState(saved.content != null ? saved.content : null);
  const [good, setGood] = useState(saved.good || "");
  const [improve, setImprove] = useState(saved.improve || "");
  const [comment, setComment] = useState(saved.comment || "");
  const [nextMonth, setNextMonth] = useState(saved.nextMonth || "");
  const [neltComment, setNeltComment] = useState(saved.neltComment || "");
  const [published, setPublished] = useState(saved.published || false);
  const [generating, setGenerating] = useState(false);
  const [genErr, setGenErr] = useState("");

  const inMonth = (s) => s && s.startsWith(month);
  const hwRows = (data.homework || []).filter((h) => inMonth(h.dueDate));
  const hwDone = hwRows.filter((h) => h.done).length;
  const hwRate = hwRows.length ? Math.round((hwDone / hwRows.length) * 100) : null;

  const vcRows = (data.vocabLog || []).filter((v) => inMonth(v.date));
  const vcPass = vcRows.filter((v) => v.passed).length;
  const vcRate = vcRows.length ? Math.round((vcPass / vcRows.length) * 100) : null;

  const logRows = (data.logs || []).filter((l) => inMonth(l.date)).sort((a, b) => (a.date < b.date ? -1 : 1));
  const scheduledCount = ((student.monthlyInstances || {})[month] || []).length;
  const attendedCount = new Set(logRows.map((l) => l.date)).size;
  const neltThisMonth = (data.neltResults || []).filter((r) => inMonth(r.test_date));

  useEffect(() => {
    const s = (data.monthlyReports || {})[month] || {};
    setRatings(s.ratings || {});
    setAttendance(s.attendance || null);
    setContent(s.content != null ? s.content : null);
    setGood(s.good || ""); setImprove(s.improve || ""); setComment(s.comment || ""); setNextMonth(s.nextMonth || "");
    setNeltComment(s.neltComment || ""); setPublished(s.published || false); setGenErr("");
  }, [month]);

  const att = attendance || {
    classDays: scheduledCount || attendedCount || "",
    attended: attendedCount || "",
    absent: scheduledCount ? Math.max(scheduledCount - attendedCount, 0) : "",
    hwRate: hwRate === null ? "" : hwRate + "%",
    vocabRate: vcRate === null ? "" : vcRate + "%",
  };
  const draftContent = content != null ? content : (logRows.length === 0 ? "" : logRows.map((l) => `• ${fmtDate(l.date)}: ${l.content}`).join("\n"));

  async function saveReport(publishOverride) {
    const nextPublished = publishOverride != null ? publishOverride : published;
    await updateData((d) => ({
      ...d,
      monthlyReports: { ...(d.monthlyReports || {}), [month]: { ratings, attendance: att, content: draftContent, good, improve, comment, nextMonth, neltComment, published: nextPublished } },
    }));
    setPublished(nextPublished);
  }
  async function publishReport() { await saveReport(true); }
  async function unpublishReport() { await saveReport(false); }

  function setRating(key, val) { setRatings((r) => ({ ...r, [key]: val })); }
  function setAtt(key, val) { setAttendance({ ...att, [key]: val }); }

  function findPreviousNelt() {
    const all = (data.neltResults || []).filter((r) => r.test_date && r.test_date < month + "-01");
    return all.sort((a, b) => (a.test_date < b.test_date ? 1 : -1))[0] || null;
  }

  async function generateWithAI() {
    setGenerating(true); setGenErr("");
    try {
      const currentNelt = neltThisMonth[neltThisMonth.length - 1] || null;
      if (currentNelt) setNeltComment(buildNeltComparisonText(currentNelt, findPreviousNelt()));

          rough: { content: draftContent, good, improve, comment, nextMonth },
        }),
      });
      const json = await res.json();
      if (!res.ok || json.error) {
        setGenErr((json.error || "AI 작성에 실패했습니다.") + (json.detail ? " / " + String(json.detail).slice(0, 200) : ""));

        if (json.good != null) setGood(json.good);
        if (json.improve != null) setImprove(json.improve);
        if (json.comment != null) setComment(json.comment);

function HomeworkEditor({ student, data, updateData }) {
  const [assignedDate, setAssignedDate] = useState(today()); const [dueDate, setDueDate] = useState(today());
  const [content, setContent] = useState("");
  const [editId, setEditId] = useState(null);
  const [editAssigned, setEditAssigned] = useState(""); const [editDue, setEditDue] = useState(""); const [editContent, setEditContent] = useState("");
  const [lightbox, setLightbox] = useState(null);
  async function add() {
    if (!content) return;
    await updateData((d) => ({ ...d, homework: [{ id: uid(), assignedDate, dueDate, content, done: false, photos: [] }, ...(d.homework || [])] }));
    notifyStudent(student.studentFcmToken, "homework_assigned", content);
    setContent("");
  }
  async function remove(id) { await updateData((d) => ({ ...d, homework: (d.homework || []).filter((h) => h.id !== id) })); }
  function startEdit(h) { setEditId(h.id); setEditAssigned(h.assignedDate); setEditDue(h.dueDate); setEditContent(h.content); }
  async function saveEdit() {
    await updateData((d) => ({ ...d, homework: (d.homework || []).map((h) => (h.id === editId ? { ...h, assignedDate: editAssigned, dueDate: editDue, content: editContent } : h)) }));
    setEditId(null);
  }
  async function toggleDone(id) {
    await updateData((d) => ({
      ...d,
      homework: (d.homework || []).map((h) => (h.id === id ? { ...h, done: !h.done, doneAt: !h.done ? Date.now() : null } : h)),
    }));
  }
  // 기간만료 — for homework that's past the point of being realistically doable (e.g. the student
  // moved on weeks ago). Distinct from "완료": it stays done:false so 숙제 진행율 still correctly
  // counts it as not completed, but it drops out of the "오늘 해야 할 일"/"밀린 숙제" nagging
  // lists everywhere (student/parent home, 숙제 현황) instead of cluttering them forever.
  async function toggleExpired(id) {
    await updateData((d) => ({
      ...d,
      homework: (d.homework || []).map((h) => (h.id === id ? { ...h, expired: !h.expired } : h)),
    }));
  }
  async function removeHomeworkPhoto(hwId, idx) {
    await updateData((d) => ({
      ...d,
      homework: (d.homework || []).map((h) => (h.id === hwId ? { ...withoutLegacyPhoto(h), photos: (h.photos || (h.photo ? [h.photo] : [])).filter((_, i) => i !== idx) } : h)),
    }));
  }
  const list = data.homework || [];
  const todayStr = today();
  const dueToday = list.filter((h) => h.dueDate && h.dueDate <= todayStr && !h.done && !h.expired);
  return html`
    <div>
      ${dueToday.length > 0 && html`
        <div style=${{ fontSize: 12.5, fontWeight: 700, color: C.navy, marginBottom: 8 }}>📌 오늘(${fmtDate(todayStr)}) 기준 확인이 필요한 숙제 (기한 지났는데 미완료인 것 포함)</div>
        <${Card} style=${{ borderLeft: `3px solid ${C.gold}`, marginBottom: 18 }}>
          ${dueToday.map((h) => html`
            <div key=${h.id} style=${{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", padding: "6px 0", borderBottom: `1px dotted ${C.line}` }}>
              <div style=${{ flex: 1 }}>
                <div style=${{ fontSize: 10.5, color: C.slate }}>기한 ${fmtDate(h.dueDate)}</div>
                <div style=${{ fontSize: 13, whiteSpace: "pre-wrap" }}>${h.content}</div>
              </div>
              <div onClick=${() => toggleDone(h.id)} style=${{ marginLeft: 10, cursor: "pointer", fontSize: 12, fontWeight: 700, whiteSpace: "nowrap", color: h.done ? C.gold : C.danger }}>${h.done ? "✓ 완료" : "✗ 미완료"}</div>
            </div>
          `)}
        <//>
      `}
      <${Card}>
        <div style=${{ display: "flex", gap: 12, marginBottom: 14 }}>
          <div style=${{ flex: 1 }}>
            <div style=${{ fontSize: 11.5, color: C.slate, marginBottom: 6, fontWeight: 600 }}>내준 날짜</div>
            <${MiniCalendar} selected=${assignedDate} onSelect=${setAssignedDate} />
          </div>
          <div style=${{ flex: 1 }}>
            <div style=${{ fontSize: 11.5, color: C.slate, marginBottom: 6, fontWeight: 600 }}>제출 기한</div>
            <${MiniCalendar} selected=${dueDate} onSelect=${setDueDate} />
          </div>
        </div>
        <${Field} label="숙제 내용"><textarea style=${{ ...inputStyle, minHeight: 70 }} value=${content} onChange=${(e) => setContent(e.target.value)} placeholder="예: 워크북 15-18p 풀어오기, 단어 Unit 5 암기" /><//>
        <${Button} variant="gold" onClick=${add}>숙제 추가<//>
      <//>
      ${list.length === 0 && html`<${Empty} text="아직 등록된 숙제가 없어요." />`}
      ${groupByDate(list, "dueDate").map((grp) => html`
        <div key=${grp.date}>
          <div style=${{ fontSize: 12.5, fontWeight: 700, color: C.navy, margin: "14px 0 6px", borderBottom: `1px solid ${C.line}`, paddingBottom: 4 }}>기한 ${fmtDateDay(grp.date)}</div>
          ${grp.items.map((h) => html`
        <${Card} key=${h.id}>
          ${editId === h.id ? html`
            <div style=${{ display: "flex", gap: 8 }}>
              <div style=${{ flex: 1 }}><${Field} label="내준 날짜"><${DateField} value=${editAssigned} onChange=${setEditAssigned} /><//></div>
              <div style=${{ flex: 1 }}><${Field} label="제출 기한"><${DateField} value=${editDue} onChange=${setEditDue} /><//></div>
            </div>
            <${Field} label="내용"><textarea style=${{ ...inputStyle, minHeight: 70 }} value=${editContent} onChange=${(e) => setEditContent(e.target.value)} /><//>
            <div style=${{ display: "flex", gap: 8 }}>
              <${Button} variant="gold" onClick=${saveEdit}>저장<//>
              <${Button} variant="ghost" onClick=${() => setEditId(null)}>취소<//>
            </div>

            <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
              <div style=${{ flex: 1 }}>
                <div style=${{ fontSize: 11.5, color: C.gold, fontWeight: 700 }}>내준 날짜 ${fmtDate(h.assignedDate)}</div>
                <div style=${{ fontSize: 13.5, marginTop: 6, whiteSpace: "pre-wrap" }}>${h.content}</div>
                ${(h.photos || (h.photo ? [h.photo] : [])).length > 0 && html`
                  <div style=${{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 8 }}>
                    ${(h.photos || (h.photo ? [h.photo] : [])).map((p, pi) => html`
                      <div key=${pi} style=${{ position: "relative" }}>
                        <img src=${photoUrl(p)} onClick=${() => setLightbox(photoUrl(p))} style=${{ width: 70, height: 70, objectFit: "cover", borderRadius: 4, border: `1px solid ${C.line}`, display: "block", cursor: "zoom-in" }} />
                        ${photoTime(p) && html`<div style=${{ fontSize: 9, color: C.slate, marginTop: 2, whiteSpace: "nowrap" }}>${fmtDateTime(photoTime(p))}</div>`}
                        <button onClick=${() => removeHomeworkPhoto(h.id, pi)} style=${{ position: "absolute", top: -6, right: -6, width: 18, height: 18, borderRadius: "50%", border: "none", background: C.danger, color: "#fff", fontSize: 10, cursor: "pointer", lineHeight: "18px", padding: 0 }}>✕</button>
                      </div>
                    `)}
                  </div>
                `}
                ${(h.audios || (h.audio ? [h.audio] : [])).map((a, ai) => html`<audio key=${ai} controls src=${a} style=${{ width: "100%", height: 32, marginTop: 8 }} />`)}
                ${h.expired
                  ? html`<div style=${{ display: "inline-flex", alignItems: "center", gap: 6, marginTop: 6, fontSize: 12, fontWeight: 700, color: C.danger }}>⏳ 기간만료 (미완료로 집계)</div>`
                  : html`<div onClick=${() => toggleDone(h.id)} style=${{ display: "inline-flex", alignItems: "center", gap: 6, marginTop: 6, cursor: "pointer", fontSize: 12, fontWeight: 600, color: h.done ? C.gold : C.slate }}>
                      ${h.done ? `✓ 완료함${h.doneAt ? ` (${fmtDateTime(h.doneAt)})` : ""} (누르면 미완료로)` : "완료로 표시하기"}
                    </div>`}
              </div>
              <div style=${{ display: "flex", gap: 10 }}>
                ${!h.done && html`<button onClick=${() => toggleExpired(h.id)} style=${{ background: "none", border: "none", color: h.expired ? C.gold : C.slate, cursor: "pointer", fontSize: 12 }}>${h.expired ? "기간만료 취소" : "기간만료로 표시"}</button>`}
                <button onClick=${() => startEdit(h)} style=${{ background: "none", border: "none", color: C.navy, cursor: "pointer", fontSize: 12 }}>수정</button>

              </div>

          `}
        <//>
          `)}
        </div>
      `)}
      ${lightbox && html`<${PhotoLightbox} src=${lightbox} onClose=${() => setLightbox(null)} />`}
    </div>

}

function VocabResultRow({ r, title, updateData }) {
  const [open, setOpen] = useState(false);
  const pct = Math.round((r.score / r.total) * 100);
  const ok = pct >= vocabPassThreshold(title);
  const hasBreakdown = Array.isArray(r.breakdown) && r.breakdown.length > 0;

  async function markCorrect(idx) {
    await updateData((d) => ({
      ...d,
      vocabResults: d.vocabResults.map((x) => {
        if (x.id !== r.id) return x;
        const breakdown = x.breakdown.map((row, i) => (i === idx ? { ...row, ok: true, manualOverride: true } : row));
        const score = breakdown.filter((row) => row.ok).length;
        return { ...x, breakdown, score };
      }),
    }));
  }

  return html`
    <div style=${{ marginBottom: 6, paddingBottom: 6, borderBottom: `1px solid ${C.line}` }}>
      <div style=${{ fontSize: 12.5, display: "flex", alignItems: "center", gap: 8, cursor: hasBreakdown ? "pointer" : "default" }} onClick=${() => hasBreakdown && setOpen((o) => !o)}>
        <span>${fmtDate(r.date)} 응시 — <b>${r.score}</b> / ${r.total} (${pct}%)</span>
        <span style=${{ fontSize: 10.5, fontWeight: 700, padding: "1px 7px", borderRadius: 20, background: ok ? "#E9F1EA" : "#F7E9E6", color: ok ? "#3D6B4F" : C.danger }}>${ok ? "합격" : "재시험 필요"}</span>
        ${hasBreakdown && html`<span style=${{ fontSize: 11, color: C.slate, marginLeft: "auto" }}>${open ? "▲ 답안 닫기" : "▼ 답안 보기"}</span>`}
      </div>
      ${open && hasBreakdown && html`
        <div style=${{ marginTop: 8, background: C.ivory, border: `1px solid ${C.line}`, borderRadius: 4, padding: 10 }}>
          ${r.breakdown.map((row, i) => html`
            <div key=${i} style=${{ padding: "6px 0", borderBottom: i < r.breakdown.length - 1 ? `1px dotted ${C.line}` : "none" }}>
              <div style=${{ fontSize: 12, fontWeight: 700, color: C.navy, whiteSpace: "pre-wrap" }}>${i + 1}. ${row.prompt}</div>
              <div style=${{ fontSize: 12, marginTop: 2, color: row.ok ? C.navy : C.danger }}>학생 답: ${row.given} ${row.ok ? "✓" : "✗"}${row.manualOverride ? " (선생님 확인 정답 처리)" : ""}</div>
              ${!row.ok && html`
                <div style=${{ display: "flex", alignItems: "center", gap: 8, marginTop: 3 }}>
                  <div style=${{ fontSize: 11.5, color: C.slate }}>정답: ${row.correct}</div>
                  <button onClick=${() => markCorrect(i)} style=${{ fontSize: 11, padding: "3px 9px", borderRadius: 20, border: `1px solid ${C.gold}`, background: "none", color: C.gold, cursor: "pointer" }}>맞는 걸로 처리</button>
                </div>
              `}
            </div>
          `)}
        </div>
      `}
    </div>
  `;
}

// Lets the teacher record when a specific vocab retest is actually scheduled to happen (e.g. a
// live call at a set time), separate from `date` (when the test was created). vocabRetestReminderCheck
// in functions/index.js polls every minute for retestDate/retestTime and pushes to both the
// student and the teacher 5 minutes before and again at the exact time.
function VocabRetestSchedule({ t, updateData }) {
  const [editing, setEditing] = useState(false);
  const [date, setDate] = useState(t.retestDate || "");
  const [time, setTime] = useState(t.retestTime || "15:00");
  async function save() {
    if (!date || !time) return; // required — every vocab test must carry a scheduled retest time
    await updateData((d) => ({ ...d, vocabTests: d.vocabTests.map((x) => (x.id === t.id ? { ...x, retestDate: date, retestTime: time } : x)) }));
    setEditing(false);
  }
  if (!editing) {
    return html`
      <div style=${{ fontSize: 11.5, color: C.slate, marginTop: 6 }}>
        ${t.retestDate ? `⏰ 재시험 예정: ${fmtDate(t.retestDate)} ${t.retestTime}` : "⚠️ 재시험 예정 시간 없음 (예전에 만든 재시험)"}
        <button onClick=${() => setEditing(true)} style=${{ background: "none", border: "none", color: C.gold, fontSize: 11, marginLeft: 8, cursor: "pointer", textDecoration: "underline" }}>${t.retestDate ? "수정" : "예정 시간 설정"}</button>
      </div>
    `;
  }
  return html`
    <div style=${{ display: "flex", gap: 6, alignItems: "center", marginTop: 6, flexWrap: "wrap" }}>
      <${DateField} value=${date} onChange=${setDate} />
      <${TimeField} value=${time} onChange=${setTime} />
      <button disabled=${!date || !time} onClick=${save} style=${{ background: "none", border: `1px solid ${C.gold}`, color: C.gold, fontSize: 11, padding: "4px 10px", borderRadius: 3, cursor: (!date || !time) ? "default" : "pointer", opacity: (!date || !time) ? 0.5 : 1 }}>저장</button>
      <button onClick=${() => setEditing(false)} style=${{ background: "none", border: "none", color: C.slate, fontSize: 11, cursor: "pointer" }}>취소</button>
    </div>
  `;
}

function VocabEditor({ student, data, updateData }) {
  const [creating, setCreating] = useState(false); const [title, setTitle] = useState("");
  const [mode, setMode] = useState("mix");
  const [retestDate, setRetestDate] = useState(""); const [retestTime, setRetestTime] = useState("15:00");
  const [words, setWords] = useState([{ word: "", meaning: "" }]);
  const [showPaste, setShowPaste] = useState(false); const [pasteText, setPasteText] = useState(""); const [pasteMsg, setPasteMsg] = useState("");
  const [showBank, setShowBank] = useState(false); const [bankBooks, setBankBooks] = useState(null);
  const [bankBookId, setBankBookId] = useState(""); const [bankFrom, setBankFrom] = useState(1); const [bankTo, setBankTo] = useState(1);
  const [bankCount, setBankCount] = useState("");
  const [bankMsg, setBankMsg] = useState("");

  function runParse() {
    const parsed = parseVocabPaste(pasteText);
    if (parsed.length === 0) { setPasteMsg("인식된 단어가 없어요. 형식을 확인해 주세요."); return; }
    setWords(parsed); setPasteMsg(`${parsed.length}개 단어를 불러왔어요. 아래에서 확인 후 저장하세요.`); setShowPaste(false); setPasteText("");
  }
  async function openBank() {
    setShowBank(true);
    if (bankBooks === null) {
      try {
        const ref = window.__doc(window.__db, "sarahsEnglishWordbank", "main");
        const snap = await window.__getDoc(ref);
        const rec = snap.exists() ? snap.data() : {};
        const books = Array.isArray(rec.books) ? rec.books : [];
        setBankBooks(books);
        if (books[0]) { setBankBookId(books[0].id); setBankTo(books[0].totalDays || 1); }
        if (books.length === 0) setBankMsg("워드뱅크에 등록된 교재가 없어요. 먼저 '단어 시험지 생성' 메뉴에서 교재와 단어를 등록해 주세요.");
      } catch (e) { setBankBooks([]); setBankMsg("워드뱅크를 불러오지 못했어요."); }
    }
  }
  function importFromBank() {
    const book = (bankBooks || []).find((b) => b.id === bankBookId);
    if (!book) return;
    const from = Math.max(1, Number(bankFrom) || 1);
    const to = Math.max(from, Math.min(book.totalDays || from, Number(bankTo) || from));
    let picked = [];
    for (let d = from; d <= to; d++) {
      const arr = (book.days || {})["day" + d] || [];
      picked = picked.concat(arr.map((w) => ({ word: w.en, meaning: w.ko })));
    }
    if (picked.length === 0) { setBankMsg("해당 범위에 저장된 단어가 없어요."); return; }
    // A wide Day range can pull in the same word twice if it appears in more than one Day's list
    // (review days re-including earlier words, a word entered under two Days by mistake, etc.) —
    // dedupe by the word itself so the same question never shows up twice in one retest.
    const seen = new Set();
    const deduped = picked.filter((w) => {
      const key = (w.word || "").trim().toLowerCase();
      if (!key || seen.has(key)) return false;
      seen.add(key);
      return true;
    });
    const dupCount = picked.length - deduped.length;
    picked = deduped;
    const n = Number(bankCount);
    if (n > 0 && n < picked.length) picked = shuffle(picked).slice(0, n);
    setWords(picked);
    setTitle((t) => t || `${book.name} Day ${from}-${to}`);
    setBankMsg(`${picked.length}개 단어를 불러왔어요${dupCount > 0 ? ` (중복 ${dupCount}개 제외)` : ""}. 아래에서 확인 후 저장하세요.`);
    setShowBank(false);
  }
  function setRow(i, key, val) { setWords((w) => w.map((row, idx) => (idx === i ? { ...row, [key]: val } : row))); }
  function addRow() { setWords((w) => [...w, { word: "", meaning: "" }]); }
  function removeRow(i) { setWords((w) => w.filter((_, idx) => idx !== i)); }
  async function save() {
    const raw = words.filter((w) => w.word && w.meaning).map((w) => ({
      word: w.word, meaning: w.meaning,
      synonyms: (w.synonyms || "").split(",").map((s) => s.trim()).filter(Boolean),
    }));
    // Final safety net regardless of how the words got here (bank import, paste, or typed in by
    // hand) — a saved test should never ask the same word twice.
    const seenWords = new Set();
    const clean = raw.filter((w) => {
      const key = w.word.trim().toLowerCase();
      if (seenWords.has(key)) return false;
      seenWords.add(key);
      return true;
    });
    if (!title || clean.length < 2 || !retestDate || !retestTime) return;
    await updateData((d) => ({ ...d, vocabTests: [{ id: uid(), title, date: today(), words: clean, mode, retestDate, retestTime }, ...d.vocabTests] }));
    notifyStudent(student.studentFcmToken, "vocab_test_assigned", title);
    setTitle(""); setWords([{ word: "", meaning: "" }]); setMode("mix"); setRetestDate(""); setRetestTime("15:00"); setCreating(false);
  }
  async function removeTest(id) { await updateData((d) => ({ ...d, vocabTests: d.vocabTests.filter((t) => t.id !== id) })); }

  return html`
    <div>
      ${!creating ? html`
        <${Button} variant="ghost" onClick=${() => setCreating(true)} style=${{ width: "100%", justifyContent: "center", marginBottom: 12 }}>+ 새 단어 시험 만들기<//>
      ` : html`
        <${Card}>
          <${Field} label="시험 이름"><input style=${inputStyle} value=${title} onChange=${(e) => setTitle(e.target.value)} placeholder="예: Unit 5 단어 시험" /><//>
          <${Field} label="출제 방식">
            <div style=${{ display: "flex", gap: 8 }}>
              ${[["mix", "혼합 (영↔한 랜덤)"], ["w2m", "영단어 → 뜻만"], ["m2w", "뜻 → 영단어만"]].map(([val, label]) => html`
                <div key=${val} onClick=${() => setMode(val)} style=${{
                  flex: 1, textAlign: "center", padding: "9px 4px", borderRadius: 3, cursor: "pointer", fontSize: 12.5,
                  border: `1px solid ${mode === val ? C.gold : C.line}`, background: mode === val ? "#FBF6EA" : C.white,
                  fontWeight: mode === val ? 700 : 400, color: mode === val ? C.navy : C.slate,
                }}>${label}</div>
              `)}
            </div>
          <//>
          <${Field} label="재시험 예정 시간 (필수 — 5분 전·정각에 학생/선생님께 알림이 가요)">
            <div style=${{ display: "flex", gap: 8 }}>
              <div style=${{ flex: 1 }}><${DateField} value=${retestDate} onChange=${setRetestDate} /></div>
              <${TimeField} value=${retestTime} onChange=${setRetestTime} />
            </div>
          <//>
          <div style=${{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <${Button} variant="ghost" onClick=${() => setShowPaste(true)} style=${{ marginBottom: 12 }}>붙여넣기로 한번에 가져오기<//>
            <${Button} variant="ghost" onClick=${openBank} style=${{ marginBottom: 12 }}>📚 워드뱅크에서 가져오기<//>
          </div>
          ${showPaste && html`
            <${Card} style=${{ background: C.ivory }}>
              <div style=${{ fontSize: 12, color: C.slate, marginBottom: 6 }}>한 줄에 단어 하나씩, "단어 - 뜻" 형식으로 붙여넣어 주세요. 뜻이 여러 개면 콤마(,)나 세미콜론(;)으로 이어서 써도 돼요.</div>
              <textarea style=${{ ...inputStyle, minHeight: 110, fontFamily: "monospace", fontSize: 12.5 }} placeholder=${"apple - 사과\nhesitate - 주저하다, 망설이다"} value=${pasteText} onChange=${(e) => setPasteText(e.target.value)} />
              <div style=${{ display: "flex", gap: 8, marginTop: 8 }}>
                <${Button} variant="gold" onClick=${runParse}>가져오기<//>
                <${Button} variant="ghost" onClick=${() => setShowPaste(false)}>취소<//>
              </div>
            <//>
          `}
          ${showBank && html`
            <${Card} style=${{ background: C.ivory }}>
              ${bankBooks === null ? html`<div style=${{ fontSize: 12.5, color: C.slate }}>불러오는 중...</div>` : bankBooks.length === 0 ? html`<div style=${{ fontSize: 12.5, color: C.slate }}>${bankMsg}</div>` : html`
                <${Field} label="교재">
                  <select style=${inputStyle} value=${bankBookId} onChange=${(e) => { setBankBookId(e.target.value); const b = bankBooks.find((x) => x.id === e.target.value); setBankFrom(1); setBankTo(b ? b.totalDays : 1); }}>
                    ${bankBooks.map((b) => html`<option key=${b.id} value=${b.id}>${b.name}</option>`)}
                  </select>
                <//>
                <div style=${{ display: "flex", gap: 8 }}>
                  <div style=${{ flex: 1 }}><${Field} label="시작 Day"><input style=${inputStyle} type="number" min="1" value=${bankFrom} onChange=${(e) => setBankFrom(e.target.value)} /><//></div>
                  <div style=${{ flex: 1 }}><${Field} label="끝 Day"><input style=${inputStyle} type="number" min="1" value=${bankTo} onChange=${(e) => setBankTo(e.target.value)} /><//></div>
                </div>
                <${Field} label="출제 문항 수 (비워두면 범위의 전체 단어)"><input style=${inputStyle} type="number" min="1" value=${bankCount} onChange=${(e) => setBankCount(e.target.value)} placeholder="예: 20" /><//>

function ExamEditor({ data, updateData }) {
  const [creating, setCreating] = useState(false); const [title, setTitle] = useState("");
  const [questions, setQuestions] = useState([{ q: "", choices: ["", ""], answer: 0 }]);
  const [showPaste, setShowPaste] = useState(false); const [pasteText, setPasteText] = useState(""); const [pasteMsg, setPasteMsg] = useState("");

  function runParse() {
    const parsed = parseExamPaste(pasteText);
    if (parsed.length === 0) { setPasteMsg("인식된 문제가 없어요. 형식을 확인해 주세요."); return; }
    setQuestions(parsed); setPasteMsg(`${parsed.length}개 문제를 불러왔어요. 아래에서 확인 후 저장하세요.`); setShowPaste(false); setPasteText("");
  }
  function setQ(i, val) { setQuestions((qs) => qs.map((row, idx) => (idx === i ? { ...row, q: val } : row))); }
  function setChoice(qi, ci, val) { setQuestions((qs) => qs.map((row, idx) => (idx === qi ? { ...row, choices: row.choices.map((c, cidx) => (cidx === ci ? val : c)) } : row))); }
  function setAnswer(qi, ci) { setQuestions((qs) => qs.map((row, idx) => (idx === qi ? { ...row, answer: ci } : row))); }
  function addChoice(qi) { setQuestions((qs) => qs.map((row, idx) => (idx === qi ? { ...row, choices: [...row.choices, ""] } : row))); }
  function removeChoice(qi, ci) { setQuestions((qs) => qs.map((row, idx) => (idx === qi ? { ...row, choices: row.choices.filter((_, cidx) => cidx !== ci), answer: row.answer === ci ? 0 : row.answer > ci ? row.answer - 1 : row.answer } : row))); }
  function addQuestion() { setQuestions((qs) => [...qs, { q: "", choices: ["", ""], answer: 0 }]); }
  function removeQuestion(i) { setQuestions((qs) => qs.filter((_, idx) => idx !== i)); }
  async function save() {
    const clean = questions.filter((q) => q.q && q.choices.every((c) => c) && q.choices.length >= 2);
    if (!title || clean.length === 0) return;
    await updateData((d) => ({ ...d, examTests: [{ id: uid(), title, date: today(), questions: clean }, ...d.examTests] }));
    setTitle(""); setQuestions([{ q: "", choices: ["", ""], answer: 0 }]); setCreating(false);
  }
  async function removeTest(id) { await updateData((d) => ({ ...d, examTests: d.examTests.filter((t) => t.id !== id) })); }

  return html`
    <div>
      ${!creating ? html`
        <${Button} variant="ghost" onClick=${() => setCreating(true)} style=${{ width: "100%", justifyContent: "center", marginBottom: 12 }}>+ 새 추가 시험 만들기<//>
      ` : html`
        <${Card}>
          <${Field} label="시험 이름"><input style=${inputStyle} value=${title} onChange=${(e) => setTitle(e.target.value)} placeholder="예: 관계대명사 추가 문제" /><//>
          ${!showPaste ? html`
            <${Button} variant="ghost" onClick=${() => setShowPaste(true)} style=${{ marginBottom: 12 }}>붙여넣기로 한번에 가져오기<//>
          ` : html`
            <${Card} style=${{ background: C.ivory }}>
              <div style=${{ fontSize: 12, color: C.slate, marginBottom: 6 }}>문제 사이는 빈 줄로 구분해 주세요.</div>
              <textarea style=${{ ...inputStyle, minHeight: 160, fontFamily: "monospace", fontSize: 12, whiteSpace: "pre" }}
                placeholder=${"1. 다음 중 관계대명사가 알맞은 것은?\n1) who\n2) which\n3) that\n4) whose\n정답: 1"}
                value=${pasteText} onChange=${(e) => setPasteText(e.target.value)} />
              <div style=${{ display: "flex", gap: 8, marginTop: 8 }}>
                <${Button} variant="gold" onClick=${runParse}>가져오기<//>
                <${Button} variant="ghost" onClick=${() => setShowPaste(false)}>취소<//>
              </div>
            <//>
          `}
          ${pasteMsg && html`<div style=${{ fontSize: 12, color: C.navy, marginBottom: 10 }}>${pasteMsg}</div>`}
          ${questions.map((q, qi) => html`
            <div key=${qi} style=${{ border: `1px solid ${C.line}`, borderRadius: 4, padding: 10, marginBottom: 10 }}>
              <div style=${{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                <div style=${{ fontSize: 12, color: C.gold, fontWeight: 700 }}>문제 ${qi + 1}</div>
                ${questions.length > 1 && html`<button onClick=${() => removeQuestion(qi)} style=${{ background: "none", border: "none", color: C.slate, cursor: "pointer" }}>✕</button>`}
              </div>
              <textarea style=${{ ...inputStyle, minHeight: 50, marginBottom: 8 }} placeholder="문제 내용" value=${q.q} onChange=${(e) => setQ(qi, e.target.value)} />
              ${q.choices.map((c, ci) => html`
                <div key=${ci} style=${{ display: "flex", gap: 6, alignItems: "center", marginBottom: 5 }}>
                  <input type="radio" checked=${q.answer === ci} onChange=${() => setAnswer(qi, ci)} />
                  <input style=${{ ...inputStyle, flex: 1 }} placeholder=${`보기 ${ci + 1}`} value=${c} onChange=${(e) => setChoice(qi, ci, e.target.value)} />
                  ${q.choices.length > 2 && html`<button onClick=${() => removeChoice(qi, ci)} style=${{ background: "none", border: "none", color: C.slate, cursor: "pointer" }}>✕</button>`}
                </div>
              `)}
              <button onClick=${() => addChoice(qi)} style=${{ background: "none", border: "none", color: C.navy, fontSize: 12, cursor: "pointer", padding: 0, marginTop: 4 }}>+ 보기 추가</button>
              <div style=${{ fontSize: 11, color: C.slate, marginTop: 4 }}>라디오 버튼으로 정답을 표시하세요.</div>
            </div>
          `)}
          <${Button} variant="ghost" onClick=${addQuestion} style=${{ marginBottom: 12 }}>+ 문제 추가<//>
          <div style=${{ display: "flex", gap: 8 }}>
            <${Button} variant="gold" onClick=${save}>저장<//>
            <${Button} variant="ghost" onClick=${() => setCreating(false)}>취소<//>
          </div>
        <//>
      `}
      <${SectionLabel} n=${2} label="등록된 시험" />
      ${data.examTests.length === 0 && html`<${Empty} text="아직 만든 시험이 없어요." />`}
      ${data.examTests.map((t) => {
        const results = data.examResults.filter((r) => r.testId === t.id);
        return html`
          <${Card} key=${t.id}>
            <div style=${{ display: "flex", justifyContent: "space-between" }}>
              <div>
                <div style=${{ fontWeight: 700, color: C.navy }}>${t.title}</div>
                <div style=${{ fontSize: 11.5, color: C.slate, marginTop: 2 }}>${fmtDate(t.date)} · 문제 ${t.questions.length}개</div>
              </div>
              <button onClick=${() => removeTest(t.id)} style=${{ background: "none", border: "none", color: C.slate, cursor: "pointer" }}>✕</button>
            </div>
            ${results.length === 0 ? html`<div style=${{ fontSize: 12, color: C.slate, marginTop: 8 }}>아직 응시하지 않았어요.</div>` : html`
              <div style=${{ marginTop: 8, borderTop: `1px solid ${C.line}`, paddingTop: 8 }}>
                ${results.map((r) => html`<div key=${r.id} style=${{ fontSize: 12.5, marginBottom: 3 }}>${fmtDate(r.date)} 응시 — <b>${r.score}</b> / ${r.total}</div>`)}
              </div>
            `}
          <//>
        `;
      })}
    </div>
  `;
}

// ---------- Mock exam (모의고사): answer-key only, auto-graded ----------
// Teacher-facing per-question breakdown for one mock exam submission — score alone doesn't tell
// the teacher WHAT a student actually answered, only how many were wrong. Reads r.answers (added
// alongside the student edit-answers feature); older results saved before that field existed just
// show the score line with no expand affordance, same as before.
function MockResultRow({ r, answerKey }) {
  const [open, setOpen] = useState(false);
  const hasAnswers = Array.isArray(r.answers) && r.answers.length === answerKey.length;
  return html`
    <div style=${{ marginBottom: 6 }}>
      <div style=${{ fontSize: 12.5, display: "flex", alignItems: "center", gap: 8 }}>
        <span>${fmtDate(r.date)} 응시 — <b>${r.score}</b> / ${r.total}${r.editedAt ? " (수정됨)" : ""}${r.wrong && r.wrong.length > 0 ? ` (틀린 문제: ${r.wrong.join(", ")})` : ""}</span>
        ${hasAnswers && html`<button onClick=${() => setOpen((o) => !o)} style=${{ background: "none", border: "none", color: C.gold, fontSize: 11, cursor: "pointer", textDecoration: "underline" }}>${open ? "답 접기" : "답 보기"}</button>`}
      </div>
      ${open && hasAnswers && html`
        <div style=${{ display: "flex", flexWrap: "wrap", gap: 4, marginTop: 6, background: C.ivory, padding: 8, borderRadius: 4 }}>
          ${answerKey.map((correct, i) => {
            const mine = r.answers[i];
            const isWrong = normText(mine) !== normText(String(correct));
            return html`
              <div key=${i} style=${{ width: 46, textAlign: "center", fontSize: 10.5, padding: "3px 2px", borderRadius: 3, background: isWrong ? "#F7E9E6" : "#E9F1EA", color: isWrong ? C.danger : "#3D6B4F" }}>
                <div style=${{ fontWeight: 700 }}>${i + 1}</div>
                <div>${mine || "-"}${isWrong ? html`<span style=${{ color: C.slate }}> (${correct})</span>` : ""}</div>
              </div>
            `;
          })}
        </div>
      `}
    </div>
  `;
}

// Same numbered-box-per-question layout MockExamTaker gives students, instead of one flat
// comma-separated string — the teacher kept losing track of which number was which question's
// answer in a long "2,3,1,4,5,2,1,3,4,5" blob. Answers are held as an array (one string per
// question) so the box grid can render directly off it.
function AnswerKeyBoxes({ answers, onChangeCount, onChangeAt }) {
  return html`
    <div>
      <${Field} label="문항 수">

function MockExamEditor({ student, data, updateData, examKeyLibrary }) {

  const [title, setTitle] = useState(""); const [date, setDate] = useState(today()); const [pageRange, setPageRange] = useState(""); const [keyAnswers, setKeyAnswers] = useState([]);
  const [pickId, setPickId] = useState("");
  const [msg, setMsg] = useState("");
  const [editId, setEditId] = useState(null);
  const [editTitle, setEditTitle] = useState(""); const [editDate, setEditDate] = useState(""); const [editPageRange, setEditPageRange] = useState(""); const [editKeyAnswers, setEditKeyAnswers] = useState([]);
  const [editMsg, setEditMsg] = useState("");

  const [rangeFrom, setRangeFrom] = useState("");
  const [rangeTo, setRangeTo] = useState("");
  const pickedSet = (examKeyLibrary || []).find((x) => x.id === pickId);

  function resizeAnswers(setter) {
    return (n) => {
      const count = Math.max(0, Math.min(200, Number(n) || 0));
      setter((prev) => {
        const next = prev.slice(0, count);
        while (next.length < count) next.push("");
        return next;
      });
    };
  }
  const setKeyCount = resizeAnswers(setKeyAnswers);
  const setEditKeyCount = resizeAnswers(setEditKeyAnswers);
  function setKeyAt(i, val) { setKeyAnswers((prev) => prev.map((v, idx) => (idx === i ? val : v))); }
  function setEditKeyAt(i, val) { setEditKeyAnswers((prev) => prev.map((v, idx) => (idx === i ? val : v))); }

  function pickFromLibrary(id) {
    setPickId(id);
    const s = (examKeyLibrary || []).find((x) => x.id === id);
    if (s) {
      setRangeFrom("1"); setRangeTo(String(s.answers.length));

  function applyRange() {

  async function save() {
    const key = keyAnswers.map((s) => Number(s)).filter((n) => !isNaN(n));

function MockExamTaker({ test, onExit, onSubmit, initialAnswers, editMode }) {
  const total = test.answerKey.length;
  const [answers, setAnswers] = useState(initialAnswers && initialAnswers.length === total ? initialAnswers : Array(total).fill(""));
  const [submitted, setSubmitted] = useState(false);
  const [result, setResult] = useState(null);
  const [wrong, setWrong] = useState([]);

  function pick(i, val) { if (submitted) return; setAnswers((a) => a.map((v, idx) => (idx === i ? val : v))); }

  function submit() {
    let score = 0; const wrongNums = [];
    test.answerKey.forEach((correct, i) => {
      if (normText(answers[i]) === normText(correct) && normText(answers[i]).length > 0) score++;
      else wrongNums.push(i + 1);
    });
    setResult(score); setWrong(wrongNums); setSubmitted(true);
  }

  if (submitted) {
    return html`
      <div>
        <${Card} style=${{ textAlign: "center", padding: 28 }}>
          <div style=${{ ...serif, fontSize: 20, color: C.navy, marginBottom: 8 }}>${test.title}</div>
          <div style=${{ fontSize: 12, color: C.slate, marginBottom: 16 }}>채점 결과</div>
          <div style=${{ fontSize: 34, ...serif, color: C.gold }}>${result} <span style=${{ fontSize: 18, color: C.slate }}>/ ${total}</span></div>
          ${wrong.length > 0 && html`<div style=${{ fontSize: 13, color: C.danger, marginTop: 10 }}>틀린 문제: ${wrong.join(", ")}번</div>`}
        <//>
        <${Button} variant="gold" style=${{ width: "100%", justifyContent: "center" }} onClick=${() => onSubmit(result, total, wrong, answers)}>결과 저장하고 나가기<//>
      </div>
    `;
  }

  return html`
    <div>
      <${BackBtn} onClick=${onExit} />
      <div style=${{ ...serif, fontSize: 18, color: C.navy, marginBottom: 2 }}>${test.title}${editMode && html` <span style=${{ fontSize: 12, color: C.gold, fontWeight: 700 }}>(답 수정 중)</span>`}</div>
      ${test.pageRange && html`<div style=${{ fontSize: 12.5, color: C.slate, marginBottom: 12 }}>${test.pageRange}</div>`}
      ${editMode && html`<div style=${{ fontSize: 11.5, color: C.slate, marginBottom: 10 }}>직전 제출 답이 미리 채워져 있어요. 틀리게 입력한 답만 고치고 다시 제출하면 돼요.</div>`}
      <${Card}>
        <div style=${{ display: "flex", flexWrap: "wrap", gap: 10 }}>
          ${test.answerKey.map((_, i) => html`
            <div key=${i} style=${{ width: 62 }}>
              <div style=${{ fontSize: 11, color: C.gold, fontWeight: 700, marginBottom: 3, textAlign: "center" }}>${i + 1}</div>
              <input style=${{ ...inputStyle, padding: "8px 6px", textAlign: "center" }} inputMode="numeric" pattern="[0-9]*" value=${answers[i]} onChange=${(e) => pick(i, e.target.value.replace(/[^0-9]/g, ""))} />
            </div>
          `)}
        </div>
      <//>
      <${Button} variant="gold" style=${{ width: "100%", justifyContent: "center" }} disabled=${answers.some((a) => !a.trim())} onClick=${submit}>제출하기<//>
    </div>
  `;
}

// Icon-grid actions shown on the student home screen (instead of a pill-style tab bar) — clicking
// one sets `tab` and switches to that section's full-screen view with a back button, closer to a
// phone app's home screen than a desktop-style tab strip.
const STUDENT_HOME_ACTIONS = [
  { key: "homework", label: "숙제 제출", icon: "📝", bg: "#FBF4EA" },
  { key: "vocab", label: "단어 시험", icon: "🔤", bg: "#EAF1FB" },
  { key: "materials", label: "자료실", icon: "📁", bg: "#F3EDF7" },
  { key: "mock", label: "모의고사 채점", icon: "📄", bg: "#E9F1EA" },
  { key: "schedule", label: "이번달 시간표", icon: "🗓", bg: "#FDEDE9" },
  { key: "studyTimer", label: "공부 시간 기록", icon: "⏱", bg: "#EAF6F6" },
];

function StudentDash({ student, updateStudentRosterEntry, ensureData, updateData, dataCache, onLogout }) {
  const [tab, setTab] = useState(null); // null = home (icon grid); otherwise one of STUDENT_HOME_ACTIONS' keys
  const [data, setData] = useState(null);
  const [activeTest, setActiveTest] = useState(null);
  const [activeMock, setActiveMock] = useState(null);
  const [editingMockResultId, setEditingMockResultId] = useState(null); // non-null when re-submitting overwrites this result instead of adding a new one
  const [timerRunning, setTimerRunning] = useState(false);
  const [timerStart, setTimerStart] = useState(null);
  const [elapsedSec, setElapsedSec] = useState(0);
  const [studySubject, setStudySubject] = useState("");
  const [studyContent, setStudyContent] = useState("");
  const [resumedFromSession, setResumedFromSession] = useState(false);

  useEffect(() => { (async () => { const d = await ensureData(student.id); setData(d); })(); }, [student.id]);
  useEffect(() => { if (dataCache[student.id]) setData(dataCache[student.id]); }, [dataCache, student.id]);
  useEffect(() => {
    if (!timerRunning) return;
    const iv = setInterval(() => { setElapsedSec(Math.floor((Date.now() - timerStart) / 1000)); }, 1000);
    return () => clearInterval(iv);
  }, [timerRunning, timerStart]);
  // 페이지를 나갔다 와도(새로고침 포함) 진행 중이던/일시정지된 타이머가 그대로 이어지도록, 시작 시각과 실행 여부를 저장해두고 여기서 복원
  useEffect(() => {
    if (data && data.activeStudySession && !resumedFromSession) {
      const s = data.activeStudySession;
      setStudySubject(s.subject || "");
      setStudyContent(s.content || "");
      if (s.running) {
        setTimerStart(s.startedAt);
        setElapsedSec(Math.floor((Date.now() - s.startedAt) / 1000));
        setTimerRunning(true);
      } else {
        setElapsedSec(s.frozenElapsedSec || 0);
        setTimerRunning(false);
      }
      setResumedFromSession(true);
    }
  }, [data]);

  if (!data) return html`<${Empty} text="불러오는 중..." />`;

  if (activeMock) {
    const editingResult = editingMockResultId ? (data.mockExamResults || []).find((r) => r.id === editingMockResultId) : null;
    return html`<${MockExamTaker} test=${activeMock} onExit=${() => { setActiveMock(null); setEditingMockResultId(null); }}
      editMode=${!!editingResult} initialAnswers=${editingResult?.answers}
      onSubmit=${async (score, total, wrong, answers) => {
        const save = () => updateData(student.id, (d) => ({
          ...d,
          mockExamResults: editingResult
            ? (d.mockExamResults || []).map((r) => (r.id === editingMockResultId ? { ...r, score, total, wrong, answers, editedAt: Date.now() } : r))
            : [{ id: uid(), testId: activeMock.id, date: today(), score, total, wrong, answers }, ...(d.mockExamResults || [])],
        }));
        try {
          await save();
          notifyTeacher(student.name, "mock_exam_submit", editingResult ? `${score}/${total}점 (수정)` : `${score}/${total}점`);
        } catch (e) {
          console.error("결과 저장 실패", e);
          let recovered = false;
          if (isDocSizeError(e)) recovered = await attemptAutoShrinkAndRetry(student.id, updateData, save);
          if (!recovered) alert(friendlyErrorMessage(e));
        }
        setActiveMock(null); setEditingMockResultId(null);
      }} />`;
  }

  if (activeTest) {
    return html`<${TestTaker} activeTest=${activeTest} onExit=${() => setActiveTest(null)}
      onSubmit=${async (score, total, breakdown) => {
        const save = () => activeTest.type === "vocab"
          ? updateData(student.id, (d) => ({ ...d, vocabResults: [{ id: uid(), testId: activeTest.test.id, date: today(), score, total, breakdown }, ...d.vocabResults] }))
          : updateData(student.id, (d) => ({ ...d, examResults: [{ id: uid(), testId: activeTest.test.id, date: today(), score, total, breakdown }, ...d.examResults] }));
        try {
          await save();
        } catch (e) {
          console.error("결과 저장 실패", e);
          let recovered = false;
          if (isDocSizeError(e)) recovered = await attemptAutoShrinkAndRetry(student.id, updateData, save);
          if (!recovered) alert(friendlyErrorMessage(e));
        }

const WEEKDAY_NAMES = ["일", "월", "화", "수", "목", "금", "토"];

// Tuition is billed upfront (prepaid), so the amount is however many sessions the calendar
// says are planned for the month — the recurring pattern minus any exceptions, plus makeup
// instances — not a count of sessions that have actually happened yet.
function countPlannedSessions(schedule, monthlyInstances, tutoringExceptions, viewMonth) {
  const [y, m] = viewMonth.split("-").map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  let count = 0;
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${viewMonth}-${String(d).padStart(2, "0")}`;
    const dayName = WEEKDAY_NAMES[new Date(y, m - 1, d).getDay()];
    if ((schedule || []).some((s) => s.day === dayName) && !(tutoringExceptions || []).includes(dateStr)) count++;
  }
  count += ((monthlyInstances || {})[viewMonth] || []).length;
  return count;
}

// Combined monthly calendar of three schedule sources that live in different places and are
// edited by different people:
//  - tutoring: student.schedule — teacher-owned, day-of-week recurring pattern, so it repeats on
//    every matching weekday across the whole month, week to week.
//  - monthlyInstances: student.monthlyInstances[month] — teacher-owned, specific-date one-offs
//    that don't fit the weekly pattern; shown only on the exact date set. Each instance carries its
//    own `type` ("tutoring" 과외 or "makeup" 보강, defaulting to "makeup" for legacy entries saved
//    before this field existed) so a shifted-time regular class and an actual makeup class can be
//    told apart in the calendar.
//  - other: student.otherSchedule — student-owned, day-of-week recurring "other academies", same
//    repeat-every-week behavior as tutoring.
// tutoringExceptions/otherExceptions hold specific dates ("YYYY-MM-DD") where a recurring
// weekly-pattern item should be skipped that one time — e.g. cancelled for a holiday — without
// touching the pattern itself. onRemoveTutoring/onRemoveOther, when passed, add that date to the
// relevant exceptions list; only the entry that owns a given source can remove its occurrences
// (the teacher's view passes onRemoveTutoring, the student's view passes onRemoveOther).
// viewMonth/onMonthChange make this a controlled component when the caller needs to know which
// month is on screen (e.g. tuition calc must match the visible month); uncontrolled (own internal
// month state) otherwise, which is all the schedule-only call sites need.
function MonthlyScheduleGrid({ tutoring, monthlyInstances, other, tutoringExceptions, otherExceptions, onRemoveTutoring, onRemoveOther, onSelectTutoring, viewMonth: viewMonthProp, onMonthChange }) {
  const [internalMonth, setInternalMonth] = useState(today().slice(0, 7));
  const viewMonth = viewMonthProp || internalMonth;
  const setViewMonth = onMonthChange || setInternalMonth;
  const [y, m] = viewMonth.split("-").map(Number);
  const startWeekday = new Date(y, m - 1, 1).getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const monthly = (monthlyInstances || {})[viewMonth] || [];
  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  function itemsForDay(d) {
    const dateStr = `${viewMonth}-${String(d).padStart(2, "0")}`;
    const dayName = WEEKDAY_NAMES[new Date(y, m - 1, d).getDay()];
    return [
      ...(tutoring || []).map((s, idx) => ({ ...s, _idx: idx })).filter((s) => s.day === dayName && !(tutoringExceptions || []).includes(dateStr)).map((s) => ({ ...s, source: "tutoring", label: "영어과외" })),
      ...monthly.filter((s) => s.date === dateStr).map((s) => ({ ...s, source: "monthly", label: s.type === "tutoring" ? "영어과외" : "영어보강" })),
      ...(other || []).filter((s) => s.day === dayName && !(otherExceptions || []).includes(dateStr)).map((s) => ({ ...s, source: "other", label: s.name || "학원" })),
    ].sort((a, b) => a.time.localeCompare(b.time)).map((it) => ({ ...it, dateStr }));
  }

  function shiftMonth(delta) {
    const dt = new Date(y, m - 1 + delta, 1);
    setViewMonth(`${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}`);
  }

  return html`
    <div>
      <div style=${{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
        <button type="button" onClick=${() => shiftMonth(-1)} style=${{ background: "none", border: "none", color: C.navy, cursor: "pointer", fontSize: 15, padding: "2px 8px" }}>‹</button>
        <div style=${{ ...serif, fontSize: 13.5, color: C.navy, fontWeight: 700 }}>${y}년 ${m}월</div>
        <button type="button" onClick=${() => shiftMonth(1)} style=${{ background: "none", border: "none", color: C.navy, cursor: "pointer", fontSize: 15, padding: "2px 8px" }}>›</button>
      </div>
      <div style=${{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 3, marginBottom: 3 }}>
        ${WEEKDAY_NAMES.map((w, i) => html`<div key=${i} style=${{ textAlign: "center", fontSize: 10, color: C.slate, fontWeight: 700 }}>${w}</div>`)}
      </div>
      <div style=${{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 3 }}>
        ${cells.map((d, i) => {
          if (d === null) return html`<div key=${i}></div>`;
          const items = itemsForDay(d);
          const isToday = `${viewMonth}-${String(d).padStart(2, "0")}` === today();
          return html`
            <div key=${i} style=${{ border: `1px solid ${isToday ? C.gold : C.line}`, borderRadius: 4, padding: 3, minHeight: 54 }}>
              <div style=${{ fontSize: 10, color: isToday ? C.gold : C.slate, fontWeight: isToday ? 700 : 400, marginBottom: 2 }}>${d}</div>
              ${items.map((it, ii) => {
                const canRemove = (it.source === "tutoring" && onRemoveTutoring) || (it.source === "other" && onRemoveOther);
                const canSelect = it.source === "tutoring" && onSelectTutoring;
                return html`
                  <div key=${ii} onClick=${canSelect ? () => onSelectTutoring(it._idx) : undefined}
                    title=${canSelect ? "눌러서 이 수업 시간 수정" : undefined}
                    style=${{ position: "relative", fontSize: 9, padding: "1px 3px", marginBottom: 2, borderRadius: 2, background: it.source === "other" ? "#EEF2F6" : "#FBF4EA", color: it.source === "other" ? C.ink : C.gold, fontWeight: it.source === "other" ? 500 : 700, cursor: canSelect ? "pointer" : undefined }}>
                    ${it.time}${it.endTime ? `~${it.endTime}` : ""} ${it.label}
                    ${canRemove && html`
                      <span onClick=${(e) => { if (canSelect) e.stopPropagation(); (it.source === "tutoring" ? onRemoveTutoring : onRemoveOther)(it.dateStr); }}
                        title="이 날짜만 삭제" style=${{ position: "absolute", top: -3, right: -3, width: 10, height: 10, lineHeight: "10px", textAlign: "center", borderRadius: "50%", background: C.danger, color: "#fff", fontSize: 8, cursor: "pointer" }}>×</span>
                    `}
                  </div>
                `;
              })}
            </div>
          `;
        })}
      </div>
    </div>
  `;
}

function TuitionEditor({ student, data, updateData }) {
  const [viewMonth, setViewMonth] = useState(today().slice(0, 7));
  const [rate, setRate] = useState(data.hourlyRate ?? "");
  const [hours, setHours] = useState(data.sessionHours ?? "");
  const [note, setNote] = useState("");
  const [managementFee, setManagementFee] = useState("");
  const [overrideAmount, setOverrideAmount] = useState("");
  const [savedMsg, setSavedMsg] = useState("");

  useEffect(() => { setRate(data.hourlyRate ?? ""); setHours(data.sessionHours ?? ""); }, [student.id]);
  useEffect(() => {
    const rec = (data.tuitionRecords || {})[viewMonth];
    setNote(rec?.note || "");
    setManagementFee(rec?.managementFee ? String(rec.managementFee) : "");
    setOverrideAmount(rec?.overrideAmount != null ? String(rec.overrideAmount) : "");
  }, [viewMonth, student.id]);

  async function saveRate() {
    await updateData((d) => ({ ...d, hourlyRate: Number(rate) || 0, sessionHours: Number(hours) || 0 }));
    setSavedMsg("저장됐어요."); setTimeout(() => setSavedMsg(""), 2000);
  }

  const plannedCount = countPlannedSessions(student.schedule, student.monthlyInstances, student.tutoringExceptions, viewMonth);
  const calculated = plannedCount * (Number(data.sessionHours) || 0) * (Number(data.hourlyRate) || 0);
  const managementFeeNum = Number(managementFee) || 0;
  const subtotal = calculated + managementFeeNum;
  const rec = (data.tuitionRecords || {})[viewMonth];
  const finalAmount = overrideAmount !== "" ? Number(overrideAmount) : subtotal;

  async function saveRecord(publishOverride) {
    const published = publishOverride !== undefined ? publishOverride : (rec?.published || false);
    await updateData((d) => ({
      ...d,
      tuitionRecords: {
        ...(d.tuitionRecords || {}),
        [viewMonth]: {
          plannedCount, hourlyRate: d.hourlyRate || 0, sessionHours: d.sessionHours || 0,
          calculatedAmount: calculated,
          managementFee: managementFeeNum,
          overrideAmount: overrideAmount !== "" ? Number(overrideAmount) : null,
          note: note.trim(),
          amount: finalAmount,
          published,
          paid: rec?.paid || false,
          paidAt: rec?.paidAt || null,
          updatedAt: Date.now(),
        },
      },
    }));
    setSavedMsg("저장됐어요."); setTimeout(() => setSavedMsg(""), 2000);
  }

  // Separate from saveRecord — a pure payment-received flag, so marking it doesn't require
  // re-touching (or accidentally changing) the amount/publish state, and doesn't feed into that
  // calculation at all (still schedule-based, same reasoning as attendance being kept out of it).
  async function togglePaid() {
    const next = !rec.paid;
    await updateData((d) => ({
      ...d,
      tuitionRecords: { ...(d.tuitionRecords || {}), [viewMonth]: { ...(d.tuitionRecords || {})[viewMonth], paid: next, paidAt: next ? Date.now() : null } },
    }));
  }

  function printInvoice() {
    const [y, m] = viewMonth.split("-");
    const html_ = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>수업료 명세서</title>
      <style>
        @page { size: A4; margin: 24mm 20mm; }
        body{font-family:'Noto Sans KR', sans-serif; color:#1B2A3D; margin:0;}
        .hd{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #C7A34E;padding-bottom:12px;margin-bottom:20px;}
        .hd .brand{font-size:16px;font-weight:700;color:#1C2B4A;}

        .logowrap{text-align:center;margin-bottom:14px;}
        .logowrap img{height:56px;width:auto;}

const OTHER_SCHEDULE_PRESETS = ["수학학원", "국어학원", "과학학원"];

function StudentScheduleEditor({ student, updateStudentRosterEntry }) {
  const [items, setItems] = useState(student.otherSchedule || []);
  const [saved, setSaved] = useState(false);
  useEffect(() => { setItems(student.otherSchedule || []); setSaved(false); }, [student.id]);

  function addSlot() { setItems([...items, { day: "월", time: "18:00", name: "수학학원" }]); setSaved(false); }
  function updateSlot(i, field, val) { setItems(items.map((d, idx) => (idx === i ? { ...d, [field]: val } : d))); setSaved(false); }
  function removeSlot(i) { setItems(items.filter((_, idx) => idx !== i)); setSaved(false); }

  async function save() {
    await updateStudentRosterEntry(student.id, (r) => ({ ...r, otherSchedule: items }));
    setSaved(true);
  }
  async function removeOtherOccurrence(dateStr) {
    await updateStudentRosterEntry(student.id, (r) => ({ ...r, otherScheduleExceptions: [...new Set([...(r.otherScheduleExceptions || []), dateStr])] }));
  }

  return html`
    <div>
      <${Card}>

        ${items.map((d, i) => {
          const isPreset = OTHER_SCHEDULE_PRESETS.includes(d.name);
          return html`
            <div key=${i} style=${{ border: `1px solid ${C.line}`, borderRadius: 4, padding: 10, marginBottom: 8 }}>
              <div style=${{ display: "flex", gap: 8, marginBottom: 8, flexWrap: "wrap" }}>
                <select style=${{ ...inputStyle, marginBottom: 0, width: 90 }} value=${d.day} onChange=${(e) => updateSlot(i, "day", e.target.value)}>
                  ${WEEKDAY_NAMES.map((n) => html`<option key=${n} value=${n}>${n}요일</option>`)}
                </select>
                <select style=${{ ...inputStyle, marginBottom: 0, width: 110 }} value=${isPreset ? d.name : "기타"} onChange=${(e) => updateSlot(i, "name", e.target.value === "기타" ? "" : e.target.value)}>
                  ${OTHER_SCHEDULE_PRESETS.map((n) => html`<option key=${n} value=${n}>${n}</option>`)}
                  <option value="기타">기타</option>
                </select>
                ${!isPreset && html`<input style=${{ ...inputStyle, marginBottom: 0, flex: 1, minWidth: 100 }} value=${d.name} onChange=${(e) => updateSlot(i, "name", e.target.value)} placeholder="학원/과목 이름 입력" />`}
                <button onClick=${() => removeSlot(i)} style=${{ background: "none", border: "none", color: C.danger, cursor: "pointer", fontSize: 18, padding: "0 4px" }}>×</button>
              </div>
              <div style=${{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
                <${TimeField} value=${d.time} onChange=${(v) => updateSlot(i, "time", v)} />
              </div>
            </div>
          `;
        })}
        <${Button} variant="ghost" style=${{ padding: "5px 12px", fontSize: 11.5, marginTop: 4 }} onClick=${addSlot}>+ 시간 추가<//>
        <div style=${{ display: "flex", alignItems: "center", gap: 10, marginTop: 12 }}>
          <${Button} variant="gold" style=${{ padding: "6px 14px", fontSize: 12 }} onClick=${save}>저장<//>
          ${saved && html`<span style=${{ fontSize: 11.5, color: C.navy }}>저장됐어요.</span>`}

        <div style=${{ fontSize: 12, fontWeight: 700, color: C.navy, marginBottom: 10 }}>월간 시간표 (과외 + 보강 + 다른 학원)</div>

function HomeworkStudentCard({ h, studentId, studentName, updateData }) {
  const [busy, setBusy] = useState(false); const [err, setErr] = useState("");
  const [lightbox, setLightbox] = useState(null);
  const inputId = `hwphoto-${h.id}`;
  const photos = h.photos || (h.photo ? [h.photo] : []);

  async function handleFile(e) {
    const files = Array.from(e.target.files || []);
    e.target.value = "";
    if (files.length === 0) return;
    setErr(""); setBusy(true);
    try {
      const newOnes = [];
      let runningTotal = photos.reduce((sum, p) => sum + (p ? photoUrl(p).length : 0), 0);
      const BUDGET = 550000; // leaves headroom under Firestore's 1MB-per-document cap for this student's other data
      for (const file of files) {
        const dataUrl = await withTimeout(compressImage(file, 640, 0.5), 20000, "storage/timeout");
        if (dataUrl.length > 180000) { setErr("사진 한 장의 용량이 너무 커서 건너뛰었어요."); continue; }
        if (runningTotal + dataUrl.length > BUDGET) { setErr("사진을 더 담기엔 이 학생의 저장 공간이 부족해요. '저장 공간 관리'에서 정리한 뒤 다시 시도해 주세요."); break; }
        runningTotal += dataUrl.length;
        newOnes.push({ url: dataUrl, uploadedAt: Date.now() });
      }
      if (newOnes.length > 0) {
        const save = () => updateData(studentId, (d) => ({
          ...d,
          homework: (d.homework || []).map((x) => (x.id === h.id ? { ...withoutLegacyPhoto(x), photos: [...(x.photos || (x.photo ? [x.photo] : [])), ...newOnes], done: true, doneAt: Date.now() } : x)),
        }));
        try {
          await save();
          notifyTeacher(studentName, "homework_upload");
        } catch (saveErr) {
          let recovered = false;
          if (isDocSizeError(saveErr)) recovered = await attemptAutoShrinkAndRetry(studentId, updateData, save);
          if (!recovered) throw saveErr;
          else notifyTeacher(studentName, "homework_upload");
        }
      }
    } catch (e) { setErr(friendlyErrorMessage(e)); }
    setBusy(false);
  }
  async function removePhoto(idx) {
    await updateData(studentId, (d) => ({
      ...d,
      homework: (d.homework || []).map((x) => (x.id === h.id ? { ...withoutLegacyPhoto(x), photos: (x.photos || (x.photo ? [x.photo] : [])).filter((_, i) => i !== idx) } : x)),
    }));
  }
  async function toggleDone() {
    const willBeDone = !h.done;
    await updateData(studentId, (d) => ({
      ...d,
      homework: (d.homework || []).map((x) => (x.id === h.id ? { ...x, done: willBeDone, doneAt: willBeDone ? Date.now() : null } : x)),
    }));
    if (willBeDone) notifyTeacher(studentName, "homework_done", h.content);
  }

  return html`
    <${Card}>
      <div style=${{ fontSize: 11.5, color: C.gold, fontWeight: 700 }}>내준 날짜 ${fmtDate(h.assignedDate)}</div>
      <div style=${{ fontSize: 13.5, marginTop: 6, whiteSpace: "pre-wrap" }}>${h.content}</div>
      ${photos.length > 0 && html`
        <div style=${{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 8 }}>
          ${photos.map((p, pi) => html`
            <div key=${pi} style=${{ position: "relative" }}>
              <img src=${photoUrl(p)} onClick=${() => setLightbox(photoUrl(p))} style=${{ width: 76, height: 76, objectFit: "cover", borderRadius: 4, border: `1px solid ${C.line}`, display: "block", cursor: "zoom-in" }} />
              <button onClick=${() => removePhoto(pi)} style=${{ position: "absolute", top: -6, right: -6, width: 20, height: 20, borderRadius: "50%", border: "none", background: C.danger, color: "#fff", fontSize: 11, cursor: "pointer", lineHeight: "20px", padding: 0 }}>✕</button>
            </div>
          `)}
        </div>
      `}
      ${h.expired ? html`
        <div style=${{ marginTop: 10, fontSize: 12.5, color: C.danger, fontWeight: 700 }}>⏳ 기간이 만료된 숙제예요. 선생님께 문의해 주세요.</div>
      ` : html`
        <div style=${{ display: "flex", alignItems: "center", gap: 12, marginTop: 10, flexWrap: "wrap" }}>
          <label htmlFor=${busy ? undefined : inputId} style=${{ fontSize: 12.5, fontWeight: 600, padding: "8px 14px", borderRadius: 3, border: `1px solid ${C.navy}`, color: busy ? C.slate : C.navy, cursor: busy ? "default" : "pointer", opacity: busy ? 0.6 : 1, pointerEvents: busy ? "none" : "auto" }}>
            ${busy ? "업로드 중..." : photos.length > 0 ? "인증샷 추가하기" : "인증샷 올리기"}
          </label>
          <input id=${inputId} type="file" accept="image/*" multiple onChange=${handleFile} style=${{ display: "none" }} disabled=${busy} />

          <div onClick=${toggleDone} style=${{ display: "inline-flex", alignItems: "center", gap: 6, cursor: "pointer", fontSize: 12.5, color: h.done ? C.gold : C.slate, fontWeight: 600 }}>
            ${h.done ? `✓ 완료함${h.doneAt ? ` (${fmtDateTime(h.doneAt)})` : ""}` : "완료로 표시하기"}
          </div>
        </div>
      `}
      ${err && html`<div style=${{ fontSize: 11.5, color: C.danger, marginTop: 6 }}>${err}</div>`}
      ${lightbox && html`<${PhotoLightbox} src=${lightbox} onClose=${() => setLightbox(null)} />`}
    <//>
  `;
}

function withTimeout(promise, ms, code) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject({ code: code || "timeout", message: `timed out after ${ms}ms` }), ms)),
  ]);
}
function stripUndefinedDeep(value) {
  if (Array.isArray(value)) return value.map(stripUndefinedDeep);
  if (value && typeof value === "object") {
    const out = {};
    Object.keys(value).forEach((k) => {
      if (value[k] !== undefined) out[k] = stripUndefinedDeep(value[k]);
    });
    return out;
  }
  return value;
}
function withoutLegacyPhoto(obj) {
  const { photo, ...rest } = obj;
  return rest;
}
// Homework photos used to be stored as bare data-URL strings; they're now {url, uploadedAt}
// objects so an upload time can be shown. These accessors read either shape so old saved
// entries keep displaying correctly without a migration pass.
function photoUrl(p) { return typeof p === "string" ? p : (p && p.url) || ""; }
function photoTime(p) { return typeof p === "string" ? null : (p && p.uploadedAt) || null; }
function isDocSizeError(e) {
  const msg = ((e && e.message) || "").toLowerCase();
  return msg.includes("1048487") || msg.includes("1048576") || msg.includes("maximum allowed size") || (msg.includes("longer than") && msg.includes("byte"));
}
function shrinkStudentData(d) {
  return {
    ...d,
    homework: (d.homework || []).map((h) => ({ ...withoutLegacyPhoto(h), photos: (h.photos || (h.photo ? [h.photo] : [])).filter((p) => p && photoUrl(p).length < 120000) })),
    vocabResults: (d.vocabResults || []).slice(0, 30),
    examResults: (d.examResults || []).slice(0, 30),
    mockExamResults: (d.mockExamResults || []).slice(0, 30),
    logs: (d.logs || []).slice(0, 60),
  };
}
async function attemptAutoShrinkAndRetry(studentId, updateData, retryFn) {
  if (!confirm("저장 공간이 가득 차서 실패했어요. 예전 방식 사진과 오래된 응시 기록을 정리하고 바로 다시 시도할까요? (최근 기록은 그대로 남아요)")) return false;
  try {
    await updateData(studentId, (d) => shrinkStudentData(d));
    await retryFn();
    return true;
  } catch (e2) {
    alert("정리는 됐지만 다시 저장하는 중 문제가 있었어요. 잠시 후 다시 시도해 주세요.");
    return false;
  }
}

function friendlyErrorMessage(e) {
  const raw = (e && e.code) || (e && e.message) || String(e);
  const base = friendlyErrorMessageBase(e);
  return `${base} (오류 세부정보: ${raw})`;
}
function friendlyErrorMessageBase(e) {
  const msg = ((e && e.message) || "").toLowerCase();
  const code = (e && e.code) || "";
  if (code === "storage/timeout") {
    return "사진을 처리하는 데 너무 오래 걸려서 중단했어요. 사진 용량이 너무 크거나 형식이 안 맞을 수 있어요. 다른 사진으로 다시 시도해 주세요.";
  }
  if (isDocSizeError(e)) {
    return "이 학생의 저장 공간이 가득 찼어요 (사진이 너무 많이 쌓였을 때 생겨요). 오래된 사진을 몇 장 지운 뒤 다시 시도해 주세요.";
  }
  if (code === "permission-denied") {
    return "저장 권한 문제가 있어요. Firebase 콘솔에서 Firestore 보안 규칙을 확인해 주세요.";
  }
  return "저장하는 데 문제가 있었어요. 인터넷 연결을 확인하고 다시 시도해 주세요.";
}

function checkWordAnswer(userAnswer, correctWord, synonyms) {
  const norm = normText(userAnswer);
  if (!norm) return false;
  if (norm === normText(correctWord)) return true;
  if ((synonyms || []).some((s) => normText(s) === norm)) return true;
  return isKnownSynonym(userAnswer, correctWord);
}

function TestTaker({ activeTest, onExit, onSubmit }) {
  const { type, test } = activeTest;
  const questions = type === "vocab" ? test.words : test.questions;
  const total = questions.length;
  const [directions] = useState(() => {
    if (type !== "vocab") return null;
    const vmode = test.mode || "mix";
    return questions.map(() => (vmode === "w2m" ? "w2m" : vmode === "m2w" ? "m2w" : (Math.random() < 0.5 ? "w2m" : "m2w")));
  });
  const [answers, setAnswers] = useState(type === "vocab" ? Array(total).fill("") : Array(total).fill(null));
  const [submitted, setSubmitted] = useState(false);
  const [result, setResult] = useState(null);
  const [breakdown, setBreakdown] = useState(null);

  function pick(qi, val) { if (submitted) return; setAnswers((a) => a.map((v, idx) => (idx === qi ? val : v))); }

  function submit() {
    let score = 0; const rows = [];
    questions.forEach((q, i) => {
      if (type === "vocab") {
        const dir = directions[i];
        if (dir === "w2m") {
          const ok = checkVocabAnswer(answers[i], q.meaning, q.synonyms);
          if (ok) score++;
          rows.push({ prompt: q.word || "(단어 없음)", given: answers[i] || "(빈칸)", correct: q.meaning || "(뜻 없음)", ok });
        } else {
          const ok = checkWordAnswer(answers[i], q.word, q.synonyms);
          if (ok) score++;
          const correctDisplay = (q.synonyms && q.synonyms.length) ? `${q.word || ""} (${q.synonyms.join(", ")}도 정답)` : (q.word || "(단어 없음)");
          rows.push({ prompt: q.meaning || "(뜻 없음)", given: answers[i] || "(빈칸)", correct: correctDisplay, ok });
        }
      } else {
        const ok = answers[i] === q.answer;
        if (ok) score++;
        const givenChoice = answers[i] != null ? q.choices[answers[i]] : null;
        rows.push({ prompt: q.q || "", given: givenChoice || "(선택 안 함)", correct: (q.choices && q.choices[q.answer]) || "", ok });
      }
    });
    setResult(score); setBreakdown(rows); setSubmitted(true);
  }

  if (submitted) {
    return html`
      <div>
        <${Card} style=${{ textAlign: "center", padding: 28 }}>
          <div style=${{ ...serif, fontSize: 20, color: C.navy, marginBottom: 8 }}>${test.title}</div>
          <div style=${{ fontSize: 12, color: C.slate, marginBottom: 16 }}>채점 결과</div>
          <div style=${{ fontSize: 34, ...serif, color: C.gold }}>${result} <span style=${{ fontSize: 18, color: C.slate }}>/ ${total}</span></div>
        <//>
        ${breakdown && html`
          <${Card}>
            ${breakdown.map((r, i) => html`
              <div key=${i} style=${{ padding: "8px 0", borderBottom: i < breakdown.length - 1 ? `1px solid ${C.line}` : "none" }}>
                <div style=${{ fontSize: 12.5, fontWeight: 700, color: C.navy, whiteSpace: "pre-wrap" }}>${i + 1}. ${r.prompt}</div>
                <div style=${{ fontSize: 12, marginTop: 3, color: r.ok ? C.navy : C.danger }}>내 답: ${r.given} ${r.ok ? "✓" : "✗"}</div>
                ${!r.ok && html`<div style=${{ fontSize: 12, color: C.slate, marginTop: 1 }}>정답: ${r.correct}</div>`}
              </div>
            `)}
          <//>
        `}
        <${Button} variant="gold" style=${{ width: "100%", justifyContent: "center" }} onClick=${() => onSubmit(result, total, breakdown)}>결과 저장하고 나가기<//>
      </div>
    `;
  }

  return html`
    <div>
      <${BackBtn} onClick=${onExit} />
      <div style=${{ ...serif, fontSize: 18, color: C.navy, marginBottom: 12 }}>${test.title}</div>
      ${questions.map((q, qi) => html`
        <${Card} key=${qi}>
          <div style=${{ fontSize: 13, fontWeight: 700, color: C.navy, marginBottom: 10, whiteSpace: "pre-wrap" }}>${qi + 1}. ${type === "vocab" ? (directions[qi] === "w2m" ? q.word : q.meaning) : q.q}</div>
          ${type === "vocab" ? html`
            <input style=${inputStyle} placeholder=${directions[qi] === "w2m" ? "뜻을 입력하세요" : "영어 단어를 입력하세요"} value=${answers[qi]} onChange=${(e) => pick(qi, e.target.value)} />
          ` : q.choices.map((opt, oi) => {
            const selected = answers[qi] === oi;
            return html`
              <div key=${oi} onClick=${() => pick(qi, oi)} style=${{ padding: "9px 12px", border: `1px solid ${selected ? C.gold : C.line}`, background: selected ? "#FBF4EA" : C.white, borderRadius: 3, marginBottom: 6, fontSize: 13, cursor: "pointer" }}>${opt}</div>
            `;
          })}
        <//>
      `)}
      <${Button} variant="gold" style=${{ width: "100%", justifyContent: "center" }} disabled=${answers.some((a) => a === null || a === "")} onClick=${submit}>제출하기<//>
    </div>
  `;
}

function DateView({ data, role }) {
  const [selDate, setSelDate] = useState(today());
  const logs = (data.logs || []).filter((l) => l.date === selDate);
  const homework = (data.homework || []).filter((h) => h.assignedDate === selDate);
  const vocabResults = (data.vocabResults || [])
    .filter((r) => r.date === selDate)
    .map((r) => ({ ...r, title: ((data.vocabTests || []).find((t) => t.id === r.testId) || {}).title || "단어 시험" }));
  const examResults = (data.examResults || [])
    .filter((r) => r.date === selDate)
    .map((r) => ({ ...r, title: ((data.examTests || []).find((t) => t.id === r.testId) || {}).title || "추가 시험" }));
  const mockResults = (data.mockExamResults || [])
    .filter((r) => r.date === selDate)
    .map((r) => ({ ...r, title: ((data.mockExams || []).find((t) => t.id === r.testId) || {}).title || "모의고사" }));
  const feedback = role !== "student" ? (data.feedback || []).filter((f) => f.date === selDate) : [];
  const nothing = logs.length === 0 && homework.length === 0 && vocabResults.length === 0 && examResults.length === 0 && mockResults.length === 0 && feedback.length === 0;

  return html`
    <div>
      <${Card}>
        <${Field} label="날짜 선택"><${DateField} value=${selDate} onChange=${setSelDate} /><//>
      <//>
      ${nothing && html`<${Empty} text="이 날짜에 기록된 내용이 없어요." />`}
      ${logs.length > 0 && html`
        <${SectionLabel} n=${1} label="학습 기록" />
        ${logs.map((l) => html`<${Card} key=${l.id}><div style=${{ fontSize: 13.5, whiteSpace: "pre-wrap" }}>${l.content}</div><//>`)}
      `}
      ${homework.length > 0 && html`
        <${SectionLabel} n=${2} label="숙제" />
        ${homework.map((h) => html`
          <${Card} key=${h.id}>
            <div style=${{ fontSize: 13.5, whiteSpace: "pre-wrap" }}>${h.content}</div>
            <div style=${{ fontSize: 12, marginTop: 6, color: h.done ? C.gold : h.expired ? C.danger : C.slate }}>${h.done ? "✓ 완료함" : h.expired ? "⏳ 기간만료" : "미완료"}</div>
          <//>
        `)}
      `}
      ${vocabResults.length > 0 && html`
        <${SectionLabel} n=${3} label="단어 시험 결과" />
        ${vocabResults.map((r) => html`<${Card} key=${r.id}><div style=${{ fontSize: 13.5 }}>${r.title} — <b>${r.score}</b> / ${r.total}</div><//>`)}
      `}
      ${examResults.length > 0 && html`
        <${SectionLabel} n=${4} label="추가 시험 결과" />
        ${examResults.map((r) => html`<${Card} key=${r.id}><div style=${{ fontSize: 13.5 }}>${r.title} — <b>${r.score}</b> / ${r.total}</div><//>`)}
      `}
      ${mockResults.length > 0 && html`
        <${SectionLabel} n=${5} label="모의고사 결과" />
        ${mockResults.map((r) => html`<${Card} key=${r.id}><div style=${{ fontSize: 13.5 }}>${r.title} — <b>${r.score}</b> / ${r.total}</div><//>`)}
      `}
      ${feedback.length > 0 && html`
        <${SectionLabel} n=${6} label="학부모 상담" />
        ${feedback.map((f) => html`<${Card} key=${f.id}><div style=${{ fontSize: 13.5, whiteSpace: "pre-wrap" }}>${f.from === "parent" ? "학부모: " : "선생님: "}${f.text}</div><//>`)}
      `}
    </div>
  `;
}
